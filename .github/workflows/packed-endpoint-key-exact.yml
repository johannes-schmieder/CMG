name: Packed endpoint-key exact-allocation qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/packed-endpoint-key-exact.yml'
      - 'scripts/packed_endpoint_key_exact_gate.py'

permissions:
  contents: write

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify packed ordering with exact allocation tracking
        run: python scripts/packed_endpoint_key_exact_gate.py

      - name: Show decision record
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/packed-endpoint-key-exact-latest.json || true
