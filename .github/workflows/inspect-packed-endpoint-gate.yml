name: Inspect packed endpoint-key gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-packed-endpoint-gate.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record latest packed-key workflow run
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          import json
          import os
          from pathlib import Path
          import urllib.request

          repository = os.environ['REPOSITORY']
          url = (
              f'https://api.github.com/repos/{repository}/actions/workflows/'
              'packed-endpoint-key-exact.yml/runs?branch=main&per_page=20'
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'cmg-ci-status-probe',
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          runs = payload.get('workflow_runs', [])
          selected = runs[0] if runs else None
          fields = (
              'id', 'run_number', 'run_attempt', 'event', 'status',
              'conclusion', 'head_sha', 'created_at', 'updated_at',
              'html_url', 'jobs_url', 'logs_url',
          )
          result = {
              'schema_version': 1,
              'workflow': 'packed-endpoint-key-exact.yml',
              'run_count_returned': len(runs),
              'latest': (
                  {key: selected.get(key) for key in fields}
                  if selected is not None else None
              ),
          }
          destination = Path(
              '.ci/performance/packed-endpoint-key-exact-run-status.json'
          )
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          Path('.github/workflows/inspect-packed-endpoint-gate.yml').unlink()

      - name: Commit status probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: record packed-key gate run status [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
