name: Final zipped ancestor-update gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zipped-ancestor-updates-v3.yml'

permissions:
  contents: write

concurrency:
  group: cmg-zipped-ancestor-updates-v3
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify zipped walk and ancestor-prefix updates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/zipped_ancestor_updates_gate_v3.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/zipped-ancestor-updates-latest.json || true
