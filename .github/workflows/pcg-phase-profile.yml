name: Profile certified PCG phases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pcg-phase-profile.yml'
      - 'scripts/run_pcg_phase_profile.py'

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and profile representative solves
        run: python scripts/run_pcg_phase_profile.py

      - name: Commit profiling receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: record certified PCG phase profile'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
