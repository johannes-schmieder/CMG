name: Apply recursive cycle comparison

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cycle-comparison.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire cycle benchmark
        shell: python
        run: |
          from pathlib import Path

          cycle = Path('benchmarks/c-kernel/src/cycle.rs')
          cycle_text = cycle.read_text()
          old = 'requested_dimension.min(CYCLE_DIMENSION_LIMIT).max(128)'
          new = 'requested_dimension.clamp(128, CYCLE_DIMENSION_LIMIT)'
          if cycle_text.count(old) != 1:
              raise SystemExit('cycle clamp anchor changed')
          cycle.write_text(cycle_text.replace(old, new, 1))

          main = Path('benchmarks/c-kernel/src/main.rs')
          text = main.read_text()
          replacements = [
              ('mod projection;\n', 'mod cycle;\nmod projection;\n'),
              (
                  '    let projection = projection::benchmark(&config.case, graph.vertex_count(), config.repetitions)?;\n\n    let json = format!(\n',
                  '    let projection = projection::benchmark(&config.case, graph.vertex_count(), config.repetitions)?;\n    let cycle = cycle::benchmark(&config.case, graph.vertex_count(), config.repetitions)?;\n\n    let json = format!(\n',
              ),
              ('            "  \\\"schema\\\": 2,\\n",\n', '            "  \\\"schema\\\": 3,\\n",\n'),
              (
                  '            "  \\\"max_scaled_error\\\": {:.17e},\\n",\n            "  \\\"projection\\\": {}\\n",\n            "}}\\n"\n',
                  '            "  \\\"max_scaled_error\\\": {:.17e},\\n",\n            "  \\\"projection\\\": {},\\n",\n            "  \\\"cycle\\\": {}\\n",\n            "}}\\n"\n',
              ),
              (
                  '        max_scaled_error,\n        projection.to_json(),\n    );\n',
                  '        max_scaled_error,\n        projection.to_json(),\n        cycle.to_json(),\n    );\n',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'main benchmark anchor changed: {old[:70]!r}')
              text = text.replace(old, new, 1)
          main.write_text(text)

      - name: Validate isolated benchmark crate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all
          cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all -- --check
          cargo clippy --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets --release
          cargo build --manifest-path benchmarks/c-kernel/Cargo.toml --release

      - name: Commit validated cycle benchmark
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-cycle-comparison.yml
          rm -f .github/workflows/wire-cycle-benchmark.yml
          rm -rf benchmarks/c-kernel/target
          rm -f benchmarks/c-kernel/Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: compare C and Rust recursive cycles'
          git pull --rebase origin main
          git push origin HEAD:main
