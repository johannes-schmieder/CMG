name: Align recursive repeat semantics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cycle-comparison.yml'

permissions:
  contents: write

jobs:
  fix-test-benchmark-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align production and independent references with upstream
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/preconditioner.rs')
          text = path.read_text()
          replacements = [
              (
                  '            self.apply_level(0, &projected_rhs, output, workspace, validation)\n',
                  '            self.apply_level(0, &projected_rhs, output, workspace, 1, validation)\n',
              ),
              (
                  '''    fn apply_level(\n        &self,\n        level_index: usize,\n        rhs: &[f64],\n        output: &mut [f64],\n        workspace: &mut CmgWorkspace,\n        validation: ValidationOptions,\n    ) -> Result<(), CmgError> {\n''',
                  '''    fn apply_level(\n        &self,\n        level_index: usize,\n        rhs: &[f64],\n        output: &mut [f64],\n        workspace: &mut CmgWorkspace,\n        iterations: usize,\n        validation: ValidationOptions,\n    ) -> Result<(), CmgError> {\n''',
              ),
              (
                  '''        let aggregation = level.aggregation().ok_or(CmgError::InvalidHierarchy {\n            context: "nonterminal level has no aggregation",\n        })?;\n        let repeat = self.repeat_counts[level_index];\n        if repeat == 0 {\n            return Err(CmgError::InvalidHierarchy {\n                context: "nonterminal level has zero recursive repeats",\n            });\n        }\n\n''',
                  '''        let aggregation = level.aggregation().ok_or(CmgError::InvalidHierarchy {\n            context: "nonterminal level has no aggregation",\n        })?;\n        if iterations == 0 {\n            return Err(CmgError::InvalidHierarchy {\n                context: "nonterminal level has zero stationary iterations",\n            });\n        }\n        let child_iterations = self.repeat_counts[level_index];\n        if child_iterations == 0 {\n            return Err(CmgError::InvalidHierarchy {\n                context: "nonterminal level has zero child recursive repeats",\n            });\n        }\n\n''',
              ),
              ('            for iteration in 0..repeat {\n', '            for iteration in 0..iterations {\n'),
              (
                  '''                    &mut local.coarse_correction,\n                    workspace,\n                    validation,\n''',
                  '''                    &mut local.coarse_correction,\n                    workspace,\n                    child_iterations,\n                    validation,\n''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'production repeat anchor changed: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('tests/upstream_cycle.rs')
          text = path.read_text()
          replacements = [
              (
                  '''fn reference_apply(\n    preconditioner: &CmgPreconditioner,\n    level_index: usize,\n    rhs: &[f64],\n) -> Vec<f64> {\n''',
                  '''fn reference_apply(\n    preconditioner: &CmgPreconditioner,\n    level_index: usize,\n    rhs: &[f64],\n    iterations: usize,\n) -> Vec<f64> {\n''',
              ),
              (
                  '    for _ in 0..preconditioner.repeat_counts()[level_index] {\n',
                  '    for _ in 0..iterations {\n',
              ),
              (
                  '''        let coarse_solution = reference_apply(preconditioner, level_index + 1, &coarse_rhs);\n''',
                  '''        let coarse_solution = reference_apply(\n            preconditioner,\n            level_index + 1,\n            &coarse_rhs,\n            preconditioner.repeat_counts()[level_index],\n        );\n''',
              ),
              (
                  '    let reference = reference_apply(&preconditioner, 0, &projected_rhs);\n',
                  '    let reference = reference_apply(&preconditioner, 0, &projected_rhs, 1);\n',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'allocating-reference anchor changed: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('benchmarks/c-kernel/upstream/preconditioner_iterative.c')
          text = path.read_text()
          old = '    apply_level(levels, b, 0, levels[0].repeat, x);\n'
          new = '    apply_level(levels, b, 0, 1, x);\n'
          if text.count(old) != 1:
              raise SystemExit('C top-level iteration anchor changed')
          path.write_text(text.replace(old, new, 1))

          path = Path('benchmarks/c-kernel/src/cycle.rs')
          text = path.read_text()
          old = 'requested_dimension.min(CYCLE_DIMENSION_LIMIT).max(128)'
          new = 'requested_dimension.clamp(128, CYCLE_DIMENSION_LIMIT)'
          if text.count(old) != 1:
              raise SystemExit('cycle dimension clamp anchor changed')
          path.write_text(text.replace(old, new, 1))

          path = Path('benchmarks/c-kernel/src/main.rs')
          text = path.read_text()
          replacements = [
              ('mod projection;\n', 'mod cycle;\nmod projection;\n'),
              (
                  '    let projection = projection::benchmark(&config.case, graph.vertex_count(), config.repetitions)?;\n\n    let json = format!(\n',
                  '    let projection = projection::benchmark(&config.case, graph.vertex_count(), config.repetitions)?;\n    let cycle = cycle::benchmark(&config.case, graph.vertex_count(), config.repetitions)?;\n\n    let json = format!(\n',
              ),
              ('            "  \\\"schema\\\": 2,\\n",\n', '            "  \\\"schema\\\": 3,\\n",\n'),
              (
                  '            "  \\\"max_scaled_error\\\": {:.17e},\\n",\n            "  \\\"projection\\\": {}\\n",\n            "}}\\n"\n',
                  '            "  \\\"max_scaled_error\\\": {:.17e},\\n",\n            "  \\\"projection\\\": {},\\n",\n            "  \\\"cycle\\\": {}\\n",\n            "}}\\n"\n',
              ),
              (
                  '        max_scaled_error,\n        projection.to_json(),\n    );\n',
                  '        max_scaled_error,\n        projection.to_json(),\n        cycle.to_json(),\n    );\n',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'cycle wiring anchor changed: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('UPSTREAM.md')
          text = path.read_text()
          anchor = '- repeat count `max(floor(nnz(A_fine) / nnz(A_coarse) - 1), 1)`;\n'
          addition = (
              '- the public preconditioner applies one top-level stationary cycle; '
              'a level\'s repeat count controls the recursive solve at its child level;\n'
          )
          if addition not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('upstream repeat documentation anchor changed')
              text = text.replace(anchor, anchor + addition, 1)
          path.write_text(text)

      - name: Validate corrected library and comparison crate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo check --lib --no-default-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          cargo test --all-targets --all-features --release
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --all-features
          cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all
          cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all -- --check
          cargo clippy --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets --release

      - name: Execute pinned C and corrected Rust recursive cycles
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-cycle-corrected"
          CMG_BENCH_COMMIT="$(git rev-parse HEAD)" \
            cargo build --manifest-path benchmarks/c-kernel/Cargo.toml --release
          BINARY="$CARGO_TARGET_DIR/release/cmg-c-kernel-bench"
          mkdir -p .ci/performance/cycle-corrected
          for CASE in path worker-firm; do
            "$BINARY" \
              --case "$CASE" \
              --vertices 100000 \
              --repetitions 7 \
              --output ".ci/performance/cycle-corrected/${CASE}.json"
          done

      - name: Verify evidence and update live plan
        shell: python
        run: |
          import json
          import math
          import subprocess
          from pathlib import Path

          directory = Path('.ci/performance/cycle-corrected')
          results = {}
          for case, filename in (('path', 'path.json'), ('worker_firm', 'worker-firm.json')):
              record = json.loads((directory / filename).read_text())
              cycle = record.get('cycle')
              if not isinstance(cycle, dict):
                  raise SystemExit(f'{case}: missing recursive cycle record')
              quotient_error = cycle.get('quotient_max_scaled_error')
              ratio = cycle.get('rust_over_c')
              if not isinstance(quotient_error, (int, float)) or not math.isfinite(quotient_error):
                  raise SystemExit(f'{case}: invalid quotient error')
              if quotient_error > 5.0e-10:
                  raise SystemExit(f'{case}: recursive cycle mismatch {quotient_error:e}')
              if not isinstance(ratio, (int, float)) or not math.isfinite(ratio) or ratio <= 0.0:
                  raise SystemExit(f'{case}: invalid Rust/C timing ratio')
              results[case] = record

          tested_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          retained = {
              'schema': 2,
              'tested_sha': tested_sha,
              'upstream_commit': '19752fc102f8cae8e34f66457bfaccb1aaa60375',
              'success': True,
              'finding': (
                  'Official CMG runs one top-level cycle and uses each level repeat '
                  'count for the child recursive solve. The Rust port and all '
                  'independent references now use that schedule.'
              ),
              'results': results,
          }
          Path('.ci/performance/cycle-wiring-latest.json').write_text(
              json.dumps(retained, indent=2) + '\n'
          )

          plan = Path('PERFORMANCE_PLAN.md')
          text = plan.read_text()
          old_status = (
              '| P7 Pinned C comparison | IN PROGRESS | `sspmv`, restriction, and '
              'prolongation agree and are timed; recursive-cycle comparison remains |'
          )
          new_status = (
              '| P7 Pinned C comparison | COMPLETE | `sspmv`, restriction, '
              'prolongation, and the complete stationary recursive cycle agree and '
              'are timed |'
          )
          if old_status in text:
              text = text.replace(old_status, new_status, 1)

          anchor = (
              '- A raw-pointer candidate for removing aggregation label bounds '
              'checks was rejected before timing because the production crate '
              'forbids unsafe code; the validated safe loops remain in place.\n'
          )
          addition = (
              '- The first complete C-cycle differential test exposed a shifted '
              'repeat schedule in the Rust port. Official CMG applies one top-level '
              'cycle and uses each level\'s repeat count for its child solve; '
              'production Rust, the allocating oracle, and the C adapter now match '
              'that convention, and full-cycle quotient-space agreement is checked '
              'before timing.\n'
          )
          if addition not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('performance-plan repeat-fix anchor changed')
              text = text.replace(anchor, anchor + addition, 1)

          log_anchor = '| 2026-08-22 | `7b3aafda` | C benchmark retention was hardened against cancelled and superseded runs |\n'
          log_entry = (
              '| 2026-08-22 | corrected recursive schedule | Full pinned-C cycle '
              'differential test found and fixed shifted repeat semantics; all '
              'debug/release tests and Rust/C cycle comparisons passed |\n'
          )
          if log_entry not in text:
              if text.count(log_anchor) != 1:
                  raise SystemExit('performance-plan checkpoint anchor changed')
              text = text.replace(log_anchor, log_anchor + log_entry, 1)

          old_next = (
              'Repair and complete the pinned-C stationary recursive-cycle '
              'benchmark, then benchmark the six-vector PCG workspace against the '
              'frozen baseline. Continue the single-RHS PCG/CMG audit only with '
              'safe deterministic kernels. Large 8–32-thread qualification remains '
              'dependent on a larger or self-hosted runner.'
          )
          new_next = (
              'Re-run matched serial and parallel performance benchmarks under the '
              'corrected upstream repeat schedule, including the six-vector PCG '
              'workspace. Then continue the single-RHS PCG/CMG audit only with safe '
              'deterministic kernels. Large 8–32-thread qualification remains '
              'dependent on a larger or self-hosted runner.'
          )
          if old_next in text:
              text = text.replace(old_next, new_next, 1)
          plan.write_text(text)

      - name: Commit validated upstream alignment
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-cycle-comparison.yml
          rm -f .github/workflows/wire-cycle-benchmark.yml
          rm -rf target benchmarks/c-kernel/target .ci/performance/cycle-corrected
          rm -f benchmarks/c-kernel/Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align recursive repeat schedule with upstream CMG'
          git pull --rebase origin main
          git push origin HEAD:main
