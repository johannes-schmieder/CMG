name: Profile split-forest after conductance refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-split-forest-post-conductance.yml'

permissions:
  contents: write

concurrency:
  group: cmg-split-forest-post-conductance-profile
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compile, validate, and profile updated split phases
        shell: bash
        run: |
          set -euo pipefail
          python scripts/profile_split_forest_post_conductance.py

      - name: Show profile record
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/split-forest-subphase-profile-post-conductance.json || true
