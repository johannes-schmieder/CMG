name: Optimize compatible RHS apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-compatible-apply.yml'

concurrency:
  group: optimize-compatible-apply
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  benchmark-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and benchmark current production path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compatible-results"

          CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-compatible-baseline-root" \
            cargo build --release --bin cmg-bench
          cp "$RUNNER_TEMP/cmg-compatible-baseline-root/release/cmg-bench" \
             "$RUNNER_TEMP/cmg-bench-baseline"

          CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-compatible-baseline-c" \
            cargo build --manifest-path benchmarks/c-kernel/Cargo.toml --release
          cp "$RUNNER_TEMP/cmg-compatible-baseline-c/release/cmg-c-kernel-bench" \
             "$RUNNER_TEMP/cmg-c-kernel-baseline"

          for CASE in path worker-firm; do
            "$RUNNER_TEMP/cmg-bench-baseline" \
              --case "$CASE" --vertices 20000 --rhs 4 --repetitions 5 \
              --output "$RUNNER_TEMP/compatible-results/solve-baseline-${CASE}.json"
            "$RUNNER_TEMP/cmg-c-kernel-baseline" \
              --case "$CASE" --vertices 100000 --repetitions 9 \
              --output "$RUNNER_TEMP/compatible-results/cycle-baseline-${CASE}.json"
          done

      - name: Add compatible-RHS stationary core path
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/preconditioner.rs')
          text = path.read_text()
          anchor = '    /// Apply with explicit compatibility-validation tolerances.\n'
          method = '''    /// Apply a right-hand side already known to be component-compatible.
    ///
    /// This skips the fine-level compatibility scan and projection performed by
    /// [`Self::apply_into`]. It is intended for Krylov solvers that validate and
    /// project the submitted right-hand side once, then keep residuals in the
    /// Laplacian range. Dimension, workspace, and option checks remain enabled,
    /// and recursive coarse-level roundoff handling is unchanged.
    pub fn apply_compatible_into(
        &self,
        rhs: &[f64],
        output: &mut [f64],
        workspace: &mut CmgWorkspace,
    ) -> Result<(), CmgError> {
        self.apply_compatible_into_with_validation(
            rhs,
            output,
            workspace,
            ValidationOptions::default(),
        )
    }

    /// Apply an already compatible right-hand side with explicit internal
    /// validation tolerances.
    ///
    /// Callers are responsible for ensuring component-wise compatibility. The
    /// method is safe for arbitrary slices, but an incompatible right-hand side
    /// does not represent a solvable graph-Laplacian system.
    pub fn apply_compatible_into_with_validation(
        &self,
        rhs: &[f64],
        output: &mut [f64],
        workspace: &mut CmgWorkspace,
        validation: ValidationOptions,
    ) -> Result<(), CmgError> {
        let dimension = self.hierarchy.levels()[0].graph().vertex_count();
        if rhs.len() != dimension {
            return Err(CmgError::dimension(
                "CmgPreconditioner::apply compatible rhs",
                dimension,
                rhs.len(),
            ));
        }
        if output.len() != dimension {
            return Err(CmgError::dimension(
                "CmgPreconditioner::apply compatible output",
                dimension,
                output.len(),
            ));
        }
        workspace.validate(
            &self.hierarchy,
            self.direct_terminal.as_ref(),
            &self.level_components,
        )?;
        validation.validate()?;
        self.apply_level(0, rhs, output, workspace, 1, validation)
    }

'''
          if method not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('compatible method insertion anchor changed')
              text = text.replace(anchor, method + anchor, 1)
          path.write_text(text)

          path = Path('src/pcg.rs')
          text = path.read_text()
          old_name = 'preconditioner.apply_into_with_validation'
          new_name = 'preconditioner.apply_compatible_into_with_validation'
          if text.count(old_name) != 2:
              raise SystemExit(
                  f'expected two PCG preconditioner calls, found {text.count(old_name)}'
              )
          text = text.replace(old_name, new_name)
          loop_anchor = '''        if iteration == options.max_iterations {
            break;
        }

        preconditioner.apply_compatible_into_with_validation(
'''
          loop_replacement = '''        if iteration == options.max_iterations {
            break;
        }

        // The submitted RHS was projected once at the public boundary. Remove
        // only component-nullspace roundoff accumulated by recursive updates
        // before using the compatible stationary core again.
        components.center_in_place_with_workspace(
            &mut workspace.residual,
            &mut workspace.component,
        )?;
        preconditioner.apply_compatible_into_with_validation(
'''
          if text.count(loop_anchor) != 1:
              raise SystemExit('PCG residual-centering anchor changed')
          path.write_text(text.replace(loop_anchor, loop_replacement, 1))

          path = Path('benchmarks/c-kernel/src/cycle.rs')
          text = path.read_text()
          old = 'preconditioner.apply_into('
          new = 'preconditioner.apply_compatible_into('
          if text.count(old) != 3:
              raise SystemExit(
                  f'expected three cycle apply calls, found {text.count(old)}'
              )
          path.write_text(text.replace(old, new))

          path = Path('tests/upstream_cycle.rs')
          text = path.read_text()
          old = '''    let reference = reference_apply(&preconditioner, 0, &projected_rhs, 1);
    assert_vector_close(&production, &reference, 1.0e-12);
'''
          new = '''    let reference = reference_apply(&preconditioner, 0, &projected_rhs, 1);
    let mut compatible_workspace = preconditioner.workspace();
    let mut compatible = vec![0.0; graph.vertex_count()];
    preconditioner
        .apply_compatible_into(
            &projected_rhs,
            &mut compatible,
            &mut compatible_workspace,
        )
        .unwrap();
    assert_vector_close(&production, &reference, 1.0e-12);
    assert_vector_close(&compatible, &reference, 1.0e-12);
'''
          if text.count(old) != 1:
              raise SystemExit('upstream-cycle compatible assertion anchor changed')
          path.write_text(text.replace(old, new, 1))

      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo check --lib --no-default-features
          cargo clippy --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --all-features
          cargo test --all-targets
          cargo test --all-targets --release
          cargo test --all-targets --all-features
          cargo test --all-targets --all-features --release
          cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all
          cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all -- --check
          cargo clippy --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets --release

      - name: Build and benchmark candidate
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-compatible-candidate-root" \
            cargo build --release --bin cmg-bench
          cp "$RUNNER_TEMP/cmg-compatible-candidate-root/release/cmg-bench" \
             "$RUNNER_TEMP/cmg-bench-candidate"

          CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-compatible-candidate-c" \
            cargo build --manifest-path benchmarks/c-kernel/Cargo.toml --release
          cp "$RUNNER_TEMP/cmg-compatible-candidate-c/release/cmg-c-kernel-bench" \
             "$RUNNER_TEMP/cmg-c-kernel-candidate"

          for CASE in path worker-firm; do
            "$RUNNER_TEMP/cmg-bench-candidate" \
              --case "$CASE" --vertices 20000 --rhs 4 --repetitions 5 \
              --output "$RUNNER_TEMP/compatible-results/solve-candidate-${CASE}.json"
            "$RUNNER_TEMP/cmg-c-kernel-candidate" \
              --case "$CASE" --vertices 100000 --repetitions 9 \
              --output "$RUNNER_TEMP/compatible-results/cycle-candidate-${CASE}.json"
          done

      - name: Evaluate same-run result
        id: evaluate
        shell: python
        run: |
          import json
          import math
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'compatible-results'
          cycle_ratios = {}
          solve_ratios = {}
          records = {}
          valid = True
          for case in ('path', 'worker-firm'):
              cycle_baseline = json.loads(
                  (root / f'cycle-baseline-{case}.json').read_text()
              )
              cycle_candidate = json.loads(
                  (root / f'cycle-candidate-{case}.json').read_text()
              )
              solve_baseline = json.loads(
                  (root / f'solve-baseline-{case}.json').read_text()
              )
              solve_candidate = json.loads(
                  (root / f'solve-candidate-{case}.json').read_text()
              )
              records[case] = {
                  'cycle_baseline': cycle_baseline,
                  'cycle_candidate': cycle_candidate,
                  'solve_baseline': solve_baseline,
                  'solve_candidate': solve_candidate,
              }
              cycle_ratios[case] = (
                  cycle_candidate['cycle']['rust_median_ns']
                  / cycle_baseline['cycle']['rust_median_ns']
              )
              solve_ratios[case] = (
                  solve_candidate['solve_per_rhs_median_ns']
                  / solve_baseline['solve_per_rhs_median_ns']
              )
              valid &= (
                  cycle_candidate['cycle']['quotient_max_scaled_error'] <= 5.0e-10
              )
              valid &= solve_candidate['iterations'] <= solve_baseline['iterations']
              valid &= all(
                  value == value and value < 1.0e-6
                  for value in solve_candidate['backward_errors']
              )

          cycle_geomean = math.exp(
              sum(math.log(value) for value in cycle_ratios.values())
              / len(cycle_ratios)
          )
          solve_geomean = math.exp(
              sum(math.log(value) for value in solve_ratios.values())
              / len(solve_ratios)
          )
          accepted = (
              valid
              and max(cycle_ratios.values()) <= 1.03
              and cycle_geomean <= 0.98
              and max(solve_ratios.values()) <= 1.03
              and solve_geomean <= 0.995
              and min(solve_ratios.values()) <= 0.985
          )
          record = {
              'schema': 2,
              'tested_sha': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'accepted': accepted,
              'valid': valid,
              'cycle_ratios': cycle_ratios,
              'cycle_geometric_mean_ratio': cycle_geomean,
              'solve_ratios': solve_ratios,
              'solve_geometric_mean_ratio': solve_geomean,
              'records': records,
          }
          Path('.ci/performance/compatible-apply-latest.json').write_text(
              json.dumps(record, indent=2) + '\n'
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'accepted={str(accepted).lower()}\n')

      - name: Commit accepted optimization or retained experiment
        shell: bash
        env:
          ACCEPTED: ${{ steps.evaluate.outputs.accepted }}
        run: |
          set -euo pipefail
          rm .github/workflows/optimize-compatible-apply.yml
          rm -rf target benchmarks/c-kernel/target
          rm -f benchmarks/c-kernel/Cargo.lock
          if [ "$ACCEPTED" != true ]; then
            git restore src/preconditioner.rs src/pcg.rs tests/upstream_cycle.rs benchmarks/c-kernel/src/cycle.rs
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if [ "$ACCEPTED" = true ]; then
            git commit -m 'perf: skip repeated fine-level projection in PCG'
          else
            git commit -m 'perf: record compatible-RHS fast-path experiment'
          fi
          git pull --rebase origin main
          git push origin HEAD:main
