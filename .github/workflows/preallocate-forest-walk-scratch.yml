name: Preallocated forest-walk scratch gate
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/preallocate-forest-walk-scratch.yml
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/preallocate_forest_walk_scratch_gate.py
