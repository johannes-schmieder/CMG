name: Repair terminal factor evaluator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-terminal-factor-evaluator.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select each case record before validating metadata
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/terminal_factor_experiment.py')
          text = path.read_text()
          old = '''        for round_index, record in enumerate(baseline_rounds + candidate_rounds):
            for field in ("case", "vertices", "edges", "repetitions"):
                if record[field] != first[field]:
                    reasons.append(f"{case}: round {round_index} changed {field}")
'''
          new = '''        for round_index, round_records in enumerate(
            baseline_rounds + candidate_rounds
        ):
            record = round_records[case]
            for field in ("case", "vertices", "edges", "repetitions"):
                if record[field] != first[field]:
                    reasons.append(f"{case}: round {round_index} changed {field}")
'''
          if text.count(old) != 1:
              raise SystemExit(f'evaluator loop anchor changed: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

      - name: Validate and commit repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/terminal_factor_experiment.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/terminal_factor_experiment.py
          git commit -m 'ci: repair terminal benchmark record parsing'
          git pull --rebase origin main
          git push origin HEAD:main
