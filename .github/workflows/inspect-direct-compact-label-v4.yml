name: Inspect corrected direct compact-label gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-direct-compact-label-v4.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record workflow runs and self-remove
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess

          repository = os.environ['GITHUB_REPOSITORY']
          workflow = 'direct-compact-forest-labels-v4.yml'
          completed = subprocess.run(
              [
                  'gh', 'api', '-X', 'GET',
                  f'repos/{repository}/actions/workflows/{workflow}/runs',
                  '-f', 'per_page=10',
              ],
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )
          record = {
              'schema_version': 1,
              'workflow': workflow,
              'api_returncode': completed.returncode,
              'raw_output': completed.stdout if completed.returncode else '',
              'runs': [],
          }
          if completed.returncode == 0:
              payload = json.loads(completed.stdout)
              record['runs'] = [
                  {
                      'id': run['id'],
                      'head_sha': run['head_sha'],
                      'status': run['status'],
                      'conclusion': run['conclusion'],
                      'run_attempt': run['run_attempt'],
                      'created_at': run['created_at'],
                      'updated_at': run['updated_at'],
                      'html_url': run['html_url'],
                  }
                  for run in payload.get('workflow_runs', [])
              ]
          destination = Path('.ci/performance/direct-compact-label-v4-run-status.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
          Path('.github/workflows/inspect-direct-compact-label-v4.yml').unlink()

      - name: Commit inspection record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: record corrected compact-label gate status'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
