name: Packed endpoint-key exact-allocation qualification v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/packed-endpoint-key-exact-v2.yml'
      - 'scripts/packed_endpoint_key_exact_gate_v2.py'

permissions:
  contents: write

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Explicit rerun after the workflow-file creation checkpoint.
      - name: Qualify packed ordering with exact requested-allocation tracking
        run: python scripts/packed_endpoint_key_exact_gate_v2.py

      - name: Show decision record
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/packed-endpoint-key-exact-latest.json || true
