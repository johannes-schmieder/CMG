name: Packed forest visit-map gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/packed-forest-visit-map.yml'

permissions:
  contents: write

concurrency:
  group: cmg-packed-forest-visit-map
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify explicit packed forest visit map
        shell: bash
        run: |
          set -euo pipefail
          python scripts/packed_forest_visit_map_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/packed-forest-visit-map-latest.json || true
