name: Compact edge endpoints

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-edge-endpoints.yml'
      - 'scripts/compact_edge_endpoints.py'
      - 'scripts/compact_edge_endpoint_gate.py'

concurrency:
  group: cmg-compact-edge-endpoints
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify compact retained edge endpoints
        run: python scripts/compact_edge_endpoint_gate.py

      - name: Show retained result
        if: always()
        run: git show origin/main:.ci/performance/compact-edge-endpoints-latest.json || true
