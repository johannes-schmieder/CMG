name: Hierarchy phase profile rerun

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hierarchy-phase-profile-rerun.yml'
      - 'benchmarks/src/bin/hierarchy-phase-profile.rs'

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and record hierarchy setup phases
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          workflow_path = Path('.github/workflows/hierarchy-phase-profile-rerun.yml')
          source_path = Path('benchmarks/src/bin/hierarchy-phase-profile.rs')
          record_path = Path('.ci/performance/hierarchy-phase-profile.json')
          plan_path = Path('PERFORMANCE_PLAN.md')
          status_path = Path('PERFORMANCE_STATUS.md')
          base_sha = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()

          result = {
              'schema_version': 2,
              'experiment': 'hierarchy-phase-profile',
              'profiled_base_sha': base_sha,
              'status': 'not_run',
              'cases': {},
          }

          def run(command, *, env=None, timeout=9000):
              print('+', ' '.join(command), flush=True)
              completed = subprocess.run(
                  command,
                  cwd=root,
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
              )
              print(completed.stdout, end='')
              if completed.returncode != 0:
                  raise RuntimeError(
                      f"command failed ({completed.returncode}): {' '.join(command)}"
                  )
              return completed

          def parse_profile(completed):
              payloads = [
                  json.loads(line)
                  for line in completed.stdout.splitlines()
                  if line.strip().startswith('{')
              ]
              if len(payloads) != 1:
                  raise RuntimeError(f'unexpected profiler output: {payloads}')
              profile = payloads[0]
              required = (
                  'case', 'vertices', 'edges', 'levels', 'terminal_reason',
                  'production_hierarchy_median_ns',
                  'production_preconditioner_median_ns',
                  'manual_total_median_ns', 'manual_attributed_ns',
                  'dominant_phase', 'dominant_phase_share',
                  'phase_median_ns',
              )
              missing = [key for key in required if key not in profile]
              if missing:
                  raise RuntimeError(f'profile missing keys: {missing}')
              if profile['manual_attributed_ns'] > profile['manual_total_median_ns'] * 1.05:
                  raise RuntimeError('attributed phase time materially exceeds manual total')
              return profile

          def update_documents(payload):
              cases = payload.get('cases', {})
              dominant = payload.get('dominant_phase', 'unresolved')
              share = payload.get('dominant_phase_share_of_manual_total', 0.0)
              status = payload.get('status', 'failure')

              case_lines = []
              for name, case in cases.items():
                  case_lines.append(
                      f"- `{name}`: `{case['dominant_phase']}` "
                      f"({100.0 * case['dominant_phase_share']:.1f}% of the "
                      "manual measured total); production/manual hierarchy ratio "
                      f"{case['production_hierarchy_over_manual']:.3f}."
                  )
              cases_text = '\n'.join(case_lines) or '- No completed cases.'

              checkpoint = f"""### Hierarchy phase-profile rerun checkpoint — 2026-08-23

          - Read-only benchmark status: `{status}`.
          - Aggregate dominant measured phase: `{dominant}`
            ({100.0 * share:.1f}% of summed manual-profile time).
          {cases_text}
          - The profiler checks terminal reason, level vertex counts, matrix nonzeros,
            and fill accounting against production hierarchy construction before timing
            is interpreted.
          - No production numerical behavior changed in this checkpoint.
          - Machine-readable evidence:
            `.ci/performance/hierarchy-phase-profile.json`.

          """
              plan = plan_path.read_text()
              marker = '## Current next action\n'
              if marker not in plan:
                  raise RuntimeError('PERFORMANCE_PLAN current-action marker missing')
              prefix = plan.split(marker, 1)[0]
              if '### Hierarchy phase-profile rerun checkpoint — 2026-08-23' not in prefix:
                  prefix += checkpoint
              if status == 'success':
                  actions = f"""## Current next action

          1. Prepare a baseline/candidate retain-or-revert gate targeting the measured
             `{dominant}` setup phase; do not mutate production numerical source before
             the gate is committed.
          2. Preserve packed-key ordering, direct compact contraction, automatic
             parallel routing, and residual certification as regression gates.
          3. Obtain controlled 8-, 16-, and 32-thread/high-memory evidence when suitable
             hardware is available.
          """
              else:
                  actions = """## Current next action

          1. Inspect the recorded compiler/test failure and repair the read-only profiler.
          2. Do not mutate production numerical source until the phase profile succeeds.
          3. Obtain controlled 8-, 16-, and 32-thread/high-memory evidence when suitable
             hardware is available.
          """
              plan_path.write_text(prefix.rstrip() + '\n\n' + actions)

              status_text = status_path.read_text()
              start = '## Next prepared optimization\n'
              end = '## Remaining major work\n'
              if start not in status_text or end not in status_text:
                  raise RuntimeError('PERFORMANCE_STATUS optimization markers missing')
              before, remainder = status_text.split(start, 1)
              _, after = remainder.split(end, 1)
              if status == 'success':
                  next_section = f"""## Next prepared optimization

          The read-only hierarchy phase profiler completed successfully. Across the
          large synthetic cases, the aggregate dominant measured setup phase was
          `{dominant}` at {100.0 * share:.1f}% of summed manual-profile time.

          The next numerical mutation must be a baseline/candidate retain-or-revert gate
          targeting that phase while preserving exact hierarchy diagnostics, terminal
          behavior, cross-platform tests, requested-allocation accounting, and serial
          and parallel timing limits. The profiler is retained at
          `benchmarks/src/bin/hierarchy-phase-profile.rs`.

          """
              else:
                  next_section = """## Next prepared optimization

          The read-only hierarchy phase profiler did not complete successfully. Inspect
          `.ci/performance/hierarchy-phase-profile.json` and repair the benchmark before
          staging another production numerical optimization.

          """
              status_path.write_text(before + next_section + end + after)

          try:
              run(['cargo', 'fmt', '--all'])
              run([
                  'cargo', 'fmt', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all',
              ])
              run(['cargo', 'fmt', '--all', '--', '--check'])
              run([
                  'cargo', 'fmt', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all', '--', '--check',
              ])
              run([
                  'cargo', 'clippy', '--all-targets', '--all-features',
                  '--', '-D', 'warnings',
              ])
              run([
                  'cargo', 'clippy', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all-targets', '--', '-D', 'warnings',
              ])
              doc_env = os.environ.copy()
              doc_env['RUSTDOCFLAGS'] = '-D warnings'
              run([
                  'cargo', 'doc', '--no-deps', '--document-private-items',
                  '--all-features',
              ], env=doc_env)
              run(['cargo', 'test', '--all-targets', '--all-features'])
              run([
                  'cargo', 'test', '--all-targets', '--all-features',
                  '--release',
              ])
              run([
                  'cargo', 'build', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all-targets', '--release',
              ])

              binary = Path('benchmarks/target/release/hierarchy-phase-profile')
              specs = [
                  ('path-1m', ['path', '1000000', '3']),
                  ('worker-firm-1.5m', ['worker-firm', '500000', '3']),
                  ('dense-worker-firm-1.6m', [
                      'dense-worker-firm', '100000', '3'
                  ]),
              ]
              for name, arguments in specs:
                  completed = run([str(binary), *arguments], timeout=9000)
                  result['cases'][name] = parse_profile(completed)

              phase_totals = {}
              manual_total = 0
              hierarchy_total = 0
              preconditioner_total = 0
              for case in result['cases'].values():
                  manual_total += case['manual_total_median_ns']
                  hierarchy_total += case['production_hierarchy_median_ns']
                  preconditioner_total += case['production_preconditioner_median_ns']
                  for phase, value in case['phase_median_ns'].items():
                      phase_totals[phase] = phase_totals.get(phase, 0) + value

              dominant_phase, dominant_ns = max(
                  phase_totals.items(), key=lambda item: item[1]
              )
              result.update({
                  'status': 'success',
                  'phase_total_ns': phase_totals,
                  'summed_manual_total_ns': manual_total,
                  'summed_production_hierarchy_ns': hierarchy_total,
                  'summed_production_preconditioner_ns': preconditioner_total,
                  'dominant_phase': dominant_phase,
                  'dominant_phase_share_of_manual_total':
                      dominant_ns / max(manual_total, 1),
                  'manual_attributed_share':
                      sum(phase_totals.values()) / max(manual_total, 1),
              })
          except Exception as error:
              result['status'] = 'failure'
              result['error'] = repr(error)
              print(f'hierarchy phase profile failed: {error}', flush=True)
              source_path.unlink(missing_ok=True)

          record_path.parent.mkdir(parents=True, exist_ok=True)
          record_path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          update_documents(result)
          workflow_path.unlink(missing_ok=True)

          run(['git', 'config', 'user.name', 'github-actions[bot]'])
          run([
              'git', 'config', 'user.email',
              '41898282+github-actions[bot]@users.noreply.github.com',
          ])
          run(['git', 'add', '-A'])
          message = (
              'perf: profile hierarchy setup phases'
              if result['status'] == 'success'
              else 'perf: record hierarchy phase profiler compile failure'
          )
          run(['git', 'commit', '-m', message])
          run(['git', 'pull', '--rebase', 'origin', 'main'])
          run(['git', 'push', 'origin', 'HEAD:main'])

      - name: Show profile
        if: always()
        shell: bash
        run: |
          git show origin/main:.ci/performance/hierarchy-phase-profile.json || true
