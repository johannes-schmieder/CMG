name: Repaired routed fused forest-scratch gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/routed-fused-walk-scratch-v2.yml'

permissions:
  contents: write

concurrency:
  group: cmg-routed-fused-walk-scratch
  cancel-in-progress: true

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify repaired routed fused forest scratch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/routed_fused_walk_scratch_gate_v2.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/routed-fused-walk-scratch-latest.json || true
