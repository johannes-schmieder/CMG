name: Manual 1-32 thread qualification

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label, for example self-hosted or a configured larger-runner label'
        required: true
        default: 'self-hosted'
        type: string
      worker_firm_scale:
        description: 'Worker-firm scale passed to full-pcg-routing'
        required: true
        default: '1000000'
        type: string
      dense_scale:
        description: 'Dense worker-firm scale passed to full-pcg-routing'
        required: true
        default: '200000'
        type: string
      repetitions:
        description: 'Timed repetitions per case and thread count'
        required: true
        default: '3'
        type: string

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Record machine topology
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-output
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "date_utc=$(date -u +%FT%TZ)"
            echo "uname=$(uname -a)"
            echo "logical_cpus=$(getconf _NPROCESSORS_ONLN 2>/dev/null || true)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            command -v lscpu >/dev/null 2>&1 && lscpu || true
            command -v free >/dev/null 2>&1 && free -h || true
          } | tee qualification-output/machine.txt

      - name: Build qualified benchmark
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features --release
          cargo build \
            --release \
            --manifest-path benchmarks/Cargo.toml \
            --bin full-pcg-routing

      - name: Run thread scaling cases
        shell: bash
        run: |
          set -euo pipefail
          binary=benchmarks/target/release/full-pcg-routing
          output=qualification-output/scaling.jsonl
          : > "$output"
          available=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 1)
          for threads in 1 2 4 8 16 32; do
            if [ "$threads" -gt "$available" ]; then
              echo "Skipping $threads threads on $available logical CPUs" | tee -a qualification-output/skipped.txt
              continue
            fi
            for case_spec in \
              "worker-firm ${{ inputs.worker_firm_scale }}" \
              "dense-worker-firm ${{ inputs.dense_scale }}"; do
              set -- $case_spec
              case_name=$1
              scale=$2
              echo "Running $case_name scale=$scale threads=$threads"
              /usr/bin/time -v \
                -o "qualification-output/${case_name}-${threads}.time" \
                "$binary" \
                "$case_name" \
                "$scale" \
                "${{ inputs.repetitions }}" \
                "$threads" \
                | tee "qualification-output/${case_name}-${threads}.log" \
                | grep '^{' \
                >> "$output"
            done
          done

      - name: Summarize scaling
        shell: python
        run: |
          import json
          from pathlib import Path

          source = Path('qualification-output/scaling.jsonl')
          rows = [json.loads(line) for line in source.read_text().splitlines() if line.strip()]
          grouped = {}
          for row in rows:
              grouped.setdefault(row['case'], []).append(row)
          report = {
              'schema_version': 1,
              'commit': Path('.git/HEAD').read_text().strip(),
              'cases': grouped,
          }
          Path('qualification-output/scaling-summary.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(report, indent=2, sort_keys=True))

      - uses: actions/upload-artifact@v4
        with:
          name: cmg-1-32-thread-qualification
          path: qualification-output/
          if-no-files-found: error
          retention-days: 30
