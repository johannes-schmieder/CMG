name: Repaired rootless forest-label gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rootless-forest-labels-v2.yml'

permissions:
  contents: write

concurrency:
  group: cmg-rootless-forest-labels-v2
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify repaired rootless forest labels
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rootless_forest_label_gate_v2.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/rootless-forest-labels-latest.json || true
