name: Syntax-safe compact CSR row-offset gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-csr-row-offsets-v3.yml'

permissions:
  contents: write

concurrency:
  group: cmg-compact-csr-row-offsets-v3
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify syntax-safe compact CSR row offsets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compact_csr_row_offsets_gate_v3.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/compact-csr-row-offsets-latest.json || true
