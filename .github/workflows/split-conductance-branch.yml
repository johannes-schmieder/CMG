name: Branch-free conductance split gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/split-conductance-branch.yml'

permissions:
  contents: write

concurrency:
  group: cmg-split-conductance-branch
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify branch-free conductance pass
        shell: bash
        run: |
          set -euo pipefail
          python scripts/split_conductance_branch_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/split-conductance-branch-latest.json || true
