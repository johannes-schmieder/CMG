name: Sampled contraction-capacity gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sampled-contraction-capacity.yml'

permissions:
  contents: write

concurrency:
  group: cmg-sampled-contraction-capacity
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify sampled contraction capacity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sampled_contraction_capacity_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/sampled-contraction-capacity-latest.json || true
