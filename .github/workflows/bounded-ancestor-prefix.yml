name: Bounded ancestor-prefix gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bounded-ancestor-prefix.yml'

permissions:
  contents: write

concurrency:
  group: cmg-bounded-ancestor-prefix
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify bounded ancestor-prefix recording
        shell: bash
        run: |
          set -euo pipefail
          python scripts/bounded_ancestor_prefix_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/bounded-ancestor-prefix-latest.json || true
