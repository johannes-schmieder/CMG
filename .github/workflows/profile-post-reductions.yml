name: Profile PCG after production reductions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-post-reductions.yml'
      - '.ci/performance/pcg-profiler-sync.json'

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run dependent post-reduction profile
        run: python scripts/profile_post_reductions.py

      - name: Commit profile checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'perf: profile PCG after production reductions'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
