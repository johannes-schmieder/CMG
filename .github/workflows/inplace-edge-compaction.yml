name: In-place edge compaction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inplace-edge-compaction.yml'

permissions:
  contents: write

concurrency:
  group: inplace-edge-compaction
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "BASELINE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/inplace-edge-results"

      - name: Build baseline benchmarks
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-edge-baseline" \
            cargo build --manifest-path benchmarks/Cargo.toml --release \
              --bin graph-build --bin hierarchy-build
          cp "$RUNNER_TEMP/cmg-edge-baseline/release/graph-build" \
             "$RUNNER_TEMP/graph-build-baseline"
          cp "$RUNNER_TEMP/cmg-edge-baseline/release/hierarchy-build" \
             "$RUNNER_TEMP/hierarchy-build-baseline"

      - name: Apply and validate candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/inplace_edge_compaction_v2.py
          python3 -m py_compile scripts/inplace_edge_compaction_experiment.py
          python3 scripts/inplace_edge_compaction_v2.py
          cargo fmt --all
          cargo fmt --manifest-path benchmarks/Cargo.toml --all
          cargo fmt --all -- --check
          cargo fmt --manifest-path benchmarks/Cargo.toml --all -- --check
          RUSTFLAGS='-D warnings' cargo check --lib --no-default-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path benchmarks/Cargo.toml --all-targets -- -D warnings
          cargo test --all-targets --all-features
          cargo test --all-targets --all-features --release
          cargo test --manifest-path benchmarks/Cargo.toml --all-targets --release
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --document-private-items --all-features
          cargo build --release --all-features

      - name: Build candidate benchmarks
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-edge-candidate" \
            cargo build --manifest-path benchmarks/Cargo.toml --release \
              --bin graph-build --bin hierarchy-build
          cp "$RUNNER_TEMP/cmg-edge-candidate/release/graph-build" \
             "$RUNNER_TEMP/graph-build-candidate"
          cp "$RUNNER_TEMP/cmg-edge-candidate/release/hierarchy-build" \
             "$RUNNER_TEMP/hierarchy-build-candidate"

      - name: Run alternating graph and hierarchy benchmarks
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/inplace-edge-results"

          run_graph() {
            local version="$1"
            local case_name="$2"
            local scale="$3"
            local round="$4"
            local prefix="$ROOT/${version}-graph-${case_name}-${scale}-${round}"
            /usr/bin/time -v "$RUNNER_TEMP/graph-build-$version" \
              "$case_name" "$scale" 3 > "$prefix.stdout" 2> "$prefix.time"
          }

          run_hierarchy() {
            local version="$1"
            local case_name="$2"
            local scale="$3"
            local round="$4"
            local prefix="$ROOT/${version}-hierarchy-${case_name}-${scale}-${round}"
            /usr/bin/time -v "$RUNNER_TEMP/hierarchy-build-$version" \
              "$case_name" "$scale" 3 > "$prefix.stdout" 2> "$prefix.time"
          }

          for round in 0 1 2; do
            for spec in \
              'unique 500000' \
              'duplicates-4 250000' \
              'duplicates-16 75000' \
              'coarse-collisions 75000'; do
              read -r case_name scale <<< "$spec"
              if (( round % 2 == 0 )); then
                run_graph baseline "$case_name" "$scale" "$round"
                run_graph candidate "$case_name" "$scale" "$round"
              else
                run_graph candidate "$case_name" "$scale" "$round"
                run_graph baseline "$case_name" "$scale" "$round"
              fi
            done

            for spec in 'worker-firm 50000' 'dense-worker-firm 20000'; do
              read -r case_name scale <<< "$spec"
              if (( round % 2 == 0 )); then
                run_hierarchy baseline "$case_name" "$scale" "$round"
                run_hierarchy candidate "$case_name" "$scale" "$round"
              else
                run_hierarchy candidate "$case_name" "$scale" "$round"
                run_hierarchy baseline "$case_name" "$scale" "$round"
              fi
            done
          done

      - name: Evaluate candidate
        id: evaluate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/inplace_edge_compaction_experiment.py evaluate

      - name: Update plan and commit result
        shell: bash
        env:
          ACCEPTED: ${{ steps.evaluate.outputs.accepted }}
        run: |
          set -euo pipefail
          python3 scripts/inplace_edge_compaction_experiment.py plan
          if [ "$ACCEPTED" != true ]; then
            git restore src/graph.rs
          fi
          rm -f scripts/inplace_edge_compaction.py
          rm -f scripts/inplace_edge_compaction_v2.py
          rm -f scripts/inplace_edge_compaction_experiment.py
          rm -f benchmarks/Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if [ "$ACCEPTED" = true ]; then
            git commit -m 'perf: compact canonical edges in place'
          else
            git commit -m 'perf: record rejected in-place edge compaction experiment'
          fi
          git pull --rebase origin main
          git push origin HEAD:main
