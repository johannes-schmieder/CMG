name: In-place edge compaction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inplace-edge-compaction.yml'
      - 'scripts/inplace_edge_compaction_v2.py'

permissions:
  contents: write

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run constructor and hierarchy A/B gate
        shell: python
        run: |
          import json
          import math
          import os
          from pathlib import Path
          import re
          import statistics
          import subprocess

          root = Path.cwd()
          baseline_source = Path('src/graph.rs').read_text()
          baseline_sha = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()

          def run(command, *, env=None, check=True):
              print('+', ' '.join(command), flush=True)
              completed = subprocess.run(
                  command,
                  cwd=root,
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              print(completed.stdout, end='')
              if check and completed.returncode != 0:
                  raise RuntimeError(
                      f"command failed ({completed.returncode}): {' '.join(command)}"
                  )
              return completed

          def build(target):
              env = os.environ.copy()
              env['CARGO_TARGET_DIR'] = str(target)
              for binary in ('graph-build', 'hierarchy-build'):
                  run([
                      'cargo', 'build', '--release',
                      '--manifest-path', 'benchmarks/Cargo.toml',
                      '--bin', binary,
                  ], env=env)
              return {
                  name: target / 'release' / name
                  for name in ('graph-build', 'hierarchy-build')
              }

          def sample(binary, arguments):
              label = '-'.join(str(value) for value in arguments)
              time_file = Path(f'/tmp/time-{label}-{os.getpid()}')
              completed = run([
                  '/usr/bin/time', '-v', '-o', str(time_file),
                  str(binary), *[str(value) for value in arguments],
              ])
              payloads = [
                  json.loads(line)
                  for line in completed.stdout.splitlines()
                  if line.strip().startswith('{')
              ]
              if len(payloads) != 1:
                  raise RuntimeError(f'unexpected benchmark output: {payloads}')
              timing = time_file.read_text()
              rss = re.search(
                  r'Maximum resident set size \(kbytes\):\s*(\d+)', timing
              )
              if rss is None:
                  raise RuntimeError('peak RSS missing')
              payloads[0]['peak_rss_kib'] = int(rss.group(1))
              return payloads[0]

          def compare_case(baseline_binary, candidate_binary, arguments):
              baseline = []
              candidate = []
              for label, binary in (
                  ('baseline', baseline_binary),
                  ('candidate', candidate_binary),
                  ('candidate', candidate_binary),
                  ('baseline', baseline_binary),
              ):
                  observation = sample(binary, arguments)
                  (baseline if label == 'baseline' else candidate).append(observation)
              baseline_ns = statistics.median(item['median_ns'] for item in baseline)
              candidate_ns = statistics.median(item['median_ns'] for item in candidate)
              baseline_rss = max(item['peak_rss_kib'] for item in baseline)
              candidate_rss = max(item['peak_rss_kib'] for item in candidate)
              return {
                  'arguments': arguments,
                  'baseline_median_ns': baseline_ns,
                  'candidate_median_ns': candidate_ns,
                  'candidate_over_baseline': candidate_ns / baseline_ns,
                  'baseline_peak_rss_kib': baseline_rss,
                  'candidate_peak_rss_kib': candidate_rss,
                  'candidate_over_baseline_peak_rss': candidate_rss / baseline_rss,
                  'metadata': baseline[0],
              }

          result = {
              'schema_version': 1,
              'experiment': 'in-place-canonical-edge-compaction',
              'baseline_sha': baseline_sha,
              'accepted': False,
              'validation': 'not_run',
              'decision_reason': '',
              'graph_constructor_cases': {},
              'hierarchy_cases': {},
          }

          try:
              baseline = build(Path('/tmp/cmg-edge-baseline'))
              run(['python', 'scripts/inplace_edge_compaction_v2.py'])
              run(['cargo', 'fmt', '--all'])
              run(['cargo', 'fmt', '--all', '--', '--check'])
              run([
                  'cargo', 'fmt', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all', '--', '--check',
              ])
              run([
                  'cargo', 'clippy', '--all-targets', '--all-features',
                  '--', '-D', 'warnings',
              ])
              run(['cargo', 'test', '--all-targets'])
              run(['cargo', 'test', '--all-targets', '--release'])
              run(['cargo', 'build', '--release'])
              candidate = build(Path('/tmp/cmg-edge-candidate'))
              result['validation'] = 'success'

              graph_specs = [
                  ('unique', ['unique', 500_000, 3]),
                  ('duplicates-4', ['duplicates-4', 250_000, 3]),
                  ('duplicates-16', ['duplicates-16', 75_000, 3]),
                  ('coarse-collisions', ['coarse-collisions', 75_000, 3]),
              ]
              hierarchy_specs = [
                  ('worker-firm', ['worker-firm', 50_000, 2]),
                  ('dense-worker-firm', ['dense-worker-firm', 20_000, 2]),
              ]

              graph_ratios = []
              graph_memory = []
              for name, arguments in graph_specs:
                  comparison = compare_case(
                      baseline['graph-build'],
                      candidate['graph-build'],
                      arguments,
                  )
                  result['graph_constructor_cases'][name] = comparison
                  graph_ratios.append(comparison['candidate_over_baseline'])
                  graph_memory.append(
                      comparison['candidate_over_baseline_peak_rss']
                  )

              hierarchy_ratios = []
              hierarchy_memory = []
              for name, arguments in hierarchy_specs:
                  comparison = compare_case(
                      baseline['hierarchy-build'],
                      candidate['hierarchy-build'],
                      arguments,
                  )
                  result['hierarchy_cases'][name] = comparison
                  hierarchy_ratios.append(comparison['candidate_over_baseline'])
                  hierarchy_memory.append(
                      comparison['candidate_over_baseline_peak_rss']
                  )

              graph_geometric = math.exp(
                  sum(math.log(value) for value in graph_ratios)
                  / len(graph_ratios)
              )
              hierarchy_geometric = math.exp(
                  sum(math.log(value) for value in hierarchy_ratios)
                  / len(hierarchy_ratios)
              )
              result['graph_geometric_candidate_over_baseline'] = graph_geometric
              result['hierarchy_geometric_candidate_over_baseline'] = hierarchy_geometric
              result['worst_graph_candidate_over_baseline'] = max(graph_ratios)
              result['worst_hierarchy_candidate_over_baseline'] = max(
                  hierarchy_ratios
              )
              result['worst_candidate_over_baseline_peak_rss'] = max(
                  graph_memory + hierarchy_memory
              )
              result['acceptance_limits'] = {
                  'graph_geometric_ratio_max': 1.01,
                  'graph_per_case_ratio_max': 1.04,
                  'hierarchy_geometric_ratio_max': 1.02,
                  'hierarchy_per_case_ratio_max': 1.05,
                  'peak_rss_ratio_max': 1.02,
              }
              result['accepted'] = (
                  graph_geometric <= 1.01
                  and max(graph_ratios) <= 1.04
                  and hierarchy_geometric <= 1.02
                  and max(hierarchy_ratios) <= 1.05
                  and max(graph_memory + hierarchy_memory) <= 1.02
              )
              result['decision_reason'] = (
                  'full qualification passed; constructor and hierarchy timing/memory met the gate'
                  if result['accepted']
                  else 'qualification passed but timing or peak-memory evidence exceeded the gate'
              )
          except Exception as error:
              result['decision_reason'] = f'experiment failed: {error}'
              result['error'] = repr(error)
              print(result['decision_reason'], flush=True)

          if not result['accepted']:
              Path('src/graph.rs').write_text(baseline_source)
              run(['cargo', 'fmt', '--all'], check=False)

          record = Path('.ci/performance/edge-compaction-latest.json')
          record.parent.mkdir(parents=True, exist_ok=True)
          record.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')

          plan_path = Path('PERFORMANCE_PLAN.md')
          plan = plan_path.read_text()
          marker = '## Current next action\n'
          if marker not in plan:
              raise RuntimeError('current-next-action heading missing')
          status = 'accepted' if result['accepted'] else 'not retained'
          graph_ratio = result.get('graph_geometric_candidate_over_baseline')
          hierarchy_ratio = result.get(
              'hierarchy_geometric_candidate_over_baseline'
          )
          ratios = ''
          if graph_ratio is not None and hierarchy_ratio is not None:
              ratios = (
                  f' Constructor geometric ratio: {graph_ratio:.3f}; '
                  f'hierarchy geometric ratio: {hierarchy_ratio:.3f}.'
              )
          checkpoint = f'''### In-place edge compaction checkpoint — 2026-08-22

- Reusing the sorted canonical edge vector for duplicate collapse was
  **{status}**.{ratios}
- The candidate preserves the existing sorted accumulation order and checked
  arithmetic while eliminating a second full-capacity edge vector.
- Qualification status: `{result['validation']}`.
- Machine-readable evidence: `.ci/performance/edge-compaction-latest.json`.

'''
          if '### In-place edge compaction checkpoint — 2026-08-22' not in plan:
              plan = plan.replace(marker, checkpoint + marker, 1)
          plan_path.write_text(plan)

          for staging in (
              'scripts/inplace_edge_compaction.py',
              'scripts/inplace_edge_compaction_v2.py',
              '.github/workflows/inplace-edge-compaction.yml',
          ):
              Path(staging).unlink(missing_ok=True)
          try:
              Path('scripts').rmdir()
          except OSError:
              pass

          run(['git', 'config', 'user.name', 'github-actions[bot]'])
          run([
              'git', 'config', 'user.email',
              '41898282+github-actions[bot]@users.noreply.github.com',
          ])
          run(['git', 'add', '-A'])
          message = (
              'perf: compact canonical edges in place'
              if result['accepted']
              else 'perf: record edge compaction experiment'
          )
          run(['git', 'commit', '-m', message])
          run(['git', 'pull', '--rebase', 'origin', 'main'])
          run(['git', 'push', 'origin', 'HEAD:main'])

      - name: Show result
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/edge-compaction-latest.json || true
