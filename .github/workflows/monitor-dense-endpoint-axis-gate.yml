name: Monitor dense endpoint-axis gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor-dense-endpoint-axis-gate.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: cmg-dense-endpoint-axis-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for gate and preserve result or logs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/monitor_dense_endpoint_axis_gate.py

      - name: Show monitor record
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/dense-endpoint-axis-sort-run-status.json || true
          git show origin/main:.ci/performance/dense-endpoint-axis-sort-latest.json || true
