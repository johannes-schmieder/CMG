# Armed after the workflow existed on the default branch.
name: Owned internal forest split gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owned-split-forest-gate.yml'

permissions:
  contents: write

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify owned internal split
        run: python scripts/owned_split_forest_gate.py

      - name: Commit decision checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: record owned forest split gate'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Show decision
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/owned-split-forest-latest.json || true
