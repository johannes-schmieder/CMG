name: Branchless ancestor-recording gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branchless-ancestor-recording.yml'

permissions:
  contents: write

concurrency:
  group: cmg-branchless-ancestor-recording
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify branchless ancestor-prefix recording
        shell: bash
        run: |
          set -euo pipefail
          python scripts/execute_branchless_ancestor_recording_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/branchless-ancestor-recording-latest.json || true
