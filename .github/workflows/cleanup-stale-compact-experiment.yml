name: Clean stale compact centering experiment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-stale-compact-experiment.yml'

permissions:
  contents: write

jobs:
  clean-and-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record decision in live plan
        shell: python
        run: |
          from pathlib import Path

          path = Path('PERFORMANCE_PLAN.md')
          text = path.read_text()

          rejected_anchor = '- Unsafe unchecked aggregation loops were rejected because the crate globally forbids unsafe production code; safe kernels were retained.\n'
          rejected_note = (
              '- Precomputed grouped-centering metadata was not retained: the staged design '
              'duplicated O(n) ordering/scratch storage in each workspace, conflicted with the '
              'large-memory objective, and never completed a valid A/B run; the allocation-free '
              'streaming centering path remains.\n'
          )
          if rejected_note not in text:
              if rejected_anchor not in text:
                  raise SystemExit('rejected-experiment anchor changed')
              text = text.replace(rejected_anchor, rejected_anchor + rejected_note, 1)

          checkpoint_anchor = '| 2026-08-22 | `78fc06e6` / `039a076e` / `41a947f5` | Recursive coarse compatibility uses deterministic centering; full solves improved and the current Rust cycle is near or ahead of pinned C |\n'
          checkpoint_note = '| 2026-08-22 | `770b4d31` / `13ebd3bb` | Compact grouped-centering metadata experiment closed without production changes; O(n) duplicate metadata was rejected |\n'
          if checkpoint_note not in text:
              if checkpoint_anchor not in text:
                  raise SystemExit('checkpoint anchor changed')
              text = text.replace(checkpoint_anchor, checkpoint_anchor + checkpoint_note, 1)

          old_next = '''1. Re-run current three-platform qualification and the matched serial/parallel benchmark suite after the accepted fast paths.
2. Profile setup on larger sparse and denser worker-firm cases; retain only routing changes that improve the intended topology without regressing memory.
3. Evaluate compact aggregation labels behind an end-to-end memory/speed gate rather than duplicating native and compact labels.
4. Add within-solve parallelism only for measured single-RHS bottlenecks; keep across-RHS scheduling as the default when multiple inverse actions exist.
5. Obtain 8–32-thread and large-memory evidence on a larger or self-hosted runner.
'''
          new_next = '''1. Remove one of the two dense terminal-factor construction buffers by assembling the permuted grounded matrix directly in the factor workspace; retain the change only after full qualification and setup benchmarks.
2. Re-run current three-platform qualification and the matched serial/parallel benchmark suite after each retained source change.
3. Profile setup on larger sparse and denser worker-firm cases; retain only routing changes that improve the intended topology without regressing memory.
4. Add within-solve parallelism only for measured single-RHS bottlenecks; keep across-RHS scheduling as the default when multiple inverse actions exist.
5. Obtain 8–32-thread and large-memory evidence on a larger or self-hosted runner.
'''
          if old_next in text:
              text = text.replace(old_next, new_next, 1)
          elif new_next not in text:
              raise SystemExit('current-next-action anchor changed')

          path.write_text(text)

      - name: Remove stale staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/evaluate-compact-centering-metadata.yml
          rm -f scripts/compact_centering_metadata_experiment.py
          rmdir scripts 2>/dev/null || true
          rm .github/workflows/cleanup-stale-compact-experiment.yml

      - name: Commit cleanup checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close compact-centering metadata experiment'
          git pull --rebase origin main
          git push origin HEAD:main
