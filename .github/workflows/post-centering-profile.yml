name: Profile PCG after centering optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post-centering-profile.yml'
      - 'scripts/run_post_centering_profile.py'

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run post-centering profile
        run: python scripts/run_post_centering_profile.py

      - name: Commit profiling checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: record post-centering PCG profile'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
