name: Source-accurate byte forest-visited gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/byte-forest-visited-v3.yml'

permissions:
  contents: write

concurrency:
  group: cmg-byte-forest-visited-v3
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify source-accurate byte forest visited flags
        shell: bash
        run: |
          set -euo pipefail
          python scripts/byte_forest_visited_gate_v3.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/byte-forest-visited-latest.json || true
