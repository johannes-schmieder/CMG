name: Capture routed radix gate failure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-radix-gate-failure.yml'

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture latest failed radix-gate log
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import urllib.request

          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def fetch_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          base = f"{os.environ['GH_API']}/repos/{os.environ['GH_REPOSITORY']}"
          runs = fetch_json(
              base + '/actions/workflows/radix-endpoint-sort-gate.yml/runs?per_page=10'
          )['workflow_runs']
          run = next(item for item in runs if item['conclusion'] == 'failure')
          jobs = fetch_json(base + f"/actions/runs/{run['id']}/jobs")['jobs']
          job = next(item for item in jobs if item['conclusion'] == 'failure')
          request = urllib.request.Request(
              base + f"/actions/jobs/{job['id']}/logs",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              log = response.read().decode('utf-8', errors='replace')

          destination = Path('.ci/performance/radix-gate-failure.log')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(log)
          Path('.ci/performance/radix-gate-failure.json').write_text(
              json.dumps({
                  'run_id': run['id'],
                  'run_attempt': run['run_attempt'],
                  'head_sha': run['head_sha'],
                  'job_id': job['id'],
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'html_url': run['html_url'],
              }, indent=2) + '\n'
          )

      - name: Commit diagnostic and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-radix-gate-failure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: capture routed radix gate failure'
          git pull --rebase origin main
          git push origin HEAD:main
