name: Optimize terminal factor memory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-terminal-factor-memory.yml'

permissions:
  contents: write

concurrency:
  group: terminal-factor-memory
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "BASELINE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/terminal-factor-results"

      - name: Build baseline benchmark
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-terminal-baseline" \
            cargo build --manifest-path benchmarks/Cargo.toml \
              --release --bin terminal-build
          cp "$RUNNER_TEMP/cmg-terminal-baseline/release/terminal-build" \
             "$RUNNER_TEMP/terminal-build-baseline"

      - name: Apply and validate candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/optimize_terminal_factor_memory.py
          python3 -m py_compile scripts/terminal_factor_experiment.py
          python3 scripts/optimize_terminal_factor_memory.py
          cargo fmt --all
          cargo fmt --manifest-path benchmarks/Cargo.toml --all
          cargo fmt --all -- --check
          cargo fmt --manifest-path benchmarks/Cargo.toml --all -- --check
          RUSTFLAGS='-D warnings' cargo check --lib --no-default-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path benchmarks/Cargo.toml --all-targets -- -D warnings
          cargo test --all-targets --all-features
          cargo test --all-targets --all-features --release
          cargo test --manifest-path benchmarks/Cargo.toml --all-targets --release
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --document-private-items --all-features
          cargo build --release --all-features

      - name: Build candidate benchmark
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-terminal-candidate" \
            cargo build --manifest-path benchmarks/Cargo.toml \
              --release --bin terminal-build
          cp "$RUNNER_TEMP/cmg-terminal-candidate/release/terminal-build" \
             "$RUNNER_TEMP/terminal-build-candidate"

      - name: Run alternating same-host benchmarks
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/terminal-factor-results"
          for round in 0 1 2; do
            if (( round % 2 == 0 )); then
              "$RUNNER_TEMP/terminal-build-baseline" 5 > "$ROOT/baseline-$round.jsonl"
              "$RUNNER_TEMP/terminal-build-candidate" 5 > "$ROOT/candidate-$round.jsonl"
            else
              "$RUNNER_TEMP/terminal-build-candidate" 5 > "$ROOT/candidate-$round.jsonl"
              "$RUNNER_TEMP/terminal-build-baseline" 5 > "$ROOT/baseline-$round.jsonl"
            fi
          done

      - name: Evaluate candidate
        id: evaluate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/terminal_factor_experiment.py evaluate

      - name: Update plan and commit result
        shell: bash
        env:
          ACCEPTED: ${{ steps.evaluate.outputs.accepted }}
        run: |
          set -euo pipefail
          python3 scripts/terminal_factor_experiment.py plan
          if [ "$ACCEPTED" != true ]; then
            git restore src/ldl.rs
          fi
          rm scripts/optimize_terminal_factor_memory.py
          rm scripts/terminal_factor_experiment.py
          rm -f benchmarks/Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if [ "$ACCEPTED" = true ]; then
            git commit -m 'perf: assemble terminal factor directly'
          else
            git commit -m 'perf: record rejected terminal-factor assembly experiment'
          fi
          git pull --rebase origin main
          git push origin HEAD:main
