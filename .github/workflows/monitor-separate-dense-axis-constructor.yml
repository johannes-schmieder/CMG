name: Monitor separate dense axis-constructor gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor-separate-dense-axis-constructor.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: cmg-separate-dense-axis-constructor-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for gate and preserve result or logs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/monitor_separate_dense_axis_constructor.py

      - name: Show gate status
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/separate-dense-axis-constructor-run-status.json || true
          git show origin/main:.ci/performance/separate-dense-axis-constructor-latest.json || true
