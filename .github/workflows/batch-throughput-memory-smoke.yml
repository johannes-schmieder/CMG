name: Batch throughput and memory smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-throughput-memory-smoke.yml'

permissions:
  contents: write

jobs:
  batch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Discover benchmark controls and run RHS scaling
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import time

          root = Path.cwd()

          def run(command, *, env=None, timeout=1800, check=True):
              print('+', ' '.join(command), flush=True)
              started = time.perf_counter()
              completed = subprocess.run(
                  command,
                  cwd=root,
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
              )
              elapsed = time.perf_counter() - started
              print(completed.stdout, end='')
              if check and completed.returncode != 0:
                  raise RuntimeError(
                      f"command failed ({completed.returncode}): {' '.join(command)}"
                  )
              return completed, elapsed

          run([
              'cargo', 'build', '--release', '--manifest-path',
              'benchmarks/Cargo.toml', '--bin', 'cmg-bench',
          ])
          binary = Path('benchmarks/target/release/cmg-bench')
          if not binary.exists():
              binary = Path('target/release/cmg-bench')
          source = Path('benchmarks/src/bin/cmg-bench.rs').read_text()
          help_result, _ = run([str(binary), '--help'], timeout=120, check=False)
          help_text = help_result.stdout

          def discover_flag(patterns):
              for pattern in patterns:
                  match = re.search(pattern, help_text)
                  if match:
                      return match.group(1)
              return None

          rhs_flag = discover_flag([
              r'(?m)(--rhs)\b',
              r'(?m)(--right-hand-sides)\b',
              r'(?m)(--batch-size)\b',
          ])
          thread_flag = discover_flag([
              r'(?m)(--threads)\b',
              r'(?m)(--thread-count)\b',
              r'(?m)(--num-threads)\b',
          ])
          vertex_flag = discover_flag([
              r'(?m)(--vertices)\b',
              r'(?m)(--vertex-count)\b',
              r'(?m)(--nodes)\b',
          ])
          edge_flag = discover_flag([
              r'(?m)(--edges)\b',
              r'(?m)(--edge-count)\b',
          ])
          repetition_flag = discover_flag([
              r'(?m)(--repetitions)\b',
              r'(?m)(--reps)\b',
          ])

          environment_candidates = sorted(set(re.findall(
              r'["\']([A-Z][A-Z0-9_]*)["\']', source
          )))
          rhs_environment = next(
              (name for name in environment_candidates if 'RHS' in name), None
          )
          thread_environment = next(
              (name for name in environment_candidates if 'THREAD' in name), None
          )
          vertex_environment = next(
              (name for name in environment_candidates if 'VERT' in name), None
          )
          edge_environment = next(
              (name for name in environment_candidates if 'EDGE' in name), None
          )
          repetition_environment = next(
              (name for name in environment_candidates if 'REP' in name), None
          )

          controls_rhs = rhs_flag is not None or rhs_environment is not None
          logical_cpus = os.cpu_count() or 1
          configured_threads = min(logical_cpus, 4)
          observations = []
          status = 'success'
          reason = ''

          if not controls_rhs:
              status = 'not_run'
              reason = 'cmg-bench exposes no discoverable RHS-count control'
          else:
              for rhs_count in (1, 8, 32, 128):
                  env = os.environ.copy()
                  env['RAYON_NUM_THREADS'] = str(configured_threads)
                  arguments = []

                  controls = [
                      (thread_flag, thread_environment, configured_threads),
                      (vertex_flag, vertex_environment, 20_000),
                      (edge_flag, edge_environment, 60_000),
                      (repetition_flag, repetition_environment, 2),
                      (rhs_flag, rhs_environment, rhs_count),
                  ]
                  for flag, environment_name, value in controls:
                      if flag:
                          arguments.extend([flag, str(value)])
                      elif environment_name:
                          env[environment_name] = str(value)

                  time_path = Path(f'/tmp/cmg-batch-{rhs_count}.time')
                  completed, elapsed = run([
                      '/usr/bin/time', '-v', '-o', str(time_path),
                      str(binary), *arguments,
                  ], env=env)
                  timing = time_path.read_text()
                  rss = re.search(
                      r'Maximum resident set size \(kbytes\):\s*(\d+)', timing
                  )
                  observations.append({
                      'rhs_count': rhs_count,
                      'configured_threads': configured_threads,
                      'elapsed_seconds': elapsed,
                      'rhs_per_second': rhs_count / elapsed,
                      'peak_rss_kib': int(rss.group(1)) if rss else None,
                      'stdout_tail': completed.stdout[-12000:],
                  })

          result = {
              'schema_version': 1,
              'benchmark': 'batch-throughput-memory-smoke',
              'commit': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'status': status,
              'reason': reason,
              'logical_cpus': logical_cpus,
              'configured_threads': configured_threads,
              'controls': {
                  'rhs_flag': rhs_flag,
                  'rhs_environment': rhs_environment,
                  'thread_flag': thread_flag,
                  'thread_environment': thread_environment,
                  'vertex_flag': vertex_flag,
                  'vertex_environment': vertex_environment,
                  'edge_flag': edge_flag,
                  'edge_environment': edge_environment,
                  'repetition_flag': repetition_flag,
                  'repetition_environment': repetition_environment,
              },
              'observations': observations,
          }
          destination = Path('.ci/performance/batch-throughput-memory-smoke.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')

      - name: Update live plan and remove one-shot workflow
        shell: python
        run: |
          import json
          from pathlib import Path

          result = json.loads(
              Path('.ci/performance/batch-throughput-memory-smoke.json').read_text()
          )
          if result['observations']:
              rows = []
              for item in result['observations']:
                  rss = (
                      f"{item['peak_rss_kib'] / 1024:.1f}"
                      if item['peak_rss_kib'] is not None else 'n/a'
                  )
                  rows.append(
                      f"| {item['rhs_count']} | {item['elapsed_seconds']:.3f} | "
                      f"{item['rhs_per_second']:.3f} | {rss} |"
                  )
              detail = '''| RHS count | Wall time (s) | RHS/s | Peak RSS (MiB) |
|---:|---:|---:|---:|
''' + '\n'.join(rows)
          else:
              detail = f"- Run status: `{result['status']}` — {result['reason']}"

          checkpoint = f'''### Batch throughput/memory checkpoint — 2026-08-22

{detail}

- Configured threads: {result['configured_threads']} on a runner exposing
  {result['logical_cpus']} logical CPUs.
- Machine-readable evidence:
  `.ci/performance/batch-throughput-memory-smoke.json`.

'''
          path = Path('PERFORMANCE_PLAN.md')
          text = path.read_text()
          marker = '## Current next action\n'
          if marker not in text:
              raise SystemExit('current-next-action heading missing')
          if '### Batch throughput/memory checkpoint — 2026-08-22' not in text:
              text = text.replace(marker, checkpoint + marker, 1)
          path.write_text(text)
          Path('.github/workflows/batch-throughput-memory-smoke.yml').unlink()

      - name: Commit batch checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'bench: record batch throughput and memory smoke'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Show result
        if: always()
        shell: bash
        run: cat .ci/performance/batch-throughput-memory-smoke.json || true
