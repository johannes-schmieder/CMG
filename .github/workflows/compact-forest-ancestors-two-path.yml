name: Two-path compact forest-ancestor gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-forest-ancestors-two-path.yml'

permissions:
  contents: write

concurrency:
  group: cmg-compact-forest-ancestors-two-path
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify two-path compact forest ancestors
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compact_forest_ancestors_two_path_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/compact-forest-ancestors-two-path-latest.json || true
