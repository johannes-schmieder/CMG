name: Optimize compact coarse centering metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-compact-centering-metadata.yml'
      - 'scripts/compact_centering_metadata_experiment.py'
  workflow_dispatch:

concurrency:
  group: optimize-compact-centering-metadata
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  benchmark-test-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and benchmark current production path
        id: baseline
        shell: bash
        run: |
          set +e
          rm -rf .ci/performance/compact-centering-metadata \
            "$RUNNER_TEMP/compact-centering-results"
          mkdir -p .ci/performance/compact-centering-metadata \
            "$RUNNER_TEMP/compact-centering-results"
          {
            CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-compact-baseline-root" \
              cargo build --release --bin cmg-bench &&
            cp "$RUNNER_TEMP/cmg-compact-baseline-root/release/cmg-bench" \
               "$RUNNER_TEMP/cmg-bench-compact-baseline" &&
            CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-compact-baseline-c" \
              cargo build --manifest-path benchmarks/c-kernel/Cargo.toml --release &&
            cp "$RUNNER_TEMP/cmg-compact-baseline-c/release/cmg-c-kernel-bench" \
               "$RUNNER_TEMP/cmg-c-kernel-compact-baseline" || exit $?
            for CASE in path worker-firm; do
              "$RUNNER_TEMP/cmg-bench-compact-baseline" \
                --case "$CASE" --vertices 20000 --rhs 4 --repetitions 5 \
                --output "$RUNNER_TEMP/compact-centering-results/solve-baseline-${CASE}.json" || exit $?
              "$RUNNER_TEMP/cmg-c-kernel-compact-baseline" \
                --case "$CASE" --vertices 100000 --repetitions 7 \
                --output "$RUNNER_TEMP/compact-centering-results/cycle-baseline-${CASE}.json" || exit $?
            done
          } > .ci/performance/compact-centering-metadata/baseline.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Apply auditable compact-metadata patch
        id: patch
        if: ${{ steps.baseline.outputs.status == '0' }}
        shell: bash
        run: |
          set +e
          {
            python - <<'PY'
          from pathlib import Path

          path = Path('scripts/compact_centering_metadata_experiment.py')
          text = path.read_text()
          start_marker = 'overflow_path = Path("tests/overflow.rs")\n'
          end_marker = 'bench_path = Path("src/bin/cmg-bench.rs")\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('obsolete overflow patch block markers changed')
          start = text.index(start_marker)
          end = text.index(end_marker)
          if end <= start:
              raise SystemExit('obsolete overflow patch block is malformed')
          path.write_text(text[:start] + text[end:])
          PY
            python scripts/compact_centering_metadata_experiment.py
            python - <<'PY'
          from pathlib import Path

          path = Path('src/components.rs')
          text = path.read_text()
          unused = '''    pub(crate) fn component_count(&self) -> usize {
              self.component_count
          }

              pub(crate) fn labels(&self) -> Box<dyn Iterator<Item = usize> + '_> {
              match &self.labels {
                  CenteringLabels::U32(labels) => Box::new(
                      labels
                          .iter()
                          .copied()
                          .map(|label| usize::try_from(label).expect("u32 labels fit usize")),
                  ),
                  CenteringLabels::Native(labels) => Box::new(labels.iter().copied()),
              }
          }

          '''
          if text.count(unused) != 1:
              raise SystemExit('generated unused-method block changed')
          text = text.replace(unused, '', 1)
          tests = r'''

          #[cfg(test)]
          mod compact_centering_tests {
              use super::*;

              #[test]
              fn compact_centering_matches_full_component_centering() {
                  let labels = vec![0, 0, 1, 1, 2, 2, 2];
                  let full = Components::from_labels(labels.clone(), 3).unwrap();
                  let compact = CenteringPlan::from_labels(labels, 3).unwrap();
                  assert!(matches!(&compact.labels, CenteringLabels::U32(_)));

                  let mut expected = vec![1.0e16, -1.0e16, 3.0, 7.0, 1.0, 2.0, 3.0];
                  let mut actual = expected.clone();
                  let mut full_workspace = ComponentWorkspace::new(&full);
                  let mut compact_workspace = CenteringWorkspace::new(compact.component_count);

                  full.center_in_place_with_workspace(&mut expected, &mut full_workspace)
                      .unwrap();
                  compact
                      .center_in_place_with_workspace(&mut actual, &mut compact_workspace)
                      .unwrap();

                  assert_eq!(actual, expected);
                  assert!(compact.byte_len() < full.byte_len());
                  assert!(compact_workspace.byte_len() < full_workspace.byte_len());
              }

              #[test]
              fn compact_centering_rejects_wrong_vector_length() {
                  let compact = CenteringPlan::from_labels(vec![0, 0, 1], 2).unwrap();
                  let mut workspace = CenteringWorkspace::new(compact.component_count);
                  let mut values = vec![1.0, -1.0];
                  assert!(compact
                      .center_in_place_with_workspace(&mut values, &mut workspace)
                      .is_err());
              }
          }
          '''
          if 'mod compact_centering_tests' in text:
              raise SystemExit('compact centering tests already present')
          path.write_text(text + tests)
          PY
          } > .ci/performance/compact-centering-metadata/patch.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate candidate
        id: validate
        if: ${{ steps.patch.outputs.status == '0' }}
        shell: bash
        run: |
          set +e
          {
            cargo fmt --all &&
            cargo fmt --all -- --check &&
            RUSTFLAGS='-D warnings' cargo check --lib --no-default-features &&
            cargo clippy --all-targets --all-features -- -D warnings &&
            RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --all-features &&
            cargo test --all-targets &&
            cargo test --all-targets --release &&
            cargo test --all-targets --all-features &&
            cargo test --all-targets --all-features --release &&
            cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all &&
            cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all -- --check &&
            cargo clippy --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets -- -D warnings &&
            cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets &&
            cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets --release
          } > .ci/performance/compact-centering-metadata/validation.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build and benchmark candidate
        id: candidate
        if: ${{ steps.validate.outputs.status == '0' }}
        shell: bash
        run: |
          set +e
          {
            CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-compact-candidate-root" \
              cargo build --release --bin cmg-bench &&
            cp "$RUNNER_TEMP/cmg-compact-candidate-root/release/cmg-bench" \
               "$RUNNER_TEMP/cmg-bench-compact-candidate" &&
            CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-compact-candidate-c" \
              cargo build --manifest-path benchmarks/c-kernel/Cargo.toml --release &&
            cp "$RUNNER_TEMP/cmg-compact-candidate-c/release/cmg-c-kernel-bench" \
               "$RUNNER_TEMP/cmg-c-kernel-compact-candidate" || exit $?
            for CASE in path worker-firm; do
              "$RUNNER_TEMP/cmg-bench-compact-candidate" \
                --case "$CASE" --vertices 20000 --rhs 4 --repetitions 5 \
                --output "$RUNNER_TEMP/compact-centering-results/solve-candidate-${CASE}.json" || exit $?
              "$RUNNER_TEMP/cmg-c-kernel-compact-candidate" \
                --case "$CASE" --vertices 100000 --repetitions 7 \
                --output "$RUNNER_TEMP/compact-centering-results/cycle-candidate-${CASE}.json" || exit $?
            done

            mkdir -p examples
            cat > examples/compact_metadata_probe.rs <<'RS'
          use cmg::{CmgOptions, CmgPreconditioner, Components, Laplacian};
          use std::mem::size_of;

          fn path_graph(vertices: usize) -> Laplacian {
              let edges = (0..vertices.saturating_sub(1)).map(|vertex| {
                  let exponent = (vertex % 17) as i32 - 8;
                  (vertex, vertex + 1, 1.19_f64.powi(exponent))
              });
              Laplacian::from_edges(vertices, edges).unwrap()
          }

          fn worker_firm_graph(vertices: usize) -> Laplacian {
              let workers = vertices * 2 / 3;
              let firms = vertices - workers;
              let mut edges = Vec::with_capacity(workers * 2);
              for worker in 0..workers {
                  let first_firm = worker % firms;
                  let second_firm = (worker.wrapping_mul(37).wrapping_add(11)) % firms;
                  let first_weight = 1.0 + (worker % 13) as f64 * 0.02;
                  edges.push((worker, workers + first_firm, first_weight));
                  if second_firm != first_firm {
                      let second_weight = 0.65 + (worker % 7) as f64 * 0.03;
                      edges.push((worker, workers + second_firm, second_weight));
                  }
              }
              Laplacian::from_edges(vertices, edges).unwrap()
          }

          fn measure(name: &str, graph: Laplacian) {
              let options = CmgOptions {
                  direct_threshold: 32,
                  small_graph_direct_threshold: 32,
                  max_hierarchy_nnz_factor: 6.0,
                  max_levels: 64,
                  ..CmgOptions::default()
              };
              let preconditioner = CmgPreconditioner::build(&graph, options).unwrap();
              let legacy_bytes: usize = preconditioner
                  .hierarchy()
                  .levels()
                  .iter()
                  .map(|level| {
                      let components = Components::from_laplacian(level.graph());
                      components.labels().len() * size_of::<usize>()
                          + components.component_count() * size_of::<usize>()
                  })
                  .sum();
              println!(
                  "{name} {} {legacy_bytes}",
                  preconditioner.component_metadata_bytes()
              );
          }

          fn main() {
              measure("path", path_graph(100_000));
              measure("worker-firm", worker_firm_graph(100_000));
          }
          RS
            CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-compact-probe" \
              cargo run --release --example compact_metadata_probe \
              > "$RUNNER_TEMP/compact-centering-results/metadata.txt"
          } > .ci/performance/compact-centering-metadata/candidate.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Evaluate same-run result
        id: evaluate
        if: ${{ steps.candidate.outputs.status == '0' }}
        shell: python
        run: |
          import json
          import math
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'compact-centering-results'
          cycle_ratios = {}
          solve_ratios = {}
          workspace_ratios = {}
          metadata = {}
          records = {}
          valid = True

          for line in (root / 'metadata.txt').read_text().splitlines():
              case, current, legacy = line.split()
              current = int(current)
              legacy = int(legacy)
              metadata[case] = {
                  'current_bytes': current,
                  'legacy_full_components_bytes': legacy,
                  'ratio': current / legacy,
              }

          for case in ('path', 'worker-firm'):
              cycle_baseline = json.loads(
                  (root / f'cycle-baseline-{case}.json').read_text()
              )
              cycle_candidate = json.loads(
                  (root / f'cycle-candidate-{case}.json').read_text()
              )
              solve_baseline = json.loads(
                  (root / f'solve-baseline-{case}.json').read_text()
              )
              solve_candidate = json.loads(
                  (root / f'solve-candidate-{case}.json').read_text()
              )
              records[case] = {
                  'cycle_baseline': cycle_baseline,
                  'cycle_candidate': cycle_candidate,
                  'solve_baseline': solve_baseline,
                  'solve_candidate': solve_candidate,
              }
              cycle_ratios[case] = (
                  cycle_candidate['cycle']['rust_median_ns']
                  / cycle_baseline['cycle']['rust_median_ns']
              )
              solve_ratios[case] = (
                  solve_candidate['solve_per_rhs_median_ns']
                  / solve_baseline['solve_per_rhs_median_ns']
              )
              workspace_ratios[case] = {
                  'cmg': (
                      solve_candidate['cmg_workspace_bytes']
                      / solve_baseline['cmg_workspace_bytes']
                  ),
                  'pcg': (
                      solve_candidate['pcg_workspace_bytes']
                      / solve_baseline['pcg_workspace_bytes']
                  ),
              }
              valid &= solve_candidate['iterations'] == solve_baseline['iterations']
              valid &= solve_candidate['level_vertices'] == solve_baseline['level_vertices']
              valid &= solve_candidate['level_edges'] == solve_baseline['level_edges']
              valid &= (
                  solve_candidate['component_metadata_bytes']
                  == metadata[case]['current_bytes']
                  * solve_candidate['component_metadata_bytes']
                  // metadata[case]['current_bytes']
              )
              valid &= all(
                  value == value and value < 1.0e-6
                  for value in solve_candidate['backward_errors']
              )
              valid &= (
                  cycle_candidate['cycle']['quotient_max_scaled_error'] <= 5.0e-10
              )
              valid &= metadata[case]['current_bytes'] < metadata[case]['legacy_full_components_bytes']
              valid &= metadata[case]['ratio'] <= 0.75
              valid &= workspace_ratios[case]['cmg'] <= 1.0
              valid &= workspace_ratios[case]['pcg'] <= 1.0

          cycle_geomean = math.exp(
              sum(math.log(value) for value in cycle_ratios.values())
              / len(cycle_ratios)
          )
          solve_geomean = math.exp(
              sum(math.log(value) for value in solve_ratios.values())
              / len(solve_ratios)
          )
          accepted = (
              valid
              and max(cycle_ratios.values()) <= 1.03
              and cycle_geomean <= 1.015
              and max(solve_ratios.values()) <= 1.03
              and solve_geomean <= 1.015
          )
          evaluation = {
              'valid': valid,
              'accepted': accepted,
              'cycle_ratios': cycle_ratios,
              'cycle_geometric_mean_ratio': cycle_geomean,
              'solve_ratios': solve_ratios,
              'solve_geometric_mean_ratio': solve_geomean,
              'workspace_ratios': workspace_ratios,
              'metadata': metadata,
              'records': records,
          }
          Path('.ci/performance/compact-centering-metadata/evaluation.json').write_text(
              json.dumps(evaluation, indent=2) + '\n'
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('status=0\n')
              output.write(f'accepted={str(accepted).lower()}\n')

      - name: Build retained result or failure record
        if: ${{ always() && !cancelled() }}
        shell: python
        env:
          BASELINE_STATUS: ${{ steps.baseline.outputs.status }}
          PATCH_STATUS: ${{ steps.patch.outputs.status }}
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
          CANDIDATE_STATUS: ${{ steps.candidate.outputs.status }}
          EVALUATION_STATUS: ${{ steps.evaluate.outputs.status }}
          ACCEPTED: ${{ steps.evaluate.outputs.accepted }}
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          directory = Path('.ci/performance/compact-centering-metadata')
          directory.mkdir(parents=True, exist_ok=True)

          def status(name):
              return os.environ.get(name) or 'not-run'

          def tail(name, count=240):
              path = directory / name
              if not path.exists():
                  return []
              return path.read_text(errors='replace').splitlines()[-count:]

          evaluation_path = directory / 'evaluation.json'
          evaluation = (
              json.loads(evaluation_path.read_text())
              if evaluation_path.exists() else None
          )
          statuses = {
              'baseline': status('BASELINE_STATUS'),
              'patch': status('PATCH_STATUS'),
              'validation': status('VALIDATION_STATUS'),
              'candidate': status('CANDIDATE_STATUS'),
              'evaluation': status('EVALUATION_STATUS'),
          }
          completed = all(value == '0' for value in statuses.values())
          accepted = completed and os.environ.get('ACCEPTED') == 'true'
          record = {
              'schema': 1,
              'tested_sha': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'completed': completed,
              'accepted': accepted,
              'outcome': 'accepted' if accepted else (
                  'rejected' if completed else 'failed'
              ),
              'statuses': statuses,
              'evaluation': evaluation,
              'log_tails': {
                  'baseline': tail('baseline.log'),
                  'patch': tail('patch.log'),
                  'validation': tail('validation.log'),
                  'candidate': tail('candidate.log'),
              },
          }
          Path('.ci/performance/compact-centering-metadata-latest.json').write_text(
              json.dumps(record, indent=2) + '\n'
          )

      - name: Commit accepted source, rejection, or diagnostics
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          BASELINE_STATUS: ${{ steps.baseline.outputs.status }}
          PATCH_STATUS: ${{ steps.patch.outputs.status }}
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
          CANDIDATE_STATUS: ${{ steps.candidate.outputs.status }}
          EVALUATION_STATUS: ${{ steps.evaluate.outputs.status }}
          ACCEPTED: ${{ steps.evaluate.outputs.accepted }}
        run: |
          set -euo pipefail
          COMPLETED=false
          if [ "$BASELINE_STATUS" = 0 ] && [ "$PATCH_STATUS" = 0 ] && \
             [ "$VALIDATION_STATUS" = 0 ] && [ "$CANDIDATE_STATUS" = 0 ] && \
             [ "$EVALUATION_STATUS" = 0 ]; then
            COMPLETED=true
          fi

          rm -rf target benchmarks/c-kernel/target examples/compact_metadata_probe.rs
          rm -f benchmarks/c-kernel/Cargo.lock
          if [ "$COMPLETED" != true ] || [ "$ACCEPTED" != true ]; then
            git restore src/components.rs src/preconditioner.rs src/workspace.rs \
              src/bin/cmg-bench.rs
          fi
          if [ "$COMPLETED" = true ]; then
            rm .github/workflows/optimize-compact-centering-metadata.yml
            rm scripts/compact_centering_metadata_experiment.py
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if [ "$COMPLETED" = true ] && [ "$ACCEPTED" = true ]; then
            MESSAGE='perf: compact coarse centering metadata'
          elif [ "$COMPLETED" = true ]; then
            MESSAGE='perf: record rejected compact-centering metadata experiment'
          else
            MESSAGE='ci: record compact-centering experiment failure [skip ci]'
          fi
          git commit -m "$MESSAGE"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce successful completion
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          BASELINE_STATUS: ${{ steps.baseline.outputs.status }}
          PATCH_STATUS: ${{ steps.patch.outputs.status }}
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
          CANDIDATE_STATUS: ${{ steps.candidate.outputs.status }}
          EVALUATION_STATUS: ${{ steps.evaluate.outputs.status }}
        run: |
          test "$BASELINE_STATUS" = 0
          test "$PATCH_STATUS" = 0
          test "$VALIDATION_STATUS" = 0
          test "$CANDIDATE_STATUS" = 0
          test "$EVALUATION_STATUS" = 0
