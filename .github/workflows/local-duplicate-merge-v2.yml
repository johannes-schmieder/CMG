name: Repaired cache-local duplicate merge gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/local-duplicate-merge-v2.yml'

permissions:
  contents: write

concurrency:
  group: cmg-local-duplicate-merge-v2
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify repaired cache-local duplicate merging
        shell: bash
        run: |
          set -euo pipefail
          python scripts/local_duplicate_merge_gate_v2.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/local-duplicate-merge-latest.json || true
