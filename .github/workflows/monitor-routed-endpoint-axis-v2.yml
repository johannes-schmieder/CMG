name: Monitor routed endpoint-axis v2 gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor-routed-endpoint-axis-v2.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: cmg-routed-endpoint-axis-v2-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for gate and preserve result or logs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/monitor_routed_endpoint_axis_v2.py

      - name: Show monitor record
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/routed-endpoint-axis-sort-v2-run-status.json || true
          git show origin/main:.ci/performance/routed-endpoint-axis-sort-latest.json || true
