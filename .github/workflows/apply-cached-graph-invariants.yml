name: Apply cached graph invariants

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cache_graph_invariants.py'
      - '.github/workflows/apply-cached-graph-invariants.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply auditable patch
        run: python scripts/cache_graph_invariants.py

      - name: Validate serial and parallel builds
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo check --lib --no-default-features
          cargo clippy --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --all-features
          cargo test --all-targets
          cargo test --all-targets --release
          cargo test --all-targets --all-features
          cargo test --all-targets --all-features --release

      - name: Commit validated graph cache
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/cache_graph_invariants.py
          rm .github/workflows/apply-cached-graph-invariants.yml
          rmdir scripts 2>/dev/null || true
          rm -rf target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: cache immutable graph invariants'
          git pull --rebase origin main
          git push origin HEAD:main
