name: Performance benchmark

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'PERFORMANCE_PLAN.md'
      - '.github/workflows/performance.yml'
  workflow_dispatch:
    inputs:
      vertices:
        description: Synthetic graph vertex count
        required: false
        default: '20000'
      rhs:
        description: Number of right-hand sides
        required: false
        default: '4'
      repetitions:
        description: Timing repetitions
        required: false
        default: '3'

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BASELINE_REF: b45b252f88925028e3ad9a73a3f75eeab05f6754
      TESTED_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      VERTICES: ${{ github.event.inputs.vertices || '20000' }}
      RHS: ${{ github.event.inputs.rhs || '4' }}
      REPETITIONS: ${{ github.event.inputs.repetitions || '3' }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 0

      - name: Checkout frozen benchmark baseline
        uses: actions/checkout@v4
        with:
          ref: b45b252f88925028e3ad9a73a3f75eeab05f6754
          path: baseline

      - name: Record machine
        shell: bash
        run: |
          uname -a
          lscpu || true
          free -h || true
          rustc --version
          cargo --version

      - name: Build baseline
        shell: bash
        run: |
          cd baseline
          CMG_BENCH_COMMIT="$BASELINE_REF" \
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-baseline" \
            cargo build --release --bin cmg-bench

      - name: Build candidate
        shell: bash
        run: |
          cd candidate
          CMG_BENCH_COMMIT="$TESTED_SHA" \
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-candidate" \
            cargo build --release --bin cmg-bench
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-routing" \
            cargo build --release \
              --manifest-path benchmarks/Cargo.toml \
              --bin full-pcg-routing

      - name: Run matched frozen-baseline benchmarks
        shell: bash
        run: |
          mkdir -p results
          for CASE in path worker-firm; do
            "$GITHUB_WORKSPACE/target-baseline/release/cmg-bench" \
              --case "$CASE" \
              --vertices "$VERTICES" \
              --rhs "$RHS" \
              --repetitions "$REPETITIONS" \
              --output "results/${CASE}-baseline.json"
            "$GITHUB_WORKSPACE/target-candidate/release/cmg-bench" \
              --case "$CASE" \
              --vertices "$VERTICES" \
              --rhs "$RHS" \
              --repetitions "$REPETITIONS" \
              --output "results/${CASE}-candidate.json"
          done

      - name: Run full certified serial-versus-planned PCG matrix
        shell: python
        run: |
          import json
          import math
          import os
          from pathlib import Path
          import statistics
          import subprocess

          binary = Path(os.environ['GITHUB_WORKSPACE']) / 'target-routing' / 'release' / 'full-pcg-routing'
          specs = [
              ('path-250k', ['path', 250000, 3, 4]),
              ('worker-firm-300k', ['worker-firm', 100000, 3, 4]),
              ('worker-firm-375k', ['worker-firm', 125000, 3, 4]),
              ('worker-firm-450k', ['worker-firm', 150000, 3, 4]),
              ('worker-firm-525k', ['worker-firm', 175000, 3, 4]),
              ('worker-firm-600k', ['worker-firm', 200000, 3, 4]),
              ('dense-worker-firm-400k', ['dense-worker-firm', 25000, 3, 4]),
              ('dense-worker-firm-600k', ['dense-worker-firm', 37500, 3, 4]),
              ('dense-worker-firm-800k', ['dense-worker-firm', 50000, 3, 4]),
              ('dense-worker-firm-1.6m', ['dense-worker-firm', 100000, 3, 4]),
          ]
          result = {
              'schema_version': 4,
              'experiment': 'full-certified-pcg-routing',
              'tested_sha': os.environ['TESTED_SHA'],
              'run_id': os.environ['RUN_ID'],
              'cases': {},
          }
          speedups = []
          numerical_failures = []
          route_mismatches = []

          for name, arguments in specs:
              time_path = Path(f'/tmp/full-pcg-{name}.time')
              completed = subprocess.run(
                  ['/usr/bin/time', '-v', '-o', str(time_path), str(binary), *map(str, arguments)],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=True,
              )
              print(completed.stdout, end='')
              payloads = [
                  json.loads(line)
                  for line in completed.stdout.splitlines()
                  if line.strip().startswith('{')
              ]
              if len(payloads) != 1:
                  raise RuntimeError(f'unexpected benchmark output for {name}: {payloads}')
              case = payloads[0]
              peak_line = next(
                  line for line in time_path.read_text().splitlines()
                  if 'Maximum resident set size (kbytes):' in line
              )
              case['peak_rss_kib'] = int(peak_line.rsplit(':', 1)[1].strip())
              case['recommended_execution'] = (
                  'Planned'
                  if case['operators'] > 0 and case['speedup'] >= 1.03
                  else 'Serial'
              )
              case['auto_matches_recommendation'] = (
                  case['auto_execution'] == case['recommended_execution']
              )
              result['cases'][name] = case
              speedups.append(case['speedup'])

              numerical_ok = (
                  case['max_scaled_difference'] <= 5e-11
                  and abs(case['serial_iterations'] - case['planned_iterations']) <= 1
                  and math.isfinite(case['serial_backward_error'])
                  and math.isfinite(case['planned_backward_error'])
              )
              if not numerical_ok:
                  numerical_failures.append(name)
              if not case['auto_matches_recommendation']:
                  route_mismatches.append(name)

          result['geometric_speedup'] = math.exp(
              statistics.fmean(math.log(value) for value in speedups)
          )
          result['minimum_speedup'] = min(speedups)
          result['maximum_speedup'] = max(speedups)
          result['maximum_scaled_difference'] = max(
              case['max_scaled_difference'] for case in result['cases'].values()
          )
          result['numerical_failures'] = numerical_failures
          result['route_mismatches'] = route_mismatches
          result['status'] = 'success' if not numerical_failures else 'failure'
          Path('results/full-pcg-routing.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          if numerical_failures:
              raise RuntimeError(f'full-PCG numerical failures: {numerical_failures}')

      - name: Build frozen-baseline comparison record
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          timing_fields = (
              "graph_build_median_ns",
              "hierarchy_build_median_ns",
              "preconditioner_apply_median_ns",
              "solve_batch_median_ns",
              "solve_per_rhs_median_ns",
          )

          def load(path):
              return json.loads(Path(path).read_text())

          def compare(case):
              baseline = load(f"results/{case}-baseline.json")
              candidate = load(f"results/{case}-candidate.json")
              ratios = {}
              for field in timing_fields:
                  denominator = baseline.get(field, 0)
                  ratios[field] = candidate.get(field, 0) / denominator if denominator else None
              return {
                  "baseline": baseline,
                  "candidate": candidate,
                  "candidate_over_baseline": ratios,
              }

          record = {
              "schema": 1,
              "tested_sha": os.environ["TESTED_SHA"],
              "baseline_ref": os.environ["BASELINE_REF"],
              "run_id": os.environ["RUN_ID"],
              "vertices": int(os.environ["VERTICES"]),
              "rhs": int(os.environ["RHS"]),
              "repetitions": int(os.environ["REPETITIONS"]),
              "results": {
                  "path": compare("path"),
                  "worker_firm": compare("worker-firm"),
              },
          }
          Path("results/latest.json").write_text(json.dumps(record, indent=2) + "\n")
          PY

      - name: Publish summary
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          frozen = json.loads(Path("results/latest.json").read_text())
          routing = json.loads(Path("results/full-pcg-routing.json").read_text())

          print("## CMG performance checkpoint")
          print()
          print(f"Candidate: `{frozen['tested_sha']}`")
          print(f"Baseline: `{frozen['baseline_ref']}`")
          print()
          print("### Frozen baseline ratios")
          print()
          print("| Case | Hierarchy | Apply | Solve/RHS |")
          print("|---|---:|---:|---:|")
          for name, result in frozen["results"].items():
              ratios = result["candidate_over_baseline"]
              print(
                  f"| {name} | "
                  f"{ratios['hierarchy_build_median_ns']:.3f}x | "
                  f"{ratios['preconditioner_apply_median_ns']:.3f}x | "
                  f"{ratios['solve_per_rhs_median_ns']:.3f}x |"
              )
          print()
          print("Ratios below 1.0 favor the candidate.")
          print()
          print("### Full certified PCG routing")
          print()
          print("| Case | Operators | Iterations | Planned speedup | Auto | Recommended |")
          print("|---|---:|---:|---:|---|---|")
          for name, case in routing['cases'].items():
              print(
                  f"| {name} | {case['operators']} | "
                  f"{case['serial_iterations']} / {case['planned_iterations']} | "
                  f"{case['speedup']:.3f}x | {case['auto_execution']} | "
                  f"{case['recommended_execution']} |"
              )
          print()
          print(f"Maximum scaled solution difference: `{routing['maximum_scaled_difference']:.3e}`")
          print(f"Routing mismatches: `{', '.join(routing['route_mismatches']) or 'none'}`")
          print()
          print("Hosted-runner timings are directional.")
          PY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: cmg-performance-${{ github.sha }}
          path: results/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist latest records safely
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate config user.name 'github-actions[bot]'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for ATTEMPT in 1 2 3 4; do
            git -C candidate fetch origin main
            git -C candidate reset --hard origin/main
            mkdir -p candidate/.ci/performance
            cp results/latest.json candidate/.ci/performance/latest.json
            cp results/full-pcg-routing.json \
              candidate/.ci/performance/full-pcg-routing-latest.json
            git -C candidate add \
              .ci/performance/latest.json \
              .ci/performance/full-pcg-routing-latest.json
            if git -C candidate diff --cached --quiet; then
              exit 0
            fi
            git -C candidate commit -m 'perf: record benchmark comparison [skip ci]'
            if git -C candidate push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
