name: Fix parallel gate benchmark formatting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-parallel-gate-format.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Insert benchmark formatting step
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/parallel_cmg_plan_gate.py')
          text = path.read_text()
          anchor = '''    run(["cargo", "fmt", "--all"])
          run(["cargo", "fmt", "--all", "--", "--check"])
          '''
          replacement = '''    run(["cargo", "fmt", "--all"])
          run(
              [
                  "cargo",
                  "fmt",
                  "--manifest-path",
                  "benchmarks/Cargo.toml",
                  "--all",
              ]
          )
          run(["cargo", "fmt", "--all", "--", "--check"])
          '''
          if anchor not in text:
              raise SystemExit('parallel gate formatting anchor missing')
          path.write_text(text.replace(anchor, replacement, 1))
          Path('.github/workflows/fix-parallel-gate-format.yml').unlink()

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: format benchmark crate in parallel gate'
          git pull --rebase origin main
          git push origin HEAD:main
