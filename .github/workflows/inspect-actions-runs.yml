name: Inspect recent Actions runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-actions-runs.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record recent relevant workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import urllib.request

          url = (
              f"{os.environ['GH_API']}/repos/{os.environ['GH_REPOSITORY']}"
              '/actions/runs?per_page=100'
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.load(response)
          relevant = []
          for run in payload.get('workflow_runs', []):
              text = ' '.join((run.get('name', ''), run.get('path', ''), run.get('display_title', ''))).lower()
              if 'radix' in text or 'capture' in text or 'inspect recent' in text:
                  relevant.append({
                      'id': run['id'],
                      'name': run['name'],
                      'path': run['path'],
                      'display_title': run['display_title'],
                      'head_sha': run['head_sha'],
                      'status': run['status'],
                      'conclusion': run['conclusion'],
                      'created_at': run['created_at'],
                      'updated_at': run['updated_at'],
                      'run_attempt': run['run_attempt'],
                      'html_url': run['html_url'],
                  })
          destination = Path('.ci/performance/recent-radix-actions-runs.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps({'runs': relevant}, indent=2) + '\n')

      - name: Commit diagnostic and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/inspect-actions-runs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: record recent radix Actions runs'
          git pull --rebase origin main
          git push origin HEAD:main
