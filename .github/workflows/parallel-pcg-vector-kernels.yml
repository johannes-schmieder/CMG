name: Parallel planned-PCG vector kernels

on:
  push:
    branches: [main]
    paths:
      - '.ci/triggers/parallel-pcg-vector'

permissions:
  contents: write

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and run qualification gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = Path('scripts/parallel_pcg_vector_gate.py.gz.b64').read_bytes()
          Path('/tmp/parallel_pcg_vector_gate.py').write_bytes(
              gzip.decompress(base64.b64decode(payload))
          )
          PY
          python /tmp/parallel_pcg_vector_gate.py

      - name: Show decision record
        if: always()
        shell: bash
        run: |
          git show origin/main:.ci/performance/parallel-pcg-vector-kernels-latest.json || true
