name: Apply serial warning fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-serial-warning-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Gate parallel-only helpers
        shell: python
        run: |
          from pathlib import Path

          csr = Path('src/csr.rs')
          text = csr.read_text()
          replacements = {
              '    fn maximum_weight_neighbors_serial(&self) -> (Vec<usize>, Vec<f64>) {':
                  '    #[cfg(feature = "parallel")]\n    fn maximum_weight_neighbors_serial(&self) -> (Vec<usize>, Vec<f64>) {',
              '    fn maximum_weight_neighbor(&self, row: usize) -> (usize, f64) {':
                  '    #[cfg(feature = "parallel")]\n    fn maximum_weight_neighbor(&self, row: usize) -> (usize, f64) {',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing csr marker: {old}')
              text = text.replace(old, new, 1)
          csr.write_text(text)

          execution = Path('src/execution.rs')
          text = execution.read_text()
          marker = 'pub(crate) const PARALLEL_SETUP_MIN_ITEMS: usize = 65_536;'
          if marker not in text:
              raise SystemExit('missing parallel setup threshold marker')
          text = text.replace(
              marker,
              '#[cfg(feature = "parallel")]\n' + marker,
              1,
          )
          execution.write_text(text)

      - name: Validate serial and parallel builds
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo check --lib --no-default-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
          cargo test --all-targets --all-features
          cargo test --all-targets --all-features --release

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-serial-warning-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: gate parallel-only setup helpers'
          git pull --rebase origin main
          git push origin HEAD:main
