name: Assess compact label feasibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assess-compact-label-feasibility.yml'

permissions:
  contents: write

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select and classify a private label vector
        shell: python
        run: |
          import json
          from pathlib import Path
          import re
          import subprocess

          analysis = json.loads(
              Path('.ci/performance/csr-index-layout-analysis.json').read_text()
          )
          candidates = analysis.get('candidate_fields', [])

          def score(item):
              name = item['field'].lower()
              struct = item['struct'].lower()
              value = 0
              if 'aggregate' in name:
                  value += 120
              if 'component' in name:
                  value += 110
              if 'parent' in name:
                  value += 90
              if 'label' in name:
                  value += 80
              if 'vertex' in name:
                  value += 20
              if 'column' in name or 'neighbor' in name:
                  value -= 200
              if 'report' in struct or 'diagnostic' in struct:
                  value -= 50
              return value

          ranked = sorted(candidates, key=score, reverse=True)
          selected = ranked[0] if ranked and score(ranked[0]) > 0 else None
          result = {
              'schema_version': 1,
              'analysis': 'compact-label-feasibility',
              'commit': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'selected': selected,
              'feasible_for_mechanical_experiment': False,
              'reason': '',
              'usage_categories': {},
              'references': [],
          }

          if selected is None:
              result['reason'] = 'no component/aggregate/parent/label Vec<usize> candidate found'
          else:
              field = selected['field']
              categories = {
                  'field_declaration': [],
                  'push_or_extend': [],
                  'index_read': [],
                  'slice_or_full_iteration': [],
                  'struct_initialization': [],
                  'clone_or_return': [],
                  'public_signature': [],
                  'other': [],
              }
              pattern = re.compile(rf'\b{re.escape(field)}\b')
              for source_path in sorted(Path('src').glob('*.rs')):
                  for line_number, line in enumerate(
                      source_path.read_text().splitlines(), 1
                  ):
                      if not pattern.search(line):
                          continue
                      stripped = line.strip()
                      item = {
                          'path': source_path.as_posix(),
                          'line': line_number,
                          'source': stripped,
                      }
                      if re.search(
                          rf'\b{re.escape(field)}\s*:\s*Vec\s*<\s*usize\s*>',
                          line,
                      ):
                          category = 'field_declaration'
                      elif re.search(
                          rf'\b{re.escape(field)}\s*\.\s*(?:push|extend)', line
                      ):
                          category = 'push_or_extend'
                      elif re.search(
                          rf'\b{re.escape(field)}\s*\[[^\]]+\]', line
                      ):
                          category = 'index_read'
                      elif re.search(
                          rf'for\s+[^\n]+\b{re.escape(field)}\b|'
                          rf'\b{re.escape(field)}\b[^\n]*\.(?:iter|chunks|windows)',
                          line,
                      ):
                          category = 'slice_or_full_iteration'
                      elif re.fullmatch(
                          rf'{re.escape(field)}\s*,?', stripped
                      ) or re.match(
                          rf'{re.escape(field)}\s*:', stripped
                      ):
                          category = 'struct_initialization'
                      elif re.search(
                          rf'\b{re.escape(field)}\b[^\n]*\.(?:clone|to_vec)', line
                      ) or re.search(rf'return\s+[^\n]*{re.escape(field)}', line):
                          category = 'clone_or_return'
                      elif 'pub ' in line or 'pub(' in line:
                          category = 'public_signature'
                      else:
                          category = 'other'
                      categories[category].append(item)
                      result['references'].append({**item, 'category': category})

              result['usage_categories'] = categories
              unsupported = (
                  categories['public_signature']
                  + categories['clone_or_return']
                  + categories['other']
              )
              result['feasible_for_mechanical_experiment'] = (
                  len(categories['field_declaration']) == 1
                  and not unsupported
              )
              result['reason'] = (
                  'all uses are private and mechanically bounded'
                  if result['feasible_for_mechanical_experiment']
                  else f'unsupported/public/ambiguous references: {len(unsupported)}'
              )

          destination = Path('.ci/performance/compact-label-feasibility.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')

      - name: Update live plan and remove one-shot workflow
        shell: python
        run: |
          import json
          from pathlib import Path

          result = json.loads(
              Path('.ci/performance/compact-label-feasibility.json').read_text()
          )
          selected = result.get('selected')
          target = (
              f"`{selected['struct']}.{selected['field']}`"
              if selected else 'none'
          )
          checkpoint = f'''### Compact label feasibility checkpoint — 2026-08-22

- Selected candidate: {target}.
- Mechanically bounded private experiment feasible:
  `{result['feasible_for_mechanical_experiment']}`.
- Reason: {result['reason']}.
- No production source was changed by this assessment.
- Machine-readable evidence:
  `.ci/performance/compact-label-feasibility.json`.

'''
          path = Path('PERFORMANCE_PLAN.md')
          text = path.read_text()
          marker = '## Current next action\n'
          if marker not in text:
              raise SystemExit('current-next-action heading missing')
          if '### Compact label feasibility checkpoint — 2026-08-22' not in text:
              text = text.replace(marker, checkpoint + marker, 1)
          path.write_text(text)
          Path('.github/workflows/assess-compact-label-feasibility.yml').unlink()

      - name: Commit feasibility checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: assess compact label feasibility'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Show result
        if: always()
        shell: bash
        run: cat .ci/performance/compact-label-feasibility.json || true
