name: Assess compact CSR feasibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assess-compact-csr-feasibility.yml'

permissions:
  contents: write

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Classify candidate field usage
        shell: python
        run: |
          import json
          from pathlib import Path
          import re
          import subprocess

          analysis_path = Path('.ci/performance/csr-index-layout-analysis.json')
          if not analysis_path.exists():
              raise SystemExit('CSR/index layout analysis is missing')
          analysis = json.loads(analysis_path.read_text())
          candidates = analysis.get('candidate_fields', [])

          def score(item):
              name = item['field'].lower()
              struct = item['struct'].lower()
              value = 0
              if 'column' in name:
                  value += 100
              if 'neighbor' in name:
                  value += 80
              if 'csr' in struct:
                  value += 50
              if 'operator' in struct:
                  value += 20
              return value

          ranked = sorted(candidates, key=score, reverse=True)
          selected = ranked[0] if ranked and score(ranked[0]) > 0 else None
          result = {
              'schema_version': 1,
              'analysis': 'compact-csr-feasibility',
              'commit': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'selected': selected,
              'feasible_for_mechanical_experiment': False,
              'reason': '',
              'usage_categories': {},
              'references': [],
          }

          if selected is None:
              result['reason'] = 'no CSR column/neighbor Vec<usize> candidate found'
          else:
              field = selected['field']
              categories = {
                  'field_declaration': [],
                  'push_or_extend': [],
                  'index_read': [],
                  'slice_iteration': [],
                  'iterator_chain': [],
                  'struct_initialization': [],
                  'public_signature': [],
                  'other': [],
              }
              field_pattern = re.compile(rf'\b{re.escape(field)}\b')
              for source_path in sorted(Path('src').glob('*.rs')):
                  lines = source_path.read_text().splitlines()
                  for line_number, line in enumerate(lines, 1):
                      if not field_pattern.search(line):
                          continue
                      stripped = line.strip()
                      item = {
                          'path': source_path.as_posix(),
                          'line': line_number,
                          'source': stripped,
                      }
                      if re.search(
                          rf'\b{re.escape(field)}\s*:\s*Vec\s*<\s*usize\s*>',
                          line,
                      ):
                          category = 'field_declaration'
                      elif re.search(
                          rf'\b{re.escape(field)}\s*\.\s*(?:push|extend)', line
                      ):
                          category = 'push_or_extend'
                      elif re.search(
                          rf'\b{re.escape(field)}\s*\[[^\]]+\]', line
                      ):
                          category = 'index_read'
                      elif re.search(
                          rf'&[^\n]*\b{re.escape(field)}\s*\[[^\]]*\.\.[^\]]*\]',
                          line,
                      ):
                          category = 'slice_iteration'
                      elif re.search(
                          rf'\b{re.escape(field)}\b[^\n]*\.(?:iter|chunks|windows)',
                          line,
                      ):
                          category = 'iterator_chain'
                      elif re.fullmatch(
                          rf'{re.escape(field)}\s*,?', stripped
                      ) or re.match(
                          rf'{re.escape(field)}\s*:', stripped
                      ):
                          category = 'struct_initialization'
                      elif 'pub ' in line or 'pub(' in line:
                          category = 'public_signature'
                      else:
                          category = 'other'
                      categories[category].append(item)
                      result['references'].append({**item, 'category': category})

              result['usage_categories'] = categories
              unsupported = (
                  categories['public_signature']
                  + categories['iterator_chain']
                  + categories['other']
              )
              result['feasible_for_mechanical_experiment'] = (
                  len(categories['field_declaration']) == 1
                  and not unsupported
              )
              if result['feasible_for_mechanical_experiment']:
                  result['reason'] = (
                      'all uses are declarations, construction, pushes, direct '
                      'index reads, or slice iteration and can be guarded by compilation'
                  )
              else:
                  result['reason'] = (
                      f"unsupported/public/ambiguous references: {len(unsupported)}"
                  )

          destination = Path('.ci/performance/compact-csr-feasibility.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')

      - name: Update live plan and remove one-shot workflow
        shell: python
        run: |
          import json
          from pathlib import Path

          result = json.loads(
              Path('.ci/performance/compact-csr-feasibility.json').read_text()
          )
          selected = result.get('selected')
          target = (
              f"`{selected['struct']}.{selected['field']}`"
              if selected else 'none'
          )
          checkpoint = f'''### Compact CSR feasibility checkpoint — 2026-08-22

- Selected candidate: {target}.
- Mechanically bounded experiment feasible:
  `{result['feasible_for_mechanical_experiment']}`.
- Reason: {result['reason']}.
- No production source was changed by this assessment.
- Machine-readable evidence:
  `.ci/performance/compact-csr-feasibility.json`.

'''
          path = Path('PERFORMANCE_PLAN.md')
          text = path.read_text()
          marker = '## Current next action\n'
          if marker not in text:
              raise SystemExit('current-next-action heading missing')
          if '### Compact CSR feasibility checkpoint — 2026-08-22' not in text:
              text = text.replace(marker, checkpoint + marker, 1)
          path.write_text(text)
          Path('.github/workflows/assess-compact-csr-feasibility.yml').unlink()

      - name: Commit feasibility checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: assess compact CSR feasibility'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Show result
        if: always()
        shell: bash
        run: cat .ci/performance/compact-csr-feasibility.json || true
