name: Parallel CMG routing diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/parallel-cmg-routing-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture exact Clippy output
        shell: python
        run: |
          import base64
          import gzip
          import json
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          result = {
              'schema_version': 1,
              'experiment': 'parallel-cmg-routing-diagnostic',
          }
          try:
              for index, source in enumerate((
                  'scripts/parallel_cmg_plan.patch.gz.b64',
                  'scripts/parallel_cmg_routing.patch.gz.b64',
              )):
                  patch = gzip.decompress(base64.b64decode(Path(source).read_bytes()))
                  path = Path(f'/tmp/routing-{index}.patch')
                  path.write_bytes(patch)
                  subprocess.run(['git', 'apply', str(path)], check=True)
              subprocess.run(['cargo', 'fmt', '--all'], check=True)
              subprocess.run([
                  'cargo', 'fmt', '--manifest-path', 'benchmarks/Cargo.toml', '--all'
              ], check=True)
              completed = subprocess.run(
                  ['cargo', 'clippy', '--all-targets', '--all-features', '--', '-D', 'warnings'],
                  cwd=root,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              result['returncode'] = completed.returncode
              result['output'] = completed.stdout[-20000:]
          except Exception as error:
              result['setup_error'] = repr(error)

          subprocess.run(['git', 'reset', '--hard', 'HEAD'], cwd=root, check=False)
          subprocess.run(['git', 'clean', '-fd'], cwd=root, check=False)
          record = Path('.ci/performance/parallel-cmg-routing-diagnostic.json')
          record.parent.mkdir(parents=True, exist_ok=True)
          record.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          Path('.github/workflows/parallel-cmg-routing-diagnostic.yml').unlink()
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run([
              'git', 'config', 'user.email',
              '41898282+github-actions[bot]@users.noreply.github.com'
          ], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(
              ['git', 'commit', '-m', 'ci: record parallel routing diagnostic'],
              check=True,
          )
          subprocess.run(['git', 'pull', '--rebase', 'origin', 'main'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
