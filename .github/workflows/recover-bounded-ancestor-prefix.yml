name: Recover bounded ancestor-prefix gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-bounded-ancestor-prefix.yml'

permissions:
  contents: write

concurrency:
  group: cmg-bounded-ancestor-prefix
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Complete or safely resolve the gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/recover_bounded_ancestor_prefix.py

      - name: Show recovery and decision records
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/bounded-ancestor-prefix-recovery.json || true
          git show origin/main:.ci/performance/bounded-ancestor-prefix-latest.json || true
