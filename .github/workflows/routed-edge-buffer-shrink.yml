name: Routed edge-buffer shrink gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/routed-edge-buffer-shrink.yml'

permissions:
  contents: write

concurrency:
  group: cmg-routed-edge-buffer-shrink
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify routed edge-buffer shrink policy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/routed_edge_buffer_shrink_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/routed-edge-buffer-shrink-latest.json || true
