name: Evaluate prevalidated PCG apply
# retry after indentation-independent matcher repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/evaluate-prevalidated-pcg-apply.yml'

permissions:
  contents: write

concurrency:
  group: prevalidated-pcg-apply
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "BASELINE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/prevalidated-apply-results"

      - name: Build baseline benchmark
        shell: bash
        run: |
          set -euo pipefail
          CMG_BENCH_COMMIT="$BASELINE_SHA" \
          CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-prevalidated-baseline" \
            cargo build --release --bin cmg-bench
          cp "$RUNNER_TEMP/cmg-prevalidated-baseline/release/cmg-bench" \
             "$RUNNER_TEMP/cmg-bench-baseline"

      - name: Apply and validate candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prevalidated_pcg_apply_patch.py
          python3 -m py_compile scripts/prevalidated_pcg_apply_experiment.py
          python3 scripts/prevalidated_pcg_apply_patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo check --lib --no-default-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          cargo test --all-targets --all-features --release
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --document-private-items --all-features

      - name: Build candidate benchmark
        shell: bash
        run: |
          set -euo pipefail
          CMG_BENCH_COMMIT="prevalidated-apply-candidate" \
          CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-prevalidated-candidate" \
            cargo build --release --bin cmg-bench
          cp "$RUNNER_TEMP/cmg-prevalidated-candidate/release/cmg-bench" \
             "$RUNNER_TEMP/cmg-bench-candidate"

      - name: Run alternating same-host benchmarks
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/prevalidated-apply-results"
          run_one() {
            local version="$1"
            local case_name="$2"
            local vertices="$3"
            local round="$4"
            "$RUNNER_TEMP/cmg-bench-$version" \
              --case "$case_name" --vertices "$vertices" --rhs 4 --repetitions 5 \
              --output "$ROOT/${version}-${case_name}-${vertices}-${round}.json"
          }
          for round in 0 1 2 3 4; do
            for case_name in path worker-firm; do
              for vertices in 5000 20000; do
                if (( round % 2 == 0 )); then
                  run_one baseline "$case_name" "$vertices" "$round"
                  run_one candidate "$case_name" "$vertices" "$round"
                else
                  run_one candidate "$case_name" "$vertices" "$round"
                  run_one baseline "$case_name" "$vertices" "$round"
                fi
              done
            done
          done

      - name: Evaluate candidate
        id: evaluate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prevalidated_pcg_apply_experiment.py evaluate

      - name: Update plan and commit result
        shell: bash
        env:
          ACCEPTED: ${{ steps.evaluate.outputs.accepted }}
        run: |
          set -euo pipefail
          python3 scripts/prevalidated_pcg_apply_experiment.py plan
          if [ "$ACCEPTED" != true ]; then
            git restore src/preconditioner.rs src/pcg.rs
          fi
          rm scripts/prevalidated_pcg_apply_experiment.py
          rm scripts/prevalidated_pcg_apply_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if [ "$ACCEPTED" = true ]; then
            git commit -m 'perf: use prevalidated CMG apply inside PCG'
          else
            git commit -m 'perf: record rejected prevalidated PCG apply experiment'
          fi
          git pull --rebase origin main
          git push origin HEAD:main
