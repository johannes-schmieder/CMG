name: Direct compact coarse contraction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-compact-contraction.yml'

permissions:
  contents: write

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify direct compact coarse-edge construction
        shell: python
        run: |
          import json
          import math
          import os
          from pathlib import Path
          import re
          import statistics
          import subprocess

          root = Path.cwd()
          baseline_sha = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          graph_path = Path('src/graph.rs')
          coarsen_path = Path('src/coarsen.rs')
          benchmark_manifest = Path('benchmarks/Cargo.toml')
          parallel_benchmark = Path(
              'benchmarks/src/bin/hierarchy-build-parallel.rs'
          )
          graph_original = graph_path.read_text()
          coarsen_original = coarsen_path.read_text()
          manifest_original = benchmark_manifest.read_text()

          def run(command, *, env=None, timeout=5400, check=True):
              print('+', ' '.join(command), flush=True)
              completed = subprocess.run(
                  command,
                  cwd=root,
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
              )
              print(completed.stdout, end='')
              if check and completed.returncode != 0:
                  raise RuntimeError(
                      f"command failed ({completed.returncode}): {' '.join(command)}"
                  )
              return completed

          def prepare_benchmarks():
              manifest = manifest_original.replace(
                  'cmg = { path = ".." }',
                  'cmg = { path = "..", features = ["parallel"] }',
              )
              manifest += '''

          [[bin]]
          name = "hierarchy-build-parallel"
          path = "src/bin/hierarchy-build-parallel.rs"
          '''
              benchmark_manifest.write_text(manifest)
              source = Path('benchmarks/src/bin/hierarchy-build.rs').read_text()
              source = source.replace(
                  'use cmg::{CmgOptions, CmgPreconditioner, Laplacian};',
                  'use cmg::{CmgOptions, CmgPreconditioner, Laplacian, ParallelExecutor, ParallelOptions};',
              )
              marker = '    let bench_graph = build_case(&case, scale);\n'
              replacement = marker + '''    let executor = ParallelExecutor::new(ParallelOptions {
              threads: 4,
              ..ParallelOptions::default()
          })
          .expect("parallel executor should build");
          '''
              if source.count(marker) != 1:
                  raise RuntimeError('parallel benchmark insertion anchor was not unique')
              source = source.replace(marker, replacement, 1)
              source = source.replace(
                  'CmgPreconditioner::build(black_box(&bench_graph.graph), CmgOptions::default())',
                  'CmgPreconditioner::build_with_executor(black_box(&bench_graph.graph), CmgOptions::default(), &executor)',
              )
              parallel_benchmark.write_text(source)

          def restore_benchmark_files():
              benchmark_manifest.write_text(manifest_original)
              parallel_benchmark.unlink(missing_ok=True)

          def build(target):
              env = os.environ.copy()
              env['CARGO_TARGET_DIR'] = str(target)
              run([
                  'cargo', 'build', '--release',
                  '--manifest-path', 'benchmarks/Cargo.toml',
                  '--bin', 'hierarchy-build',
                  '--bin', 'hierarchy-build-parallel',
              ], env=env)
              return {
                  'serial': target / 'release' / 'hierarchy-build',
                  'parallel': target / 'release' / 'hierarchy-build-parallel',
              }

          def sample(binary, arguments, tag):
              time_path = Path(f'/tmp/cmg-direct-contract-{tag}.time')
              completed = run([
                  '/usr/bin/time', '-v', '-o', str(time_path),
                  str(binary), *[str(value) for value in arguments],
              ])
              payloads = [
                  json.loads(line)
                  for line in completed.stdout.splitlines()
                  if line.strip().startswith('{')
              ]
              if len(payloads) != 1:
                  raise RuntimeError(f'unexpected hierarchy output: {payloads}')
              timing = time_path.read_text()
              rss = re.search(
                  r'Maximum resident set size \(kbytes\):\s*(\d+)', timing
              )
              if rss is None:
                  raise RuntimeError('peak RSS missing')
              return {
                  'median_ns': payloads[0]['median_ns'],
                  'peak_rss_kib': int(rss.group(1)),
                  'metadata': payloads[0],
              }

          def compare_case(baseline, candidate, arguments, name):
              baseline_samples = []
              candidate_samples = []
              sequence = (
                  ('baseline', baseline),
                  ('candidate', candidate),
                  ('candidate', candidate),
                  ('baseline', baseline),
              )
              for index, (label, binary) in enumerate(sequence):
                  observation = sample(
                      binary, arguments, f'{name}-{label}-{index}'
                  )
                  (baseline_samples if label == 'baseline'
                   else candidate_samples).append(observation)
              baseline_ns = statistics.median(
                  item['median_ns'] for item in baseline_samples
              )
              candidate_ns = statistics.median(
                  item['median_ns'] for item in candidate_samples
              )
              baseline_rss = max(
                  item['peak_rss_kib'] for item in baseline_samples
              )
              candidate_rss = max(
                  item['peak_rss_kib'] for item in candidate_samples
              )
              baseline_meta = baseline_samples[0]['metadata']
              candidate_meta = candidate_samples[0]['metadata']
              if baseline_meta != candidate_meta:
                  raise RuntimeError(
                      f'benchmark metadata mismatch for {name}: '
                      f'{baseline_meta} != {candidate_meta}'
                  )
              return {
                  'arguments': arguments,
                  'baseline_median_ns': baseline_ns,
                  'candidate_median_ns': candidate_ns,
                  'candidate_over_baseline_time': candidate_ns / baseline_ns,
                  'baseline_peak_rss_kib': baseline_rss,
                  'candidate_peak_rss_kib': candidate_rss,
                  'candidate_over_baseline_peak_rss': candidate_rss / baseline_rss,
                  'metadata': candidate_meta,
              }

          result = {
              'schema_version': 1,
              'experiment': 'direct-compact-coarse-contraction',
              'baseline_sha': baseline_sha,
              'accepted': False,
              'validation': 'not_run',
              'decision_reason': '',
              'cases': {},
          }

          try:
              prepare_benchmarks()
              baseline = build(Path('/tmp/cmg-direct-contract-baseline'))

              edge_anchor = '''    pub const fn weight(self) -> f64 {
              self.weight
          }
          }
          '''
              edge_replacement = '''    pub const fn weight(self) -> f64 {
              self.weight
          }

              /// Construct an edge from already validated internal graph data.
              pub(crate) fn from_internal_parts(
                  left: usize,
                  right: usize,
                  weight: f64,
              ) -> Result<Self, CmgError> {
                  debug_assert!(left != right);
                  debug_assert!(weight.is_finite() && weight > 0.0);
                  let (u, v) = if left < right {
                      (left, right)
                  } else {
                      (right, left)
                  };
                  let u = u32::try_from(u).map_err(|_| CmgError::VertexIndexTooWide {
                      vertex: u,
                      maximum: u32::MAX as usize,
                  })?;
                  let v = u32::try_from(v).map_err(|_| CmgError::VertexIndexTooWide {
                      vertex: v,
                      maximum: u32::MAX as usize,
                  })?;
                  Ok(Self { u, v, weight })
              }
          }
          '''
              if graph_original.count(edge_anchor) != 1:
                  raise RuntimeError('Edge weight anchor was not unique')
              graph_candidate = graph_original.replace(
                  edge_anchor, edge_replacement, 1
              )

              constructor_anchor = '    fn from_sorted_raw_edges('
              compact_methods = '''    pub(crate) fn from_compact_edges(
              vertex_count: usize,
              mut raw: Vec<Edge>,
          ) -> Result<Self, CmgError> {
              raw.sort_by(compare_raw_edges);
              Self::from_sorted_raw_edges(vertex_count, raw)
          }

              #[cfg(feature = "parallel")]
              pub(crate) fn from_compact_edges_with_executor(
                  vertex_count: usize,
                  mut raw: Vec<Edge>,
                  executor: &ParallelExecutor,
              ) -> Result<Self, CmgError> {
                  if raw.len() >= PARALLEL_SETUP_MIN_ITEMS
                      && executor.should_parallel(raw.len())
                  {
                      executor.install(|| raw.par_sort_unstable_by(compare_raw_edges));
                  } else {
                      raw.sort_by(compare_raw_edges);
                  }
                  Self::from_sorted_raw_edges(vertex_count, raw)
              }

          '''
              if graph_candidate.count(constructor_anchor) != 1:
                  raise RuntimeError('sorted raw-edge constructor anchor was not unique')
              graph_candidate = graph_candidate.replace(
                  constructor_anchor,
                  compact_methods + constructor_anchor,
                  1,
              )
              graph_path.write_text(graph_candidate)

              coarsen_candidate = coarsen_original.replace(
                  'use crate::{CmgError, Laplacian};',
                  'use crate::{CmgError, Edge, Laplacian};',
                  1,
              )
              serial_anchor = '''        let coarse_edges = graph.edges().iter().filter_map(|edge| {
              let left = self.labels[edge.u()];
              let right = self.labels[edge.v()];
              (left != right).then_some((left, right, edge.weight()))
          });
          Laplacian::from_edges(self.coarse_dimension(), coarse_edges)
          '''
              serial_replacement = '''        let mut coarse_edges = Vec::new();
          for edge in graph.edges() {
              let left = self.labels[edge.u()];
              let right = self.labels[edge.v()];
              if left != right {
                  coarse_edges.push(Edge::from_internal_parts(
                      left,
                      right,
                      edge.weight(),
                  )?);
              }
          }
          Laplacian::from_compact_edges(self.coarse_dimension(), coarse_edges)
          '''
              if coarsen_candidate.count(serial_anchor) != 1:
                  raise RuntimeError('serial contraction anchor was not unique')
              coarsen_candidate = coarsen_candidate.replace(
                  serial_anchor, serial_replacement, 1
              )

              parallel_anchor = '''        let coarse_edges: Vec<(usize, usize, f64)> = executor.install(|| {
              graph
                  .edges()
                  .par_iter()
                  .filter_map(|edge| {
                      let left = self.labels[edge.u()];
                      let right = self.labels[edge.v()];
                      (left != right).then_some((left, right, edge.weight()))
                  })
                  .collect()
          });
          Laplacian::from_edges_with_executor(self.coarse_dimension(), coarse_edges, executor)
          '''
              parallel_replacement = '''        let coarse_edges: Result<Vec<Edge>, CmgError> = executor.install(|| {
              graph
                  .edges()
                  .par_iter()
                  .filter_map(|edge| {
                      let left = self.labels[edge.u()];
                      let right = self.labels[edge.v()];
                      (left != right).then(|| {
                          Edge::from_internal_parts(left, right, edge.weight())
                      })
                  })
                  .collect()
          });
          Laplacian::from_compact_edges_with_executor(
              self.coarse_dimension(),
              coarse_edges?,
              executor,
          )
          '''
              if coarsen_candidate.count(parallel_anchor) != 1:
                  raise RuntimeError('parallel contraction anchor was not unique')
              coarsen_candidate = coarsen_candidate.replace(
                  parallel_anchor, parallel_replacement, 1
              )
              coarsen_path.write_text(coarsen_candidate)

              run(['cargo', 'fmt', '--all'])
              run(['cargo', 'fmt', '--all', '--', '--check'])
              run([
                  'cargo', 'fmt', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all', '--', '--check',
              ])
              run([
                  'cargo', 'clippy', '--all-targets', '--all-features',
                  '--', '-D', 'warnings',
              ])
              run([
                  'cargo', 'clippy', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all-targets', '--', '-D', 'warnings',
              ])
              doc_env = os.environ.copy()
              doc_env['RUSTDOCFLAGS'] = '-D warnings'
              run(['cargo', 'doc', '--no-deps'], env=doc_env)
              run(['cargo', 'test', '--all-targets'])
              run(['cargo', 'test', '--all-targets', '--release'])
              run(['cargo', 'test', '--all-targets', '--all-features'])
              run(['cargo', 'test', '--all-targets', '--all-features', '--release'])
              run(['cargo', 'build', '--release', '--all-features'])
              candidate = build(Path('/tmp/cmg-direct-contract-candidate'))
              result['validation'] = 'success'

              specs = [
                  ('serial-path-1m', 'serial', ['path', 1_000_000, 2]),
                  ('serial-worker-firm-3m', 'serial', ['worker-firm', 1_000_000, 2]),
                  ('serial-dense-worker-firm-1.6m', 'serial', ['dense-worker-firm', 100_000, 2]),
                  ('parallel-path-1m', 'parallel', ['path', 1_000_000, 2]),
                  ('parallel-worker-firm-3m', 'parallel', ['worker-firm', 1_000_000, 2]),
                  ('parallel-dense-worker-firm-1.6m', 'parallel', ['dense-worker-firm', 100_000, 2]),
              ]
              time_ratios = []
              memory_ratios = []
              parallel_time_ratios = []
              parallel_memory_ratios = []
              for name, mode, arguments in specs:
                  comparison = compare_case(
                      baseline[mode], candidate[mode], arguments, name
                  )
                  result['cases'][name] = comparison
                  ratio = comparison['candidate_over_baseline_time']
                  memory = comparison['candidate_over_baseline_peak_rss']
                  time_ratios.append(ratio)
                  memory_ratios.append(memory)
                  if mode == 'parallel':
                      parallel_time_ratios.append(ratio)
                      parallel_memory_ratios.append(memory)

              geometric_time = math.exp(
                  sum(math.log(value) for value in time_ratios)
                  / len(time_ratios)
              )
              geometric_memory = math.exp(
                  sum(math.log(value) for value in memory_ratios)
                  / len(memory_ratios)
              )
              parallel_time = math.exp(
                  sum(math.log(value) for value in parallel_time_ratios)
                  / len(parallel_time_ratios)
              )
              parallel_memory = math.exp(
                  sum(math.log(value) for value in parallel_memory_ratios)
                  / len(parallel_memory_ratios)
              )
              result['geometric_candidate_over_baseline_time'] = geometric_time
              result['worst_candidate_over_baseline_time'] = max(time_ratios)
              result['geometric_candidate_over_baseline_peak_rss'] = geometric_memory
              result['worst_candidate_over_baseline_peak_rss'] = max(memory_ratios)
              result['parallel_geometric_time_ratio'] = parallel_time
              result['parallel_geometric_peak_rss_ratio'] = parallel_memory
              result['acceptance_limits'] = {
                  'geometric_time_ratio_max': 1.03,
                  'per_case_time_ratio_max': 1.10,
                  'geometric_peak_rss_ratio_max': 1.01,
                  'worst_peak_rss_ratio_max': 1.03,
                  'required_parallel_signal': 'time <= 0.98 or peak RSS <= 0.97',
              }
              signal = parallel_time <= 0.98 or parallel_memory <= 0.97
              result['accepted'] = (
                  geometric_time <= 1.03
                  and max(time_ratios) <= 1.10
                  and geometric_memory <= 1.01
                  and max(memory_ratios) <= 1.03
                  and signal
              )
              result['decision_reason'] = (
                  'full qualification passed; compact direct contraction removed a material parallel setup cost'
                  if result['accepted']
                  else 'qualification passed but timing or memory did not meet the retention gate'
              )
          except Exception as error:
              result['decision_reason'] = f'experiment failed: {error}'
              result['error'] = repr(error)
              print(result['decision_reason'], flush=True)

          if not result['accepted']:
              graph_path.write_text(graph_original)
              coarsen_path.write_text(coarsen_original)
              run(['cargo', 'fmt', '--all'], check=False)

          restore_benchmark_files()

          record = Path('.ci/performance/direct-compact-contraction-latest.json')
          record.parent.mkdir(parents=True, exist_ok=True)
          record.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')

          plan_path = Path('PERFORMANCE_PLAN.md')
          plan = plan_path.read_text()
          marker = '## Current next action\n'
          if marker not in plan:
              raise RuntimeError('current-next-action heading missing')
          status = 'retained' if result['accepted'] else 'not retained'
          parallel_time = result.get('parallel_geometric_time_ratio')
          parallel_memory = result.get('parallel_geometric_peak_rss_ratio')
          evidence = ''
          if parallel_time is not None and parallel_memory is not None:
              evidence = (
                  f' Parallel setup time/RSS geometric ratios: '
                  f'{parallel_time:.3f}/{parallel_memory:.3f}.'
              )
          checkpoint = f'''### Direct compact contraction checkpoint — 2026-08-22

- Building coarse levels directly in the retained 16-byte `Edge` layout was
  **{status}**.{evidence}
- Full serial/all-feature formatting, Clippy, rustdoc, debug/release tests, and
  release build status: `{result['validation']}`.
- Machine-readable evidence:
  `.ci/performance/direct-compact-contraction-latest.json`.

'''
          if '### Direct compact contraction checkpoint — 2026-08-22' not in plan:
              plan = plan.replace(marker, checkpoint + marker, 1)
          plan_path.write_text(plan)

          Path('.github/workflows/direct-compact-contraction.yml').unlink(missing_ok=True)

          run(['git', 'config', 'user.name', 'github-actions[bot]'])
          run([
              'git', 'config', 'user.email',
              '41898282+github-actions[bot]@users.noreply.github.com',
          ])
          run(['git', 'add', '-A'])
          message = (
              'perf: construct coarse graphs in compact edge storage'
              if result['accepted']
              else 'perf: record direct compact contraction experiment'
          )
          run(['git', 'commit', '-m', message])
          run(['git', 'pull', '--rebase', 'origin', 'main'])
          run(['git', 'push', 'origin', 'HEAD:main'])

      - name: Show result
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/direct-compact-contraction-latest.json || true
