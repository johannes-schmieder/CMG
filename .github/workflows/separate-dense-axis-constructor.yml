name: Separate dense axis-constructor gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/separate-dense-axis-constructor.yml'

permissions:
  contents: write

concurrency:
  group: cmg-separate-dense-axis-constructor
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify separate dense axis constructor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/separate_dense_axis_constructor_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/separate-dense-axis-constructor-latest.json || true
