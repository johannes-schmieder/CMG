name: Finalize PCG strategy matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-pcg-strategy-matrix.yml'
      - 'scripts/finalize_pcg_strategy_matrix.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Finalize completed timings and threshold search
        run: python scripts/finalize_pcg_strategy_matrix.py

      - name: Show result
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/pcg-strategy-matrix.json || true
