name: Export source snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive source
        shell: bash
        run: tar --exclude='.git' -czf cmg-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cmg-source-${{ github.sha }}
          path: cmg-source.tar.gz
          if-no-files-found: error
          retention-days: 1
