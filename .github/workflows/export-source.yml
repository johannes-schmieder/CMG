name: Export source snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-source.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive source
        shell: bash
        run: tar --exclude='.git' -czf cmg-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cmg-source-${{ github.sha }}
          path: cmg-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Record export run
        shell: bash
        run: |
          mkdir -p .ci
          printf '{\n  "run_id": "%s",\n  "head_sha": "%s",\n  "artifact_name": "cmg-source-%s"\n}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_SHA" > .ci/source-export.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/source-export.json
          git commit -m 'dev: record source export [skip ci]'
          git push
