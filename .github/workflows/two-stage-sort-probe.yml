name: Two-stage edge-sort probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/two-stage-sort-probe.yml'
      - 'scripts/two_stage_sort_probe.py.gz.b64'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and run benchmark-only probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = Path('scripts/two_stage_sort_probe.py.gz.b64').read_bytes()
          Path('/tmp/two_stage_sort_probe.py').write_bytes(
              gzip.decompress(base64.b64decode(payload))
          )
          PY
          python /tmp/two_stage_sort_probe.py

      - name: Show probe record
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/two-stage-sort-probe.json || true
