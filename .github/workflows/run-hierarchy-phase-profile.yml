name: Run hierarchy phase profile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-hierarchy-phase-profile.yml'

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate benchmark binary
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo fmt --manifest-path benchmarks/Cargo.toml --all -- --check
          cargo clippy --manifest-path benchmarks/Cargo.toml --all-targets -- -D warnings
          cargo build --manifest-path benchmarks/Cargo.toml --bin hierarchy-phase-profile --release

      - name: Run million-scale phase profiles
        shell: python
        run: |
          import json
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          binary = root / 'benchmarks/target/release/hierarchy-phase-profile'
          record = {
              'schema_version': 3,
              'experiment': 'hierarchy-phase-profile',
              'source_sha': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'status': 'not_run',
              'cases': {},
          }

          def sample(arguments):
              completed = subprocess.run(
                  [str(binary), *arguments],
                  cwd=root,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=9000,
              )
              print(completed.stdout, end='')
              if completed.returncode != 0:
                  raise RuntimeError(
                      f'profile failed ({completed.returncode}): {arguments}'
                  )
              payloads = [
                  json.loads(line)
                  for line in completed.stdout.splitlines()
                  if line.strip().startswith('{')
              ]
              if len(payloads) != 1:
                  raise RuntimeError(f'unexpected profiler output: {payloads}')
              return payloads[0]

          try:
              specs = [
                  ('path-1m', ['path', '1000000', '3']),
                  ('worker-firm-1.5m', ['worker-firm', '500000', '3']),
                  ('dense-worker-firm-1.6m', [
                      'dense-worker-firm', '100000', '3'
                  ]),
              ]
              for name, arguments in specs:
                  record['cases'][name] = sample(arguments)

              phase_totals = {}
              manual_total = 0
              hierarchy_total = 0
              preconditioner_total = 0
              for case in record['cases'].values():
                  manual_total += case['manual_total_median_ns']
                  hierarchy_total += case['production_hierarchy_median_ns']
                  preconditioner_total += case[
                      'production_preconditioner_median_ns'
                  ]
                  for phase, value in case['phase_median_ns'].items():
                      phase_totals[phase] = phase_totals.get(phase, 0) + value

              dominant_phase, dominant_ns = max(
                  phase_totals.items(), key=lambda item: item[1]
              )
              record.update({
                  'status': 'success',
                  'phase_total_ns': phase_totals,
                  'summed_manual_total_ns': manual_total,
                  'summed_production_hierarchy_ns': hierarchy_total,
                  'summed_production_preconditioner_ns': preconditioner_total,
                  'dominant_phase': dominant_phase,
                  'dominant_phase_share_of_manual_total':
                      dominant_ns / max(manual_total, 1),
                  'manual_attributed_share':
                      sum(phase_totals.values()) / max(manual_total, 1),
              })
          except Exception as error:
              record['status'] = 'failure'
              record['error'] = repr(error)

          destination = Path('.ci/performance/hierarchy-phase-profile.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')

          if record['status'] != 'success':
              raise SystemExit(record['error'])

      - name: Commit profile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/run-hierarchy-phase-profile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: record hierarchy setup phase profile'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Show profile
        if: always()
        shell: bash
        run: |
          git show origin/main:.ci/performance/hierarchy-phase-profile.json || true
