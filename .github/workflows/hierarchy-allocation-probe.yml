name: Hierarchy allocation probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hierarchy-allocation-probe.yml'
      - 'scripts/run_hierarchy_allocation_probe.py'
      - 'benchmarks/src/bin/hierarchy-alloc.rs'
      - 'benchmarks/Cargo.toml'

concurrency:
  group: cmg-hierarchy-allocation-probe
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compile and run allocation probe
        run: python scripts/run_hierarchy_allocation_probe.py

      - name: Show retained result
        if: always()
        run: git show origin/main:.ci/performance/hierarchy-allocation-probe.json || true
