name: Final bounded-prefix large-path confirmation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bounded-prefix-large-path-confirmation-v3.yml'

permissions:
  contents: write

concurrency:
  group: cmg-bounded-prefix-large-path-confirmation
  cancel-in-progress: true

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm large-path RSS and timing behavior
        shell: bash
        run: |
          set -euo pipefail
          python scripts/bounded_prefix_large_path_confirmation_v3.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/bounded-prefix-large-path-confirmation.json || true
