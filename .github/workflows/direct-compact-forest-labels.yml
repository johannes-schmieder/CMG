name: Direct compact forest-label gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-compact-forest-labels.yml'

permissions:
  contents: write

concurrency:
  group: cmg-direct-compact-forest-labels
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify direct compact forest labels
        shell: bash
        run: |
          set -euo pipefail
          python scripts/direct_compact_forest_labels_gate_v2.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/direct-compact-forest-labels-latest.json || true
