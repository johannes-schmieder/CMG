# Armed after the workflow existed on the default branch.
name: Requalify routing after lazy aggregate sizes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/requalify-lazy-size-routing.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run complete routing matrix
        run: python scripts/requalify_lazy_size_routing.py

      - name: Commit qualification checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: requalify routing after lazy sizes'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Show result
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/post-lazy-size-routing.json || true
