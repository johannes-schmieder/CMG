name: Fallback compact hierarchy index metadata gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-hierarchy-index-metadata-fallback.yml'
      - '.ci/performance/compact-hierarchy-index-latest.json'

permissions:
  contents: write

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rerun with structural metadata normalization if needed
        run: python scripts/compact_hierarchy_index_metadata_fallback.py

      - name: Commit fallback checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          if ! git diff --cached --quiet -- src; then
            message='perf: retain compact hierarchy indices after structural metadata gate'
          else
            message='perf: record compact hierarchy-index metadata fallback'
          fi
          git commit -m "$message"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
