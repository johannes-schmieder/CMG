name: Inspect zero-copy benchmark run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-forest-label-run.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record latest benchmark runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import urllib.request

          url = (
              f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}"
              "/actions/workflows/forest-label-move.yml/runs?per_page=10"
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'cmg-ci-inspector',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          runs = []
          for item in payload.get('workflow_runs', [])[:10]:
              runs.append({
                  'id': item['id'],
                  'run_number': item['run_number'],
                  'run_attempt': item['run_attempt'],
                  'status': item['status'],
                  'conclusion': item['conclusion'],
                  'event': item['event'],
                  'head_sha': item['head_sha'],
                  'created_at': item['created_at'],
                  'updated_at': item['updated_at'],
                  'jobs_url': item['jobs_url'],
                  'html_url': item['html_url'],
              })
          result = {
              'schema_version': 1,
              'workflow': 'forest-label-move.yml',
              'total_count': payload.get('total_count', 0),
              'runs': runs,
          }
          destination = Path('.ci/performance/forest-label-run-status.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          Path('.github/workflows/inspect-forest-label-run.yml').unlink()

      - name: Commit inspection result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: record zero-copy benchmark run status [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
