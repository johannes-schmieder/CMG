name: Compact CSR row-offset full-PCG gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-csr-row-offsets-pcg.yml'

permissions:
  contents: write

concurrency:
  group: cmg-compact-csr-row-offsets-pcg
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify compact CSR row offsets through certified full PCG
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compact_csr_row_offsets_pcg_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/compact-csr-row-offsets-pcg-latest.json || true
