name: Diagnose bounded ancestor-prefix Clippy failure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-bounded-ancestor-prefix-clippy.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct candidate, capture Clippy, and restore source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/diagnose_bounded_ancestor_prefix_clippy.py

      - name: Show diagnostic
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/bounded-ancestor-prefix-clippy.json || true
