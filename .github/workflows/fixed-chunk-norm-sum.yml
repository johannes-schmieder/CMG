name: Gate deterministic fixed chunk norm sum

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fixed-chunk-norm-sum.yml'
      - '.ci/performance/pcg-phase-profile-post-reductions.json'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run dependent norm-sum gate
        run: python scripts/fixed_chunk_norm_sum_gate.py

      - name: Commit decision checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          if ! git diff --cached --quiet -- src/pcg.rs; then
            message='perf: add deterministic fixed-chunk norm sums'
          else
            message='perf: record deterministic norm-sum experiment'
          fi
          git commit -m "$message"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
