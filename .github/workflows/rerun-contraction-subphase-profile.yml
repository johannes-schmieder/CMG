name: Rerun contraction subphase profile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rerun-contraction-subphase-profile.yml'

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Format, validate, and profile contraction subphases
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          workflow = Path('.github/workflows/rerun-contraction-subphase-profile.yml')
          source = Path('benchmarks/src/bin/contraction-subphase-profile.rs')
          record = Path('.ci/performance/contraction-subphase-profile.json')
          plan_path = Path('PERFORMANCE_PLAN.md')
          status_path = Path('PERFORMANCE_STATUS.md')
          source_sha = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()

          def run(command, *, env=None, timeout=12000):
              print('+', ' '.join(command), flush=True)
              completed = subprocess.run(
                  command,
                  cwd=root,
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
              )
              print(completed.stdout, end='')
              if completed.returncode != 0:
                  raise RuntimeError(
                      f"command failed ({completed.returncode}): {' '.join(command)}"
                  )
              return completed

          def replace_section(text, heading, next_heading, body):
              start = text.find(heading)
              if start < 0:
                  raise RuntimeError(f'missing heading: {heading.strip()}')
              end = text.find(next_heading, start + len(heading))
              if end < 0:
                  raise RuntimeError(f'missing heading: {next_heading.strip()}')
              return text[:start] + body.rstrip() + '\n\n' + text[end:]

          result = {
              'schema_version': 2,
              'experiment': 'contraction-subphase-profile',
              'source_sha': source_sha,
              'status': 'not_run',
              'cases': {},
              'phase_totals_ns': {},
              'phase_shares': {},
          }

          try:
              text = source.read_text()
              text = text.replace(
                  'for repetition in 0..repetitions {',
                  'for _ in 0..repetitions {',
              )
              source.write_text(text)

              run(['cargo', 'fmt', '--all'])
              run([
                  'cargo', 'fmt', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all',
              ])
              run(['cargo', 'fmt', '--all', '--', '--check'])
              run([
                  'cargo', 'fmt', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all', '--', '--check',
              ])
              run([
                  'cargo', 'clippy', '--all-targets', '--all-features',
                  '--', '-D', 'warnings',
              ])
              run([
                  'cargo', 'clippy', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all-targets', '--', '-D', 'warnings',
              ])
              doc_env = os.environ.copy()
              doc_env['RUSTDOCFLAGS'] = '-D warnings'
              run([
                  'cargo', 'doc', '--no-deps', '--document-private-items',
                  '--all-features',
              ], env=doc_env)
              run(['cargo', 'test', '--all-targets'])
              run(['cargo', 'test', '--all-targets', '--release'])
              run(['cargo', 'test', '--all-targets', '--all-features'])
              run([
                  'cargo', 'test', '--all-targets', '--all-features',
                  '--release',
              ])
              run(['cargo', 'build', '--release'])
              run([
                  'cargo', 'build', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all-targets', '--release',
              ])

              binary = Path('benchmarks/target/release/contraction-subphase-profile')
              specs = (
                  ('path-1m', 'path', 1_000_000, 5),
                  ('worker-firm-1.5m', 'worker-firm', 500_000, 5),
                  ('dense-worker-firm-1.6m', 'dense-worker-firm', 100_000, 5),
              )
              phases = ('mapping', 'sorting', 'merging', 'diagonal', 'finalize')
              totals = {phase: 0 for phase in phases}
              cases = {}

              for name, case, scale, repetitions in specs:
                  completed = run([
                      str(binary), case, str(scale), str(repetitions),
                      'comparison',
                  ])
                  payloads = [
                      json.loads(line)
                      for line in completed.stdout.splitlines()
                      if line.strip().startswith('{')
                  ]
                  case_rows = [item for item in payloads if item.get('record') == 'case']
                  level_rows = [item for item in payloads if item.get('record') == 'level']
                  if len(case_rows) != 1 or not level_rows:
                      raise RuntimeError(
                          f'{name}: unexpected profiler output '
                          f'({len(case_rows)} case rows, {len(level_rows)} level rows)'
                      )
                  case_row = case_rows[0]
                  if case_row['profiled_levels'] != len(level_rows):
                      raise RuntimeError(f'{name}: profiled-level count mismatch')
                  cases[name] = {
                      'summary': case_row,
                      'levels': level_rows,
                  }
                  for phase in phases:
                      totals[phase] += int(case_row[f'{phase}_ns'])

              manual_total = sum(totals.values())
              if manual_total <= 0:
                  raise RuntimeError('manual contraction total is zero')
              shares = {
                  phase: totals[phase] / manual_total
                  for phase in phases
              }
              dominant = max(phases, key=lambda phase: totals[phase])
              result.update({
                  'status': 'success',
                  'cases': cases,
                  'phase_totals_ns': totals,
                  'phase_shares': shares,
                  'manual_total_ns': manual_total,
                  'dominant_phase': dominant,
                  'dominant_share': shares[dominant],
                  'exact_equivalence': 'passed for every profiled level and repetition',
              })
          except Exception as error:
              result['status'] = 'failure'
              result['error'] = repr(error)
              print(f'contraction subphase profile failed: {error}', flush=True)

          record.parent.mkdir(parents=True, exist_ok=True)
          record.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')

          dominant = result.get('dominant_phase', 'unresolved')
          share = float(result.get('dominant_share', 0.0))
          case_count = len(result.get('cases', {}))
          checkpoint = f'''### Contraction subphase profile rerun — 2026-08-23

          - Read-only benchmark status: `{result['status']}`.
          - Aggregate dominant contraction phase: `{dominant}`
            (`{share:.1%}` of attributed manual contraction time).
          - Completed cases: `{case_count}`.
          - Every reconstructed coarse graph was checked exactly against production
            endpoint order, weight bits, diagonal bits, matrix nonzeros, operator
            bound, and `Aggregation::contract` output before timing was accepted.
          - Production numerical behavior was unchanged.
          - Machine-readable evidence:
            `.ci/performance/contraction-subphase-profile.json`.

          '''
          checkpoint = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in checkpoint.splitlines()
          )

          plan = plan_path.read_text()
          marker = '## Current next action\n'
          if marker not in plan:
              raise RuntimeError('current-next-action heading missing from plan')
          if '### Contraction subphase profile rerun — 2026-08-23' not in plan:
              plan = plan.replace(marker, checkpoint + marker, 1)
          next_action = f'''## Current next action

          1. Use the successful contraction subphase profile to benchmark-gate the
             next `{dominant}` optimization; do not change unrelated numerical code.
          2. Preserve exact coarse-graph ordering, compensated duplicate summation,
             hierarchy metadata, and original-system solve certification.
          3. Extend user-facing guidance for automatic, within-solve, and
             across-RHS parallel execution.
          4. Obtain controlled 8-, 16-, and 32-thread/high-memory evidence when
             suitable hardware is available.
          '''
          next_action = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in next_action.splitlines()
          ).rstrip() + '\n'
          current = plan.find(marker)
          plan = plan[:current] + next_action
          plan_path.write_text(plan)

          status = status_path.read_text()
          evidence = f'''## Latest contraction subphase evidence

          The read-only contraction profiler completed with status
          `{result['status']}`. The aggregate dominant phase is `{dominant}` at
          `{share:.1%}` of attributed manual contraction time across `{case_count}`
          million-scale cases. Exact coarse-graph equivalence was checked before
          every timing was accepted. See
          `.ci/performance/contraction-subphase-profile.json`.
          '''
          evidence = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in evidence.splitlines()
          )
          status = replace_section(
              status,
              '## Latest contraction subphase evidence\n',
              '## Remaining major work\n',
              evidence,
          )
          remaining = f'''## Remaining major work

          - Benchmark-gate a narrowly scoped `{dominant}` optimization selected
            from the successful subphase profile.
          - Extend user-facing memory/performance guidance for automatic,
            explicit within-solve, and explicit across-RHS execution.
          - Obtain controlled 8-, 16-, and 32-thread/high-memory evidence on
            suitable hardware; ordinary hosted runners expose only four logical CPUs.
          '''
          remaining = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in remaining.splitlines()
          )
          status = replace_section(
              status,
              '## Remaining major work\n',
              '## Recovery rule\n',
              remaining,
          )
          status_path.write_text(status)

          workflow.unlink(missing_ok=True)
          run(['git', 'config', 'user.name', 'github-actions[bot]'])
          run([
              'git', 'config', 'user.email',
              '41898282+github-actions[bot]@users.noreply.github.com',
          ])
          run(['git', 'add', '-A'])
          run(['git', 'commit', '-m', 'perf: rerun contraction subphase profile'])
          run(['git', 'pull', '--rebase', 'origin', 'main'])
          run(['git', 'push', 'origin', 'HEAD:main'])

      - name: Show profile record
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/contraction-subphase-profile.json || true
