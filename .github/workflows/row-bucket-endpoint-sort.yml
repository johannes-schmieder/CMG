name: Row-bucket endpoint-sort gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/row-bucket-endpoint-sort.yml'

permissions:
  contents: write

concurrency:
  group: cmg-row-bucket-endpoint-sort
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify in-place row-bucket endpoint sorting
        shell: bash
        run: |
          set -euo pipefail
          python scripts/row_bucket_endpoint_sort_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/row-bucket-endpoint-sort-latest.json || true
