name: Fused diagonal-statistics gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fused-diagonal-statistics.yml'

permissions:
  contents: write

concurrency:
  group: cmg-fused-diagonal-statistics
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify fused diagonal statistics
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fused_diagonal_statistics_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/fused-diagonal-statistics-latest.json || true
