name: Selectively routed parallel CMG plan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/parallel-cmg-routed-plan.yml'
      - 'scripts/parallel_cmg_routed_gate.py'
      - 'scripts/parallel_cmg_routing.patch.gz.b64'

permissions:
  contents: write

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify selectively routed optional ParallelCmgPlan
        run: python scripts/parallel_cmg_routed_gate.py

      - name: Show result
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/parallel-cmg-routed-plan-latest.json || true
