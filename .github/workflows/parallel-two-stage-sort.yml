name: Parallel endpoint-first sort gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/parallel-two-stage-sort.yml'

permissions:
  contents: write

concurrency:
  group: cmg-parallel-two-stage-sort
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify parallel endpoint-first sorting
        shell: bash
        run: |
          set -euo pipefail
          python scripts/parallel_two_stage_sort_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/parallel-two-stage-sort-latest.json || true
