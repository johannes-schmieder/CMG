name: Endpoint-key structure profile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-endpoint-key-structure.yml'

permissions:
  contents: write

concurrency:
  group: cmg-endpoint-key-structure-profile
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Profile mapped endpoint-key structure
        shell: bash
        run: |
          set -euo pipefail
          python scripts/profile_endpoint_key_structure.py

      - name: Show profile
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/endpoint-key-structure-profile.json || true
