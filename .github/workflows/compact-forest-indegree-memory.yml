name: Compact forest-indegree exact-memory gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-forest-indegree-memory.yml'

permissions:
  contents: write

concurrency:
  group: cmg-compact-forest-indegree-memory
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Requalify compact forest indegrees with exact memory accounting
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compact_forest_indegree_memory_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/compact-forest-indegree-memory-latest.json || true
