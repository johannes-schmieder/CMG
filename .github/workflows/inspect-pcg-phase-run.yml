name: Inspect PCG phase run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-pcg-phase-run.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record phase-workflow runs
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          url = (
              f'https://api.github.com/repos/{repository}/actions/workflows/'
              'pcg-phase-profile.yml/runs?per_page=10'
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          runs = [
              {
                  'id': run['id'],
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'head_sha': run['head_sha'],
                  'created_at': run['created_at'],
                  'updated_at': run['updated_at'],
                  'run_attempt': run['run_attempt'],
                  'html_url': run['html_url'],
              }
              for run in payload.get('workflow_runs', [])
          ]
          record = {
              'schema_version': 1,
              'workflow': 'pcg-phase-profile.yml',
              'runs': runs,
          }
          destination = Path('.ci/performance/pcg-phase-run-state.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
          Path('.github/workflows/inspect-pcg-phase-run.yml').unlink()

      - name: Commit inspection receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: record PCG phase workflow state [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
