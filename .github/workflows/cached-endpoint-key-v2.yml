name: Cached endpoint-key representation gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cached-endpoint-key-v2.yml'

permissions:
  contents: write

concurrency:
  group: cmg-cached-endpoint-key
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify directly cached endpoint keys
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cached_endpoint_key_gate_v2.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/cached-endpoint-key-latest.json || true
