name: Bounded ancestor-prefix exact-memory gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bounded-ancestor-prefix-memory.yml'

permissions:
  contents: write

concurrency:
  group: cmg-bounded-ancestor-prefix-memory
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Requalify bounded prefixes with exact memory accounting
        shell: bash
        run: |
          set -euo pipefail
          python scripts/bounded_ancestor_prefix_memory_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/bounded-ancestor-prefix-memory-latest.json || true
