name: Profile contraction edge survival

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-contraction-survival.yml'

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and run level-by-level survival probe
        shell: python
        run: |
          import json
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          manifest = Path('benchmarks/Cargo.toml')
          original_manifest = manifest.read_text()
          source_path = Path('benchmarks/src/bin/contraction-survival.rs')
          source_path.write_text(r'''
          use std::hint::black_box;
          use std::time::Instant;

          use cmg::{CmgOptions, CmgPreconditioner, Laplacian};

          struct BenchGraph {
              graph: Laplacian,
              vertices: usize,
              edges: usize,
          }

          fn path_graph(vertices: usize) -> BenchGraph {
              let edges: Vec<_> = (0..vertices.saturating_sub(1))
                  .map(|vertex| (vertex, vertex + 1, 1.0))
                  .collect();
              let edge_count = edges.len();
              BenchGraph {
                  graph: Laplacian::from_edges(vertices, edges).expect("valid path graph"),
                  vertices,
                  edges: edge_count,
              }
          }

          fn worker_firm_graph(per_side: usize, degree: usize) -> BenchGraph {
              let vertices = 2 * per_side;
              let firm_offset = per_side;
              let mut edges = Vec::with_capacity(degree * per_side);
              for worker in 0..per_side {
                  for link in 0..degree {
                      let firm = if link == 0 {
                          worker
                      } else if link == 1 {
                          (worker + 1) % per_side
                      } else {
                          ((2 * link + 1) * worker + 17 * link + 3) % per_side
                      };
                      let weight = 0.25 + ((worker + 7 * link) % 23) as f64 / 16.0;
                      edges.push((worker, firm_offset + firm, weight));
                  }
              }
              let edge_count = edges.len();
              BenchGraph {
                  graph: Laplacian::from_edges(vertices, edges)
                      .expect("valid worker-firm graph"),
                  vertices,
                  edges: edge_count,
              }
          }

          fn build_case(case: &str, scale: usize) -> BenchGraph {
              match case {
                  "path" => path_graph(scale),
                  "worker-firm" => worker_firm_graph(scale, 3),
                  "dense-worker-firm" => worker_firm_graph(scale, 16),
                  _ => panic!("unknown case"),
              }
          }

          fn median(mut values: Vec<u128>) -> u128 {
              values.sort_unstable();
              values[values.len() / 2]
          }

          fn main() {
              let mut arguments = std::env::args().skip(1);
              let case = arguments.next().expect("case required");
              let scale = arguments
                  .next()
                  .expect("scale required")
                  .parse::<usize>()
                  .expect("scale must be integer");
              let bench = build_case(&case, scale);
              let preconditioner = CmgPreconditioner::build(
                  &bench.graph,
                  CmgOptions::default(),
              )
              .expect("hierarchy should build");
              let levels = preconditioner.hierarchy().levels();

              for (index, level) in levels.iter().enumerate() {
                  let Some(aggregation) = level.aggregation() else {
                      continue;
                  };
                  if index + 1 >= levels.len() {
                      continue;
                  }
                  let graph = level.graph();
                  let labels = aggregation.labels();
                  let mut timings = Vec::with_capacity(7);
                  let mut surviving = 0usize;
                  for _ in 0..7 {
                      let start = Instant::now();
                      let count = graph
                          .edges()
                          .iter()
                          .filter(|edge| labels[edge.u()] != labels[edge.v()])
                          .count();
                      timings.push(start.elapsed().as_nanos());
                      surviving = black_box(count);
                  }
                  let fine_edges = graph.edge_count();
                  let internal = fine_edges - surviving;
                  let unique = levels[index + 1].graph().edge_count();
                  let current_bytes = fine_edges.saturating_mul(16);
                  let exact_bytes = surviving.saturating_mul(16);
                  let saved = current_bytes.saturating_sub(exact_bytes);
                  println!(
                      "{{\"case\":\"{case}\",\"scale\":{scale},\"input_vertices\":{},\"input_edges\":{},\"level\":{index},\"fine_vertices\":{},\"coarse_vertices\":{},\"fine_edges\":{fine_edges},\"surviving_edges\":{surviving},\"internal_edges\":{internal},\"unique_coarse_edges\":{unique},\"current_capacity_bytes\":{current_bytes},\"exact_survivor_capacity_bytes\":{exact_bytes},\"potential_saved_bytes\":{saved},\"survival_ratio\":{},\"aggregation_ratio\":{},\"unique_over_surviving\":{},\"median_count_scan_ns\":{}}}",
                      bench.vertices,
                      bench.edges,
                      graph.vertex_count(),
                      aggregation.coarse_dimension(),
                      surviving as f64 / fine_edges.max(1) as f64,
                      aggregation.coarse_dimension() as f64
                          / graph.vertex_count().max(1) as f64,
                      unique as f64 / surviving.max(1) as f64,
                      median(timings),
                  );
              }
          }
          ''')
          manifest.write_text(
              original_manifest
              + '\n\n[[bin]]\nname = "contraction-survival"\n'
              + 'path = "src/bin/contraction-survival.rs"\n'
          )

          try:
              subprocess.run(
                  [
                      'cargo', 'fmt', '--manifest-path', str(manifest), '--all',
                  ],
                  check=True,
              )
              subprocess.run(
                  [
                      'cargo', 'build', '--release', '--manifest-path',
                      str(manifest), '--bin', 'contraction-survival',
                  ],
                  check=True,
              )
              binary = Path('benchmarks/target/release/contraction-survival')
              specs = [
                  ('path', 1_000_000),
                  ('worker-firm', 500_000),
                  ('dense-worker-firm', 100_000),
              ]
              rows = []
              for case, scale in specs:
                  completed = subprocess.run(
                      [str(binary), case, str(scale)],
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      check=True,
                  )
                  print(completed.stdout, end='')
                  rows.extend(
                      json.loads(line)
                      for line in completed.stdout.splitlines()
                      if line.strip().startswith('{')
                  )
              result = {
                  'schema_version': 1,
                  'profile': 'contraction-edge-survival',
                  'edge_bytes': 16,
                  'rows': rows,
                  'total_potential_saved_bytes': sum(
                      row['potential_saved_bytes'] for row in rows
                  ),
                  'maximum_potential_saved_bytes': max(
                      (row['potential_saved_bytes'] for row in rows),
                      default=0,
                  ),
              }
              destination = Path(
                  '.ci/performance/contraction-survival-profile.json'
              )
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(
                  json.dumps(result, indent=2, sort_keys=True) + '\n'
              )
          finally:
              manifest.write_text(original_manifest)
              source_path.unlink(missing_ok=True)
              Path('.github/workflows/profile-contraction-survival.yml').unlink()

      - name: Commit profile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: profile contraction edge survival [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
