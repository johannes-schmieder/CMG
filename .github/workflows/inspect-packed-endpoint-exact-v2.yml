name: Inspect packed endpoint exact-allocation v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-packed-endpoint-exact-v2.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record latest exact-v2 workflow run
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          import json
          import os
          from pathlib import Path
          import urllib.request

          repository = os.environ['REPOSITORY']
          workflow = 'packed-endpoint-key-exact-v2.yml'
          url = (
              f'https://api.github.com/repos/{repository}/actions/workflows/'
              f'{workflow}/runs?branch=main&per_page=10'
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'cmg-ci-status-probe',
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          runs = payload.get('workflow_runs', [])
          latest = runs[0] if runs else None
          keys = (
              'id', 'run_number', 'run_attempt', 'status', 'conclusion',
              'head_sha', 'created_at', 'updated_at', 'html_url',
          )
          result = {
              'schema_version': 1,
              'workflow': workflow,
              'latest': ({key: latest.get(key) for key in keys} if latest else None),
          }
          path = Path('.ci/performance/packed-endpoint-key-exact-v2-run-status.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          Path('.github/workflows/inspect-packed-endpoint-exact-v2.yml').unlink()

      - name: Commit status probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: record packed-key exact-v2 status [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
