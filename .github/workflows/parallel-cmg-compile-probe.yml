name: Parallel CMG compile probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/parallel-cmg-compile-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and qualify candidate without retaining it
        shell: python
        run: |
          import base64
          import gzip
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          result = {
              'schema_version': 1,
              'experiment': 'parallel-cmg-compile-probe',
              'source_sha': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'status': 'not_run',
          }

          def run(command, *, env=None, timeout=4800):
              print('+', ' '.join(command), flush=True)
              completed = subprocess.run(
                  command,
                  cwd=root,
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
              )
              print(completed.stdout, end='')
              if completed.returncode != 0:
                  raise RuntimeError(
                      f"command failed ({completed.returncode}): {' '.join(command)}"
                  )
              return completed

          try:
              payload = Path(
                  'scripts/parallel_cmg_plan.patch.gz.b64'
              ).read_bytes()
              patch = gzip.decompress(base64.b64decode(payload))
              patch_path = Path('/tmp/parallel-cmg-plan.patch')
              patch_path.write_bytes(patch)
              run(['git', 'apply', '--check', str(patch_path)])
              run(['git', 'apply', str(patch_path)])
              run(['cargo', 'fmt', '--all'])
              run(['cargo', 'fmt', '--all', '--', '--check'])
              run([
                  'cargo', 'fmt', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all', '--', '--check',
              ])
              run([
                  'cargo', 'clippy', '--all-targets', '--all-features',
                  '--', '-D', 'warnings',
              ])
              run([
                  'cargo', 'clippy', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all-targets', '--', '-D', 'warnings',
              ])
              doc_env = os.environ.copy()
              doc_env['RUSTDOCFLAGS'] = '-D warnings'
              run([
                  'cargo', 'doc', '--no-deps', '--document-private-items',
                  '--all-features',
              ], env=doc_env)
              run(['cargo', 'test', '--all-targets', '--all-features'])
              run([
                  'cargo', 'build', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all-targets', '--release',
              ])
              smoke = run([
                  'benchmarks/target/release/parallel-cmg-apply',
                  'path', '20000', '1', '2',
              ])
              payloads = [
                  json.loads(line)
                  for line in smoke.stdout.splitlines()
                  if line.strip().startswith('{')
              ]
              if len(payloads) != 1:
                  raise RuntimeError(f'unexpected smoke output: {payloads}')
              result['status'] = 'success'
              result['smoke'] = payloads[0]
          except Exception as error:
              result['status'] = 'failure'
              result['error'] = repr(error)
              print(f'probe failed: {error}', flush=True)

          subprocess.run(
              ['git', 'reset', '--hard', 'HEAD'], cwd=root, check=False
          )
          record = Path('.ci/performance/parallel-cmg-compile-probe.json')
          record.parent.mkdir(parents=True, exist_ok=True)
          record.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          Path('.github/workflows/parallel-cmg-compile-probe.yml').unlink()

          run(['git', 'config', 'user.name', 'github-actions[bot]'])
          run([
              'git', 'config', 'user.email',
              '41898282+github-actions[bot]@users.noreply.github.com',
          ])
          run(['git', 'add', '-A'])
          run(['git', 'commit', '-m', 'ci: record parallel CMG compile probe'])
          run(['git', 'pull', '--rebase', 'origin', 'main'])
          run(['git', 'push', 'origin', 'HEAD:main'])

      - name: Show result
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/parallel-cmg-compile-probe.json || true
