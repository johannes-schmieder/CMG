name: Profile forest aggregation phases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-forest-phases.yml'

permissions:
  contents: write

concurrency:
  group: cmg-forest-phase-profile
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compile, validate, and profile forest phases
        shell: bash
        run: |
          set -euo pipefail
          python scripts/profile_forest_phases.py

      - name: Show profile record
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/forest-phase-profile-latest.json || true
