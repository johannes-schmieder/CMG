name: Dense endpoint-axis compact sort gate v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dense-endpoint-axis-sort-v3.yml'

permissions:
  contents: write

concurrency:
  group: cmg-dense-endpoint-axis-sort-v3
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify direct dense-only endpoint-axis sorting
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dense_endpoint_axis_sort_gate_v3.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/dense-endpoint-axis-sort-latest.json || true
