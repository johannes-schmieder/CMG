name: Repair parallel benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-parallel-bench.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair malformed Rust string literals
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/bin/cmg-parallel-bench.rs')
          text = path.read_text()
          replacements = {
              "parse_usize(next_value(&mut arguments, \"--vertices\")?, 'vertices')?":
                  "parse_usize(next_value(&mut arguments, \"--vertices\")?, \"vertices\")?",
              "parse_usize(next_value(&mut arguments, \"--rhs\")?, 'r')?":
                  "parse_usize(next_value(&mut arguments, \"--rhs\")?, \"rhs\")?",
              "invalid_input('vertices must be at least 2')":
                  "invalid_input(\"vertices must be at least 2\")",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)

      - name: Format and test all features
        shell: bash
        run: |
          cargo fmt --all
          cargo test --all-targets --all-features
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/repair-parallel-bench.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bin/cmg-parallel-bench.rs .github/workflows/repair-parallel-bench.yml
          git commit -m 'fix: repair parallel benchmark parsing'
          git push origin main
