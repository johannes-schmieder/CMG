name: Cached-key contraction profile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-cached-key-contraction.yml'

permissions:
  contents: write

concurrency:
  group: cmg-cached-key-contraction-profile
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Profile cached-key contraction subphases
        shell: bash
        run: |
          set -euo pipefail
          python scripts/profile_cached_key_contraction.py

      - name: Show profile
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/contraction-subphase-profile-cached-key.json || true
