name: Optimize recursive coarse centering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-recursive-centering.yml'
      - 'scripts/recursive_centering_experiment.py'
  workflow_dispatch:

concurrency:
  group: optimize-recursive-centering
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  benchmark-test-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and benchmark current production path
        id: baseline
        shell: bash
        run: |
          set +e
          rm -rf .ci/performance/recursive-centering "$RUNNER_TEMP/recursive-centering-results"
          mkdir -p .ci/performance/recursive-centering "$RUNNER_TEMP/recursive-centering-results"
          {
            CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-centering-baseline-root" \
              cargo build --release --bin cmg-bench &&
            cp "$RUNNER_TEMP/cmg-centering-baseline-root/release/cmg-bench" \
               "$RUNNER_TEMP/cmg-bench-centering-baseline" &&
            CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-centering-baseline-c" \
              cargo build --manifest-path benchmarks/c-kernel/Cargo.toml --release &&
            cp "$RUNNER_TEMP/cmg-centering-baseline-c/release/cmg-c-kernel-bench" \
               "$RUNNER_TEMP/cmg-c-kernel-centering-baseline" || exit $?
            for CASE in path worker-firm; do
              "$RUNNER_TEMP/cmg-bench-centering-baseline" \
                --case "$CASE" --vertices 20000 --rhs 4 --repetitions 5 \
                --output "$RUNNER_TEMP/recursive-centering-results/solve-baseline-${CASE}.json" || exit $?
              "$RUNNER_TEMP/cmg-c-kernel-centering-baseline" \
                --case "$CASE" --vertices 100000 --repetitions 7 \
                --output "$RUNNER_TEMP/recursive-centering-results/cycle-baseline-${CASE}.json" || exit $?
            done
          } > .ci/performance/recursive-centering/baseline.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Apply auditable recursive-centering patch
        id: patch
        if: ${{ steps.baseline.outputs.status == '0' }}
        shell: bash
        run: |
          set +e
          python scripts/recursive_centering_experiment.py \
            > .ci/performance/recursive-centering/patch.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate candidate
        id: validate
        if: ${{ steps.patch.outputs.status == '0' }}
        shell: bash
        run: |
          set +e
          {
            cargo fmt --all &&
            cargo fmt --all -- --check &&
            RUSTFLAGS='-D warnings' cargo check --lib --no-default-features &&
            cargo clippy --all-targets --all-features -- -D warnings &&
            RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --all-features &&
            cargo test --all-targets &&
            cargo test --all-targets --release &&
            cargo test --all-targets --all-features &&
            cargo test --all-targets --all-features --release &&
            cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all &&
            cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all -- --check &&
            cargo clippy --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets -- -D warnings &&
            cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets &&
            cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets --release
          } > .ci/performance/recursive-centering/validation.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build and benchmark candidate
        id: candidate
        if: ${{ steps.validate.outputs.status == '0' }}
        shell: bash
        run: |
          set +e
          {
            CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-centering-candidate-root" \
              cargo build --release --bin cmg-bench &&
            cp "$RUNNER_TEMP/cmg-centering-candidate-root/release/cmg-bench" \
               "$RUNNER_TEMP/cmg-bench-centering-candidate" &&
            CARGO_TARGET_DIR="$RUNNER_TEMP/cmg-centering-candidate-c" \
              cargo build --manifest-path benchmarks/c-kernel/Cargo.toml --release &&
            cp "$RUNNER_TEMP/cmg-centering-candidate-c/release/cmg-c-kernel-bench" \
               "$RUNNER_TEMP/cmg-c-kernel-centering-candidate" || exit $?
            for CASE in path worker-firm; do
              "$RUNNER_TEMP/cmg-bench-centering-candidate" \
                --case "$CASE" --vertices 20000 --rhs 4 --repetitions 5 \
                --output "$RUNNER_TEMP/recursive-centering-results/solve-candidate-${CASE}.json" || exit $?
              "$RUNNER_TEMP/cmg-c-kernel-centering-candidate" \
                --case "$CASE" --vertices 100000 --repetitions 7 \
                --output "$RUNNER_TEMP/recursive-centering-results/cycle-candidate-${CASE}.json" || exit $?
            done
          } > .ci/performance/recursive-centering/candidate.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Evaluate same-run result
        id: evaluate
        if: ${{ steps.candidate.outputs.status == '0' }}
        shell: python
        run: |
          import json
          import math
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'recursive-centering-results'
          cycle_ratios = {}
          solve_ratios = {}
          records = {}
          valid = True
          for case in ('path', 'worker-firm'):
              cycle_baseline = json.loads(
                  (root / f'cycle-baseline-{case}.json').read_text()
              )
              cycle_candidate = json.loads(
                  (root / f'cycle-candidate-{case}.json').read_text()
              )
              solve_baseline = json.loads(
                  (root / f'solve-baseline-{case}.json').read_text()
              )
              solve_candidate = json.loads(
                  (root / f'solve-candidate-{case}.json').read_text()
              )
              records[case] = {
                  'cycle_baseline': cycle_baseline,
                  'cycle_candidate': cycle_candidate,
                  'solve_baseline': solve_baseline,
                  'solve_candidate': solve_candidate,
              }
              cycle_ratios[case] = (
                  cycle_candidate['cycle']['rust_median_ns']
                  / cycle_baseline['cycle']['rust_median_ns']
              )
              solve_ratios[case] = (
                  solve_candidate['solve_per_rhs_median_ns']
                  / solve_baseline['solve_per_rhs_median_ns']
              )
              valid &= (
                  cycle_candidate['cycle']['quotient_max_scaled_error'] <= 5.0e-10
              )
              valid &= solve_candidate['iterations'] == solve_baseline['iterations']
              valid &= all(
                  value == value and value < 1.0e-6
                  for value in solve_candidate['backward_errors']
              )

          cycle_geomean = math.exp(
              sum(math.log(value) for value in cycle_ratios.values())
              / len(cycle_ratios)
          )
          solve_geomean = math.exp(
              sum(math.log(value) for value in solve_ratios.values())
              / len(solve_ratios)
          )
          accepted = (
              valid
              and max(cycle_ratios.values()) <= 1.03
              and cycle_geomean <= 0.98
              and max(solve_ratios.values()) <= 1.03
              and solve_geomean <= 0.995
              and min(solve_ratios.values()) <= 0.985
          )
          evaluation = {
              'valid': valid,
              'accepted': accepted,
              'cycle_ratios': cycle_ratios,
              'cycle_geometric_mean_ratio': cycle_geomean,
              'solve_ratios': solve_ratios,
              'solve_geometric_mean_ratio': solve_geomean,
              'records': records,
          }
          Path('.ci/performance/recursive-centering/evaluation.json').write_text(
              json.dumps(evaluation, indent=2) + '\n'
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('status=0\n')
              output.write(f'accepted={str(accepted).lower()}\n')

      - name: Build retained result or failure record
        if: ${{ always() && !cancelled() }}
        shell: python
        env:
          BASELINE_STATUS: ${{ steps.baseline.outputs.status }}
          PATCH_STATUS: ${{ steps.patch.outputs.status }}
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
          CANDIDATE_STATUS: ${{ steps.candidate.outputs.status }}
          EVALUATION_STATUS: ${{ steps.evaluate.outputs.status }}
          ACCEPTED: ${{ steps.evaluate.outputs.accepted }}
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          directory = Path('.ci/performance/recursive-centering')
          directory.mkdir(parents=True, exist_ok=True)

          def status(name):
              return os.environ.get(name) or 'not-run'

          def tail(name, count=240):
              path = directory / name
              if not path.exists():
                  return []
              return path.read_text(errors='replace').splitlines()[-count:]

          evaluation_path = directory / 'evaluation.json'
          evaluation = (
              json.loads(evaluation_path.read_text())
              if evaluation_path.exists() else None
          )
          statuses = {
              'baseline': status('BASELINE_STATUS'),
              'patch': status('PATCH_STATUS'),
              'validation': status('VALIDATION_STATUS'),
              'candidate': status('CANDIDATE_STATUS'),
              'evaluation': status('EVALUATION_STATUS'),
          }
          completed = all(value == '0' for value in statuses.values())
          accepted = completed and os.environ.get('ACCEPTED') == 'true'
          record = {
              'schema': 2,
              'tested_sha': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'completed': completed,
              'accepted': accepted,
              'outcome': 'accepted' if accepted else (
                  'rejected' if completed else 'failed'
              ),
              'statuses': statuses,
              'evaluation': evaluation,
              'log_tails': {
                  'baseline': tail('baseline.log'),
                  'patch': tail('patch.log'),
                  'validation': tail('validation.log'),
                  'candidate': tail('candidate.log'),
              },
          }
          Path('.ci/performance/recursive-centering-latest.json').write_text(
              json.dumps(record, indent=2) + '\n'
          )

      - name: Commit accepted source, rejection, or diagnostics
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          BASELINE_STATUS: ${{ steps.baseline.outputs.status }}
          PATCH_STATUS: ${{ steps.patch.outputs.status }}
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
          CANDIDATE_STATUS: ${{ steps.candidate.outputs.status }}
          EVALUATION_STATUS: ${{ steps.evaluate.outputs.status }}
          ACCEPTED: ${{ steps.evaluate.outputs.accepted }}
        run: |
          set -euo pipefail
          COMPLETED=false
          if [ "$BASELINE_STATUS" = 0 ] && [ "$PATCH_STATUS" = 0 ] && \
             [ "$VALIDATION_STATUS" = 0 ] && [ "$CANDIDATE_STATUS" = 0 ] && \
             [ "$EVALUATION_STATUS" = 0 ]; then
            COMPLETED=true
          fi

          rm -rf target benchmarks/c-kernel/target
          rm -f benchmarks/c-kernel/Cargo.lock
          if [ "$COMPLETED" != true ] || [ "$ACCEPTED" != true ]; then
            git restore src/preconditioner.rs tests/upstream_cycle.rs
          fi
          if [ "$COMPLETED" = true ]; then
            rm .github/workflows/optimize-recursive-centering.yml
            rm scripts/recursive_centering_experiment.py
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if [ "$COMPLETED" = true ] && [ "$ACCEPTED" = true ]; then
            MESSAGE='perf: center recursive coarse residuals'
          elif [ "$COMPLETED" = true ]; then
            MESSAGE='perf: record rejected recursive-centering experiment'
          else
            MESSAGE='ci: record recursive-centering experiment failure [skip ci]'
          fi
          git commit -m "$MESSAGE"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce successful completion
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          BASELINE_STATUS: ${{ steps.baseline.outputs.status }}
          PATCH_STATUS: ${{ steps.patch.outputs.status }}
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
          CANDIDATE_STATUS: ${{ steps.candidate.outputs.status }}
          EVALUATION_STATUS: ${{ steps.evaluate.outputs.status }}
        run: |
          test "$BASELINE_STATUS" = 0
          test "$PATCH_STATUS" = 0
          test "$VALIDATION_STATUS" = 0
          test "$CANDIDATE_STATUS" = 0
          test "$EVALUATION_STATUS" = 0
