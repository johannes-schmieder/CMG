name: Rust CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.ci/**'
  pull_request:
    branches: [main]

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    name: quality / ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Debug tests (serial)
        run: cargo test --all-targets --verbose

      - name: Debug tests (all features)
        run: cargo test --all-targets --all-features --verbose

      - name: Release tests (all features)
        run: cargo test --all-targets --all-features --release --verbose

      - name: Release build (all features)
        run: cargo build --all-features --release --verbose

  report:
    name: report checkpoint
    if: ${{ always() && github.event_name == 'push' }}
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Write status
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          mkdir -p .ci
          cat > .ci/latest.json <<JSON
          {
            "tested_sha": "${TESTED_SHA}",
            "run_id": "${RUN_ID}",
            "run_attempt": "${RUN_ATTEMPT}",
            "quality": "${QUALITY_RESULT}",
            "cross_platform_tests": "${TEST_RESULT}",
            "platforms": ["ubuntu-latest", "macos-latest", "windows-latest"],
            "rustc": "$(rustc --version)",
            "cargo": "$(cargo --version)"
          }
          JSON

      - name: Commit status
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'ci: record checkpoint status [skip ci]'
          git push origin HEAD:main
