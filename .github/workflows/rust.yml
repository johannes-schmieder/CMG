name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Test
        run: cargo test --verbose

      - name: Release build
        run: cargo build --release --verbose

  report-smoke-success:
    name: Record smoke-test success
    needs: test
    runs-on: ubuntu-latest
    if: ${{ success() && github.event_name == 'push' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Write success marker
        shell: bash
        run: |
          {
            echo 'status=success'
            echo 'platforms=ubuntu-latest,macos-latest,windows-latest'
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
          } > .ci-smoke-result.txt

      - name: Commit success marker
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-smoke-result.txt
          git commit -m 'ci: record Rust smoke success [skip ci]'
          git push origin HEAD:main
