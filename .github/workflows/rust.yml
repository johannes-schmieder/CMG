name: Rust CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '.ci/**'
  pull_request:
    branches: [main]

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality / ubuntu
    runs-on: ubuntu-latest
    env:
      CMG_BENCH_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.git' -czf /tmp/cmg-current-source.tar.gz .
          git archive --format=tar --output=/tmp/cmg-identity-source.tar "$CMG_BENCH_COMMIT"
          echo "CMG_BENCH_ARCHIVE_SHA256=$(sha256sum /tmp/cmg-identity-source.tar | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cmg-source-${{ github.sha }}
          path: /tmp/cmg-current-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Release metadata
        run: python3 scripts/check_release_metadata.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Benchmark format
        run: cargo fmt --manifest-path benchmarks/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Benchmark Clippy
        run: cargo clippy --manifest-path benchmarks/Cargo.toml --all-targets -- -D warnings

      - name: Benchmark release build
        run: cargo build --manifest-path benchmarks/Cargo.toml --all-targets --release

      - name: Reject unknown compiled benchmark identity
        shell: bash
        run: |
          set -euo pipefail
          benchmarks/target/release/scc2-diagnostics identity /tmp/scc2-identity.json
          python3 - <<'PY'
          import json
          import os
          value = json.load(open('/tmp/scc2-identity.json'))
          assert value['source_commit'] == os.environ['CMG_BENCH_COMMIT']
          assert value['source_archive_sha256'] == os.environ['CMG_BENCH_ARCHIVE_SHA256']
          assert value['protocol_version'] == 'cmg-scc2-v1'
          assert 'unknown' not in value.values()
          PY

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --all-features

  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Debug tests (serial)
        run: cargo test --all-targets --verbose

      - name: Debug tests (all features)
        run: cargo test --all-targets --all-features --verbose

      - name: Release tests (all features)
        run: cargo test --all-targets --all-features --release --verbose

      - name: Release build (all features)
        run: cargo build --all-features --release --verbose
