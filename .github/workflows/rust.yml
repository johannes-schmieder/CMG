name: Rust CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.ci/**'
  pull_request:
    branches: [main]

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    name: quality / ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive source snapshot
        shell: bash
        run: tar --exclude='.git' -czf /tmp/cmg-current-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cmg-source-${{ github.sha }}
          path: /tmp/cmg-current-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Benchmark format
        run: cargo fmt --manifest-path benchmarks/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Benchmark Clippy
        run: cargo clippy --manifest-path benchmarks/Cargo.toml --all-targets -- -D warnings

      - name: Benchmark release build
        run: cargo build --manifest-path benchmarks/Cargo.toml --all-targets --release

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --all-features

  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Debug tests (serial)
        run: cargo test --all-targets --verbose

      - name: Debug tests (all features)
        run: cargo test --all-targets --all-features --verbose

      - name: Release tests (all features)
        run: cargo test --all-targets --all-features --release --verbose

      - name: Release build (all features)
        run: cargo build --all-features --release --verbose

  refine_performance:
    name: refine performance crossover matrix
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'stage crossover matrix patch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Expand full-PCG crossover cases
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/performance.yml')
          text = path.read_text()
          old = '''          specs = [
              ('path-250k', ['path', 250000, 3, 4]),
              ('worker-firm-300k', ['worker-firm', 100000, 3, 4]),
              ('worker-firm-600k', ['worker-firm', 200000, 3, 4]),
              ('dense-worker-firm-800k', ['dense-worker-firm', 50000, 3, 4]),
              ('dense-worker-firm-1.6m', ['dense-worker-firm', 100000, 3, 4]),
          ]'''
          new = '''          specs = [
              ('path-250k', ['path', 250000, 3, 4]),
              ('worker-firm-300k', ['worker-firm', 100000, 3, 4]),
              ('worker-firm-375k', ['worker-firm', 125000, 3, 4]),
              ('worker-firm-450k', ['worker-firm', 150000, 3, 4]),
              ('worker-firm-525k', ['worker-firm', 175000, 3, 4]),
              ('worker-firm-600k', ['worker-firm', 200000, 3, 4]),
              ('dense-worker-firm-400k', ['dense-worker-firm', 25000, 3, 4]),
              ('dense-worker-firm-600k', ['dense-worker-firm', 37500, 3, 4]),
              ('dense-worker-firm-800k', ['dense-worker-firm', 50000, 3, 4]),
              ('dense-worker-firm-1.6m', ['dense-worker-firm', 100000, 3, 4]),
          ]'''
          if old not in text:
              raise SystemExit('full-PCG specs block not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/refine-full-pcg-matrix.yml').unlink(missing_ok=True)

      - name: Commit matrix expansion safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: expand full PCG crossover matrix'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

  report:
    name: report checkpoint
    if: ${{ always() && github.event_name == 'push' }}
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare tested status
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          cat > /tmp/cmg-latest.json <<JSON
          {
            "tested_sha": "${TESTED_SHA}",
            "run_id": "${RUN_ID}",
            "run_attempt": "${RUN_ATTEMPT}",
            "quality": "${QUALITY_RESULT}",
            "cross_platform_tests": "${TEST_RESULT}",
            "platforms": ["ubuntu-latest", "macos-latest", "windows-latest"],
            "rustc": "$(rustc --version)",
            "cargo": "$(cargo --version)"
          }
          JSON

      - name: Commit status from latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .ci
            cp /tmp/cmg-latest.json .ci/latest.json
            git add .ci/latest.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'ci: record checkpoint status [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "status push raced on attempt ${attempt}; retrying from latest main"
          done

          echo 'failed to publish checkpoint status after four attempts' >&2
          exit 1
