name: Format hierarchy profiler diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-hierarchy-profiler.yml'
      - 'benchmarks/src/bin/hierarchy-phase-profile.rs'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Format and capture benchmark Clippy
        shell: bash
        run: |
          set -u
          mkdir -p .ci/performance
          cargo fmt --all
          cargo fmt --manifest-path benchmarks/Cargo.toml --all
          set +e
          cargo clippy --manifest-path benchmarks/Cargo.toml --all-targets -- -D warnings \
            > .ci/performance/hierarchy-phase-clippy.log 2>&1
          status=$?
          set -e
          printf '{\n  "schema_version": 1,\n  "status": %q,\n  "exit_code": %d\n}\n' \
            "$([ "$status" -eq 0 ] && echo '"success"' || echo '"failure"')" \
            "$status" > .ci/performance/hierarchy-phase-clippy.json
          rm -f .github/workflows/format-hierarchy-profiler.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'dev: format hierarchy profiler and record Clippy diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Show diagnostic
        if: always()
        shell: bash
        run: |
          git show origin/main:.ci/performance/hierarchy-phase-clippy.log || true
