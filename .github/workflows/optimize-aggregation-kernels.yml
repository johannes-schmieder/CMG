name: Record rejected aggregation experiment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-aggregation-kernels.yml'

permissions:
  contents: write

jobs:
  record-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record decision and update live plan
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path

          tested_sha = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          record = {
              'schema': 1,
              'tested_sha': tested_sha,
              'accepted': False,
              'experiment': 'unchecked validated aggregation label loops',
              'reason': (
                  'Rejected before timing: implementing the candidate required '
                  'raw-pointer unsafe blocks, while the production crate '
                  'deliberately enforces #![forbid(unsafe_code)].'
              ),
              'failed_run_id': 32592202913,
              'production_changed': False,
          }
          output = Path('.ci/performance/aggregation-kernel-latest.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(record, indent=2) + '\n')

          plan = Path('PERFORMANCE_PLAN.md')
          text = plan.read_text()
          anchor = (
              '- C-result retention now rejects cancelled or superseded workflow '
              'runs so stale evidence cannot replace results from newer benchmark source.\n'
          )
          addition = (
              '- A raw-pointer candidate for removing aggregation label bounds '
              'checks was rejected before timing because the production crate '
              'forbids unsafe code; the validated safe loops remain in place.\n'
          )
          if addition not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('performance-plan aggregation anchor changed')
              text = text.replace(anchor, anchor + addition, 1)
          old_next = (
              'Extend the pinned-C harness to the complete stationary recursive '
              'preconditioner application. In parallel, audit the single-RHS '
              'PCG/CMG call graph for low-risk deterministic within-solve kernels. '
              'Begin with compact or grouped projection metadata, vector updates, '
              'component operations, and fixed-chunk reductions; benchmark each '
              'addition against the frozen baseline before deciding whether to '
              'retain the extra hierarchy memory. Large 8–32-thread qualification '
              'remains dependent on a larger or self-hosted runner.\n'
          )
          new_next = (
              'Repair and complete the pinned-C stationary recursive-cycle '
              'benchmark, then benchmark the six-vector PCG workspace against the '
              'frozen baseline. Continue the single-RHS PCG/CMG audit only with '
              'safe deterministic kernels. Large 8–32-thread qualification remains '
              'dependent on a larger or self-hosted runner.\n'
          )
          if old_next in text:
              text = text.replace(old_next, new_next, 1)
          plan.write_text(text)

      - name: Validate unchanged production tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo check --lib --no-default-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          cargo test --all-targets --all-features --release

      - name: Commit retained rejection record
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/optimize-aggregation-kernels.yml
          rm -rf target benchmarks/c-kernel/target
          rm -f benchmarks/c-kernel/Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: retain safe aggregation kernels'
          git pull --rebase origin main
          git push origin HEAD:main
