name: Fix hierarchy profiler format arguments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hierarchy-profiler-args.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch named format arguments
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path('benchmarks/src/bin/hierarchy-phase-profile.rs')
          text = path.read_text()
          marker = '        vertices = bench_graph.vertices,\n'
          if marker not in text:
              raise SystemExit('println argument marker missing')
          arguments = '''        case = case,
          scale = scale,
          repetitions = repetitions,
          hierarchy_median_ns = hierarchy_median_ns,
          preconditioner_median_ns = preconditioner_median_ns,
          finalization_estimate = finalization_estimate,
          terminal_json = terminal_json,
          manual_total_ns = manual_total_ns,
          attributed_ns = attributed_ns,
          attributed_share = attributed_share,
          hierarchy_over_manual = hierarchy_over_manual,
          dominant_phase = dominant_phase,
          dominant_share = dominant_share,
          phase_json = phase_json,
          '''
          if '        case = case,\n' not in text:
              text = text.replace(marker, arguments + marker, 1)
          path.write_text(text)

          subprocess.run(['cargo', 'fmt', '--all'], check=True)
          subprocess.run([
              'cargo', 'fmt', '--manifest-path', 'benchmarks/Cargo.toml',
              '--all',
          ], check=True)
          subprocess.run([
              'cargo', 'clippy', '--manifest-path', 'benchmarks/Cargo.toml',
              '--all-targets', '--', '-D', 'warnings',
          ], check=True)

          Path('.github/workflows/fix-hierarchy-profiler-args.yml').unlink()
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run([
              'git', 'config', 'user.email',
              '41898282+github-actions[bot]@users.noreply.github.com',
          ], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run([
              'git', 'commit', '-m',
              'fix: provide hierarchy profiler format arguments',
          ], check=True)
          subprocess.run(['git', 'pull', '--rebase', 'origin', 'main'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
