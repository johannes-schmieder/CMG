name: Analyze compact hierarchy indices

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-compact-hierarchy-indices.yml'
      - '.ci/performance/parallel-pcg-vector-updates-latest.json'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Analyze retained native-width index vectors
        run: python scripts/analyze_compact_hierarchy_indices.py

      - name: Commit analysis checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'perf: analyze compact hierarchy indices'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
