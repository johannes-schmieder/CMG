name: Consolidate optimization chain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-optimization-chain.yml'
      - '.ci/performance/compact-hierarchy-index-analysis.json'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Consolidate resolved optimization records
        run: python scripts/consolidate_optimization_chain.py

      - name: Commit recovery checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'perf: consolidate post-reduction optimization checkpoint'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
