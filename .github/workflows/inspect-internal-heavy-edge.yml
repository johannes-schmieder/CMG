name: Inspect internal heavy-edge gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-internal-heavy-edge.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record latest gate run
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          import json
          import os
          from pathlib import Path
          import urllib.request

          workflow = 'internal-serial-heavy-edge.yml'
          url = (
              f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}"
              f"/actions/workflows/{workflow}/runs?per_page=5"
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          keys = (
              'id', 'status', 'conclusion', 'head_sha', 'created_at',
              'updated_at', 'run_attempt', 'html_url',
          )
          runs = [{key: run.get(key) for key in keys} for run in payload.get('workflow_runs', [])]
          destination = Path('.ci/performance/internal-heavy-edge-run-status.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(
              json.dumps({'schema_version': 1, 'workflow': workflow, 'runs': runs}, indent=2, sort_keys=True) + '\n'
          )
          Path('.github/workflows/inspect-internal-heavy-edge.yml').unlink()

      - name: Commit status record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: record internal heavy-edge gate status'
          git pull --rebase origin main
          git push origin HEAD:main
