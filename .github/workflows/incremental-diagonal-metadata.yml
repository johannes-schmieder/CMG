name: Incremental diagonal-metadata gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/incremental-diagonal-metadata.yml'

permissions:
  contents: write

concurrency:
  group: cmg-incremental-diagonal-metadata
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify incremental diagonal metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/incremental_diagonal_metadata_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/incremental-diagonal-metadata-latest.json || true
