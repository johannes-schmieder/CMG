name: Monitor cumulative performance refresh v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor-cumulative-performance-v2.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: cmg-cumulative-performance-v2-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for benchmark and preserve result or logs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/monitor_cumulative_performance_v2.py

      - name: Show benchmark status
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/cumulative-v2-run-status.json || true
          git show origin/main:.ci/performance/cumulative-latest.json || true
