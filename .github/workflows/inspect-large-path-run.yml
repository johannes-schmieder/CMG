name: Inspect large-path confirmation run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-large-path-run.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Query workflow status
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          import json
          import os
          from pathlib import Path
          import urllib.request

          repository = os.environ['REPOSITORY']
          workflow = 'bounded-prefix-large-path-confirmation-v2.yml'
          url = (
              f'https://api.github.com/repos/{repository}/actions/workflows/'
              f'{workflow}/runs?per_page=10'
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          result = {
              'schema_version': 1,
              'workflow': workflow,
              'runs': [
                  {
                      'id': run['id'],
                      'head_sha': run['head_sha'],
                      'status': run['status'],
                      'conclusion': run['conclusion'],
                      'created_at': run['created_at'],
                      'updated_at': run['updated_at'],
                      'html_url': run['html_url'],
                      'run_attempt': run['run_attempt'],
                  }
                  for run in payload.get('workflow_runs', [])
              ],
          }
          destination = Path('.ci/performance/large-path-run-status.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          Path('.github/workflows/inspect-large-path-run.yml').unlink()

      - name: Commit status checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: record large-path confirmation status'
          git pull --rebase origin main
          git push origin HEAD:main
