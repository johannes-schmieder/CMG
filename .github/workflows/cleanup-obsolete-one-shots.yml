name: Clean completed one-shot automation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-obsolete-one-shots.yml'
      - 'scripts/cleanup_obsolete_one_shots.py'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Explicit rerun after workflow creation.
      - name: Remove completed one-shot machinery and refresh recovery state
        run: python scripts/cleanup_obsolete_one_shots.py

      - name: Commit cleanup checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove completed one-shot automation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
