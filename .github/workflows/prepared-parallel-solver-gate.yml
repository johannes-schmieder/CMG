name: Prepared parallel PCG solver gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepared-parallel-solver-gate.yml'
      - 'scripts/prepared_parallel_solver_gate.py'
      - 'scripts/add_prepared_parallel_solver.py'

permissions:
  contents: write

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify prepared memory-aware parallel PCG solver
        run: python scripts/prepared_parallel_solver_gate.py

      - name: Show result
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/prepared-parallel-solver-latest.json || true
