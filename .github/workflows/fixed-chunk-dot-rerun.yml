name: Rerun deterministic fixed chunk dot gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fixed-chunk-dot-rerun.yml'
      - 'scripts/fixed_chunk_dot_rerun.py'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and benchmark rebased candidate
        run: python scripts/fixed_chunk_dot_rerun.py

      - name: Commit decision checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          if ! git diff --cached --quiet -- src/pcg.rs; then
            message='perf: add deterministic fixed-chunk dot products'
          else
            message='perf: record rebased fixed-chunk dot experiment'
          fi
          git commit -m "$message"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
