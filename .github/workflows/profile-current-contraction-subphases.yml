name: Current contraction subphase profile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-current-contraction-subphases.yml'

permissions:
  contents: write

concurrency:
  group: cmg-current-contraction-subphase-profile
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Profile current production contraction
        shell: bash
        run: |
          set -euo pipefail
          python scripts/profile_current_contraction_subphases.py

      - name: Show profile
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/contraction-subphase-profile-current.json || true
