name: Finalize PCG phase benchmark formatting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pcg-phase-benchmark.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Format and qualify benchmark crate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path benchmarks/Cargo.toml --all
          cargo fmt --all -- --check
          cargo fmt --manifest-path benchmarks/Cargo.toml --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path benchmarks/Cargo.toml --all-targets -- -D warnings
          cargo test --all-targets --all-features
          cargo test --all-targets --all-features --release
          cargo build --manifest-path benchmarks/Cargo.toml --bin pcg-phase-profile --release

      - name: Commit formatted checkpoint and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-pcg-phase-benchmark.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: finalize qualified PCG phase benchmark'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
