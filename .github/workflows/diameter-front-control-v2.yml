name: Adaptive diameter-front control gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diameter-front-control-v2.yml'

permissions:
  contents: write

concurrency:
  group: cmg-diameter-front-control-v2
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify branch-free diameter-front control
        shell: bash
        run: |
          set -euo pipefail
          python scripts/diameter_front_control_gate_v2.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/diameter-front-control-latest.json || true
