name: Trusted compact contraction gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trusted-compact-contraction.yml'

permissions:
  contents: write

concurrency:
  group: cmg-trusted-compact-contraction
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify trusted private compact contraction mapping
        shell: bash
        run: |
          set -euo pipefail
          python scripts/trusted_compact_contraction_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/trusted-compact-contraction-latest.json || true
