name: Recomputed forest ancestor-prefix gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recompute-forest-ancestor-prefix.yml'

permissions:
  contents: write

concurrency:
  group: cmg-recompute-forest-ancestor-prefix
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify recomputed forest ancestor prefixes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/recompute_forest_ancestor_prefix_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/recompute-forest-ancestor-prefix-latest.json || true
