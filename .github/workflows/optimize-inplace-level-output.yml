name: Optimize in-place hierarchy level output

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-inplace-level-output.yml'

concurrency:
  group: optimize-inplace-level-output
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  benchmark-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and benchmark baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inplace-results"
          CARGO_TARGET_DIR="$RUNNER_TEMP/inplace-baseline-root" \
            cargo build --release --bin cmg-bench
          CARGO_TARGET_DIR="$RUNNER_TEMP/inplace-baseline-c" \
            cargo build --manifest-path benchmarks/c-kernel/Cargo.toml --release
          for CASE in path worker-firm; do
            "$RUNNER_TEMP/inplace-baseline-root/release/cmg-bench" \
              --case "$CASE" --vertices 20000 --rhs 4 --repetitions 5 \
              --output "$RUNNER_TEMP/inplace-results/solve-baseline-${CASE}.json"
            "$RUNNER_TEMP/inplace-baseline-c/release/cmg-c-kernel-bench" \
              --case "$CASE" --vertices 100000 --repetitions 7 \
              --output "$RUNNER_TEMP/inplace-results/cycle-baseline-${CASE}.json"
          done

      - name: Apply in-place output candidate
        shell: bash
        run: python scripts/inplace_level_output_experiment.py

      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo check --lib --no-default-features
          cargo clippy --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --all-features
          cargo test --all-targets
          cargo test --all-targets --release
          cargo test --all-targets --all-features
          cargo test --all-targets --all-features --release
          cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all -- --check
          cargo clippy --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets --release

      - name: Build and benchmark candidate
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/inplace-candidate-root" \
            cargo build --release --bin cmg-bench
          CARGO_TARGET_DIR="$RUNNER_TEMP/inplace-candidate-c" \
            cargo build --manifest-path benchmarks/c-kernel/Cargo.toml --release
          for CASE in path worker-firm; do
            "$RUNNER_TEMP/inplace-candidate-root/release/cmg-bench" \
              --case "$CASE" --vertices 20000 --rhs 4 --repetitions 5 \
              --output "$RUNNER_TEMP/inplace-results/solve-candidate-${CASE}.json"
            "$RUNNER_TEMP/inplace-candidate-c/release/cmg-c-kernel-bench" \
              --case "$CASE" --vertices 100000 --repetitions 7 \
              --output "$RUNNER_TEMP/inplace-results/cycle-candidate-${CASE}.json"
          done

      - name: Evaluate same-run result
        id: evaluate
        env:
          CMG_EXPERIMENT_RESULTS: ${{ runner.temp }}/inplace-results
        run: python scripts/evaluate_inplace_level_output.py

      - name: Commit accepted optimization or rejection record
        env:
          ACCEPTED: ${{ steps.evaluate.outputs.accepted }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/optimize-inplace-level-output.yml
          rm scripts/inplace_level_output_experiment.py
          rm scripts/evaluate_inplace_level_output.py
          rm -rf target benchmarks/c-kernel/target
          rm -f benchmarks/c-kernel/Cargo.lock
          if [ "$ACCEPTED" != true ]; then
            git restore src/workspace.rs src/preconditioner.rs PERFORMANCE_PLAN.md
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if [ "$ACCEPTED" = true ]; then
            git commit -m 'perf: apply hierarchy levels directly into caller output'
          else
            git commit -m 'perf: record rejected in-place hierarchy output experiment'
          fi
          git pull --rebase origin main
          git push origin HEAD:main
