name: Inspect routed radix gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-radix-gate.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record workflow-run state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import urllib.request

          url = (
              f"{os.environ['GH_API']}/repos/{os.environ['GH_REPOSITORY']}"
              '/actions/workflows/radix-endpoint-sort-gate.yml/runs?per_page=20'
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.load(response)
          runs = [
              {
                  'id': run['id'],
                  'head_sha': run['head_sha'],
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'created_at': run['created_at'],
                  'updated_at': run['updated_at'],
                  'run_started_at': run['run_started_at'],
                  'html_url': run['html_url'],
                  'run_attempt': run['run_attempt'],
              }
              for run in payload.get('workflow_runs', [])
          ]
          destination = Path('.ci/performance/radix-gate-run-state.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps({'runs': runs}, indent=2) + '\n')

      - name: Commit diagnostic and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/inspect-radix-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: record routed radix gate state'
          git pull --rebase origin main
          git push origin HEAD:main
