name: Owned forest-split gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owned-forest-split.yml'

permissions:
  contents: write

concurrency:
  group: cmg-owned-forest-split
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify owned trusted forest splitting
        shell: bash
        run: |
          set -euo pipefail
          python scripts/owned_forest_split_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/owned-forest-split-latest.json || true
