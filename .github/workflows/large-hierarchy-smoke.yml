name: Large hierarchy smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/large-hierarchy-smoke.yml'

permissions:
  contents: write

jobs:
  large-graphs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build hierarchy benchmark
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path benchmarks/Cargo.toml --bin hierarchy-build

      - name: Run large graph cases
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import subprocess

          binary = Path('benchmarks/target/release/hierarchy-build')
          if not binary.exists():
              binary = Path('target/release/hierarchy-build')
          cases = [
              ('worker-firm', 1_000_000, 1),
              ('dense-worker-firm', 200_000, 1),
          ]
          observations = []
          for case, scale, repetitions in cases:
              time_path = Path(f'/tmp/large-{case}.time')
              command = [
                  '/usr/bin/time', '-v', '-o', str(time_path),
                  str(binary), case, str(scale), str(repetitions),
              ]
              print('+', ' '.join(command), flush=True)
              completed = subprocess.run(
                  command,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=True,
              )
              print(completed.stdout, end='')
              payloads = [
                  json.loads(line)
                  for line in completed.stdout.splitlines()
                  if line.strip().startswith('{')
              ]
              if len(payloads) != 1:
                  raise SystemExit(f'unexpected output for {case}: {payloads}')
              timing = time_path.read_text()
              rss = re.search(
                  r'Maximum resident set size \(kbytes\):\s*(\d+)', timing
              )
              elapsed = re.search(
                  r'Elapsed \(wall clock\) time \(h:mm:ss or m:ss\):\s*(.+)',
                  timing,
              )
              payload = payloads[0]
              payload['peak_rss_kib'] = int(rss.group(1)) if rss else None
              payload['process_elapsed'] = elapsed.group(1).strip() if elapsed else None
              observations.append(payload)

          commit = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          result = {
              'schema_version': 1,
              'benchmark': 'large-hierarchy-smoke',
              'commit': commit,
              'runner': {
                  'platform': platform.platform(),
                  'logical_cpus': os.cpu_count(),
              },
              'cases': observations,
          }
          destination = Path('.ci/performance/large-hierarchy-smoke.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')

      - name: Update live plan and remove one-shot workflow
        shell: python
        run: |
          import json
          from pathlib import Path

          result = json.loads(
              Path('.ci/performance/large-hierarchy-smoke.json').read_text()
          )
          rows = []
          for case in result['cases']:
              rows.append(
                  f"| {case['case']} | {case['vertices']:,} | {case['edges']:,} | "
                  f"{case['median_ns'] / 1e9:.3f} | "
                  f"{case['peak_rss_kib'] / 1024:.1f} |"
              )
          checkpoint = '''### Large hierarchy smoke checkpoint — 2026-08-22

| Case | Vertices | Edges | Median build (s) | Peak RSS (MiB) |
|---|---:|---:|---:|---:|
''' + '\n'.join(rows) + '''

- These are current-code qualification runs on a standard hosted runner, not
  32-core scaling claims.
- Machine-readable evidence: `.ci/performance/large-hierarchy-smoke.json`.

'''
          path = Path('PERFORMANCE_PLAN.md')
          text = path.read_text()
          marker = '## Current next action\n'
          if marker not in text:
              raise SystemExit('current-next-action heading missing')
          if '### Large hierarchy smoke checkpoint — 2026-08-22' not in text:
              text = text.replace(marker, checkpoint + marker, 1)
          path.write_text(text)
          Path('.github/workflows/large-hierarchy-smoke.yml').unlink()

      - name: Commit large-scale checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'bench: record large hierarchy smoke'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Show result
        if: always()
        shell: bash
        run: cat .ci/performance/large-hierarchy-smoke.json || true
