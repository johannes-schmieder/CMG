name: Gate single-component centering fast path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/single-component-centering.yml'
      - 'scripts/single_component_centering_gate.py'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and benchmark candidate
        run: python scripts/single_component_centering_gate.py

      - name: Commit decision checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          if git diff --cached -- src/components.rs | grep -q '^+'; then
            message='perf: optimize single-component centering'
          else
            message='perf: record single-component centering experiment'
          fi
          git commit -m "$message"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
