name: Parallel CMG routing probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/parallel-cmg-routing-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compile, test, and benchmark refined candidate
        shell: python
        run: |
          import base64
          import gzip
          import json
          import math
          import os
          from pathlib import Path
          import statistics
          import subprocess

          root = Path.cwd()
          result = {
              'schema_version': 1,
              'experiment': 'parallel-cmg-routing-probe',
              'source_sha': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'status': 'not_run',
              'cases': {},
          }

          def run(command, *, env=None, timeout=7000):
              print('+', ' '.join(command), flush=True)
              completed = subprocess.run(
                  command,
                  cwd=root,
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
              )
              print(completed.stdout, end='')
              if completed.returncode != 0:
                  raise RuntimeError(
                      f"command failed ({completed.returncode}): {' '.join(command)}"
                  )
              return completed

          def apply_payload(source, destination):
              patch = gzip.decompress(base64.b64decode(Path(source).read_bytes()))
              path = Path(destination)
              path.write_bytes(patch)
              run(['git', 'apply', '--check', str(path)])
              run(['git', 'apply', str(path)])

          def sample(binary, arguments, tag):
              time_path = Path(f'/tmp/cmg-routing-{tag}.time')
              completed = run([
                  '/usr/bin/time', '-v', '-o', str(time_path),
                  str(binary), *[str(value) for value in arguments],
              ])
              payloads = [
                  json.loads(line)
                  for line in completed.stdout.splitlines()
                  if line.strip().startswith('{')
              ]
              if len(payloads) != 1:
                  raise RuntimeError(f'unexpected output: {payloads}')
              peak = next(
                  line for line in time_path.read_text().splitlines()
                  if 'Maximum resident set size (kbytes):' in line
              )
              payloads[0]['peak_rss_kib'] = int(peak.rsplit(':', 1)[1].strip())
              return payloads[0]

          try:
              apply_payload(
                  'scripts/parallel_cmg_plan.patch.gz.b64',
                  '/tmp/parallel-cmg-plan.patch',
              )
              apply_payload(
                  'scripts/parallel_cmg_routing.patch.gz.b64',
                  '/tmp/parallel-cmg-routing.patch',
              )
              run(['cargo', 'fmt', '--all'])
              run([
                  'cargo', 'fmt', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all',
              ])
              run(['cargo', 'fmt', '--all', '--', '--check'])
              run([
                  'cargo', 'fmt', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all', '--', '--check',
              ])
              run([
                  'cargo', 'clippy', '--all-targets', '--all-features',
                  '--', '-D', 'warnings',
              ])
              run([
                  'cargo', 'clippy', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all-targets', '--', '-D', 'warnings',
              ])
              doc_env = os.environ.copy()
              doc_env['RUSTDOCFLAGS'] = '-D warnings'
              run([
                  'cargo', 'doc', '--no-deps', '--document-private-items',
                  '--all-features',
              ], env=doc_env)
              run(['cargo', 'test', '--all-targets', '--all-features'])
              run(['cargo', 'test', '--all-targets', '--all-features', '--release'])
              run([
                  'cargo', 'build', '--manifest-path', 'benchmarks/Cargo.toml',
                  '--all-targets', '--release',
              ])

              binary = Path('benchmarks/target/release/parallel-cmg-apply')
              specs = [
                  ('path-250k', ['path', 250000, 5, 4]),
                  ('worker-firm-300k', ['worker-firm', 100000, 5, 4]),
                  ('dense-worker-firm-800k', ['dense-worker-firm', 50000, 5, 4]),
                  ('worker-firm-600k', ['worker-firm', 200000, 3, 4]),
              ]
              speedups = []
              for name, arguments in specs:
                  observations = [sample(binary, arguments, f'{name}-{i}') for i in range(2)]
                  stable = (
                      'case', 'scale', 'vertices', 'edges', 'levels', 'threads',
                      'operators', 'loops', 'max_scaled_difference',
                      'plan_bytes', 'workspace_bytes',
                  )
                  for key in stable:
                      if observations[0][key] != observations[1][key]:
                          raise RuntimeError(f'{name} unstable key {key}')
                  serial = statistics.median(item['serial_median_ns'] for item in observations)
                  parallel = statistics.median(item['parallel_median_ns'] for item in observations)
                  case = {key: observations[0][key] for key in stable}
                  case.update({
                      'serial_median_ns': serial,
                      'parallel_median_ns': parallel,
                      'speedup': serial / parallel,
                      'peak_rss_kib': max(item['peak_rss_kib'] for item in observations),
                  })
                  result['cases'][name] = case
                  speedups.append(case['speedup'])
              result['geometric_speedup'] = math.exp(
                  sum(math.log(value) for value in speedups) / len(speedups)
              )
              result['minimum_speedup'] = min(speedups)
              result['maximum_scaled_difference'] = max(
                  case['max_scaled_difference'] for case in result['cases'].values()
              )
              result['status'] = 'success'
          except Exception as error:
              result['status'] = 'failure'
              result['error'] = repr(error)
              print(f'routing probe failed: {error}', flush=True)

          subprocess.run(['git', 'reset', '--hard', 'HEAD'], cwd=root, check=False)
          subprocess.run(['git', 'clean', '-fd'], cwd=root, check=False)
          record = Path('.ci/performance/parallel-cmg-routing-probe.json')
          record.parent.mkdir(parents=True, exist_ok=True)
          record.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          Path('.github/workflows/parallel-cmg-routing-probe.yml').unlink()

          run(['git', 'config', 'user.name', 'github-actions[bot]'])
          run([
              'git', 'config', 'user.email',
              '41898282+github-actions[bot]@users.noreply.github.com',
          ])
          run(['git', 'add', '-A'])
          run(['git', 'commit', '-m', 'perf: record parallel CMG routing probe'])
          run(['git', 'pull', '--rebase', 'origin', 'main'])
          run(['git', 'push', 'origin', 'HEAD:main'])

      - name: Show result
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/parallel-cmg-routing-probe.json || true
