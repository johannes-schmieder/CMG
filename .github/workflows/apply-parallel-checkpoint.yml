name: Apply parallel checkpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-parallel-checkpoint.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply checkpoint
        run: python3 scripts/apply_parallel_checkpoint.py

      - name: Format
        run: cargo fmt --all

      - name: Compile and test serial build
        run: cargo test --all-targets

      - name: Compile and test parallel build
        run: cargo test --all-targets --all-features

      - name: Commit checkpoint
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: add package-owned parallel batch execution'
          for ATTEMPT in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep 2
          done
          exit 1
