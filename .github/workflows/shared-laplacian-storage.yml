name: Shared Laplacian storage gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shared-laplacian-storage.yml'

permissions:
  contents: write

concurrency:
  group: cmg-shared-laplacian-storage
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify shared immutable Laplacian buffers
        shell: bash
        run: |
          set -euo pipefail
          python scripts/shared_laplacian_storage_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/shared-laplacian-storage-latest.json || true
