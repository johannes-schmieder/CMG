name: Diagnose local-merge Clippy failure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-local-merge-clippy.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture exact Clippy diagnostic and restore source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/diagnose_local_merge_clippy.py

      - name: Show diagnostic
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/local-duplicate-merge-clippy.json || true
