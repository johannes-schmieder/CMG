name: Gate parallel outer PCG centering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/parallel-outer-centering.yml'
      - 'scripts/parallel_outer_centering_gate.py'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and benchmark candidate
        run: python scripts/parallel_outer_centering_gate.py

      - name: Commit decision checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          if ! git diff --cached --quiet -- src/components.rs src/pcg.rs; then
            message='perf: parallelize planned outer-PCG centering'
          else
            message='perf: record parallel outer-PCG centering experiment'
          fi
          git commit -m "$message"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
