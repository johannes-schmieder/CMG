name: Confirm dense endpoint-axis sorting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/confirm-dense-endpoint-axis-sort.yml'

permissions:
  contents: write

concurrency:
  group: cmg-confirm-dense-endpoint-axis-sort
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run higher-repetition dense sorting confirmation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/confirm_dense_endpoint_axis_sort.py

      - name: Show confirmed decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/dense-endpoint-axis-sort-latest.json || true
