name: Clean benchmark build artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-benchmark-artifacts.yml'

permissions:
  contents: write

jobs:
  clean-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove duplicate source and tracked build products
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch benchmarks/c-kernel/upstream/cycle.c
          git rm -r --ignore-unmatch benchmarks/c-kernel/target
          python - <<'PY'
          from pathlib import Path
          path = Path('.gitignore')
          lines = path.read_text().splitlines()
          lines = ['target/' if line == '/target/' else line for line in lines]
          if 'target/' not in lines:
              lines.insert(0, 'target/')
          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Validate repository and isolated benchmark crate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo check --lib --no-default-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          cargo test --all-targets --all-features --release
          cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all -- --check
          cargo clippy --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets --release

      - name: Commit cleanup checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cleanup-benchmark-artifacts.yml
          rm -rf benchmarks/c-kernel/target
          rm -f benchmarks/c-kernel/Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove benchmark build artifacts'
          git pull --rebase origin main
          git push origin HEAD:main
