name: Compact conductance-front list gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/conductance-front-list.yml'

permissions:
  contents: write

concurrency:
  group: cmg-conductance-front-list
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify compact conductance-front traversal
        shell: bash
        run: |
          set -euo pipefail
          python scripts/conductance_front_list_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/conductance-front-list-latest.json || true
