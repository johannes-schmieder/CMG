name: Recover readable packed-key gate source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-packed-key-gate-source.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode the valid historical gate payload
        shell: python
        run: |
          import ast
          import base64
          import gzip
          from pathlib import Path
          import subprocess

          historical = 'a8bfeac905f9e70ce30aa1c53759e7c45f5f33e3'
          wrapper = subprocess.check_output(
              ['git', 'show', f'{historical}:scripts/packed_endpoint_key_gate.py'],
              text=True,
          )
          module = ast.parse(wrapper)
          payload = None
          for statement in module.body:
              if isinstance(statement, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == 'PAYLOAD'
                  for target in statement.targets
              ):
                  payload = ast.literal_eval(statement.value)
                  break
          if not isinstance(payload, str):
              raise SystemExit('historical packed-key PAYLOAD was not found')
          source = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          compile(source, '<historical_packed_endpoint_key_gate>', 'exec')

          destination = Path(
              '.ci/performance/packed-endpoint-key-gate-source.py'
          )
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(source)
          Path('.github/workflows/recover-packed-key-gate-source.yml').unlink()

      - name: Commit readable recovery source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: recover readable packed-key gate source [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
