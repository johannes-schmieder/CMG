name: Bounded-prefix path RSS scaling gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bounded-prefix-path-rss.yml'

permissions:
  contents: write

concurrency:
  group: cmg-bounded-prefix-path-rss
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify RSS scaling and exact memory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/bounded_prefix_path_rss_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/bounded-prefix-path-rss-latest.json || true
