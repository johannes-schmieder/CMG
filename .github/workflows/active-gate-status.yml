name: Record active optimization gates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/active-gate-status.yml'

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Query active workflow runs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          import json
          import os
          from pathlib import Path
          import urllib.request

          repository = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          workflows = [
              'two-stage-sort-probe.yml',
              'parallel-pcg-vector-kernels.yml',
          ]
          result = {'schema_version': 1, 'workflows': {}}
          for workflow in workflows:
              url = (
                  f'https://api.github.com/repos/{repository}/actions/workflows/'
                  f'{workflow}/runs?branch=main&per_page=5'
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              runs = []
              for run in payload.get('workflow_runs', []):
                  runs.append({
                      'id': run['id'],
                      'status': run['status'],
                      'conclusion': run['conclusion'],
                      'created_at': run['created_at'],
                      'updated_at': run['updated_at'],
                      'head_sha': run['head_sha'],
                      'run_attempt': run['run_attempt'],
                      'html_url': run['html_url'],
                  })
              result['workflows'][workflow] = runs

          destination = Path('.ci/active-optimization-gates.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          Path('.github/workflows/active-gate-status.yml').unlink()

      - name: Commit status record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: record active optimization gates [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
