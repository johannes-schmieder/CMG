name: Requalify shared graph storage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/requalify-shared-storage.yml'

permissions:
  contents: write

concurrency:
  group: cmg-requalify-shared-storage
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and run certified PCG routing plus pinned C differential
        shell: python
        run: |
          import json
          import math
          from pathlib import Path
          import subprocess

          root = Path.cwd()

          def run(command, timeout=7000):
              print('+', ' '.join(str(item) for item in command), flush=True)
              completed = subprocess.run(
                  [str(item) for item in command],
                  cwd=root,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
              )
              print(completed.stdout, end='')
              if completed.returncode != 0:
                  raise RuntimeError(
                      f"command failed ({completed.returncode}): "
                      f"{' '.join(str(item) for item in command)}"
                  )
              return completed

          result = {
              'schema_version': 1,
              'qualification': 'shared-laplacian-storage',
              'source_sha': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], cwd=root, text=True
              ).strip(),
              'status': 'not_run',
              'pcg_cases': {},
              'c_differential': {},
          }
          try:
              run(['cargo', 'fmt', '--all', '--', '--check'])
              run([
                  'cargo', 'clippy', '--all-targets', '--all-features',
                  '--', '-D', 'warnings',
              ])
              run(['cargo', 'test', '--all-targets', '--all-features', '--release'])
              run([
                  'cargo', 'build', '--release',
                  '--manifest-path', 'benchmarks/Cargo.toml',
                  '--bin', 'full-pcg-routing',
              ])
              binary = Path('benchmarks/target/release/full-pcg-routing')
              specifications = (
                  ('path-250k', ['path', '250000', '3', '4'], 'Serial'),
                  ('worker-firm-375k', ['worker-firm', '125000', '3', '4'], 'Planned'),
                  ('worker-firm-600k', ['worker-firm', '200000', '3', '4'], 'Planned'),
                  ('dense-worker-firm-800k', ['dense-worker-firm', '50000', '3', '4'], 'Planned'),
              )
              for name, arguments, expected_route in specifications:
                  completed = run([binary, *arguments])
                  payloads = [
                      json.loads(line)
                      for line in completed.stdout.splitlines()
                      if line.strip().startswith('{')
                  ]
                  if len(payloads) != 1:
                      raise RuntimeError(f'{name}: unexpected output {payloads}')
                  payload = payloads[0]
                  if payload['serial_iterations'] != payload['planned_iterations']:
                      raise RuntimeError(f'{name}: iteration mismatch')
                  if payload['max_scaled_difference'] > 1.0e-8:
                      raise RuntimeError(f'{name}: solution mismatch')
                  if expected_route not in payload['auto_execution']:
                      raise RuntimeError(
                          f"{name}: expected route {expected_route}, "
                          f"observed {payload['auto_execution']}"
                      )
                  for field in (
                      'serial_backward_error', 'planned_backward_error',
                      'serial_residual_norm', 'planned_residual_norm',
                      'speedup',
                  ):
                      if not math.isfinite(payload[field]):
                          raise RuntimeError(f'{name}: non-finite {field}')
                  result['pcg_cases'][name] = payload

              run([
                  'cargo', 'test', '--release',
                  '--manifest-path', 'benchmarks/c-kernel/Cargo.toml',
                  '--all-targets',
              ])
              for case in ('path', 'worker-firm'):
                  destination = Path(f'/tmp/shared-storage-c-{case}.json')
                  run([
                      'cargo', 'run', '--quiet', '--release',
                      '--manifest-path', 'benchmarks/c-kernel/Cargo.toml', '--',
                      '--case', case,
                      '--vertices', '100000',
                      '--repetitions', '5',
                      '--output', destination,
                  ])
                  payload = json.loads(destination.read_text())
                  result['c_differential'][case] = payload
              result['status'] = 'success'
          except Exception as error:
              result['status'] = 'failure'
              result['error'] = repr(error)
              print(f'shared-storage qualification failed: {error}', flush=True)

          destination = Path('.ci/performance/shared-storage-qualification.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          Path('.github/workflows/requalify-shared-storage.yml').unlink()

          run(['git', 'config', 'user.name', 'github-actions[bot]'])
          run([
              'git', 'config', 'user.email',
              '41898282+github-actions[bot]@users.noreply.github.com',
          ])
          run(['git', 'add', '-A'])
          run(['git', 'commit', '-m', 'test: qualify shared graph storage'])
          for _ in range(5):
              run(['git', 'pull', '--rebase', 'origin', 'main'])
              pushed = subprocess.run(
                  ['git', 'push', 'origin', 'HEAD:main'], cwd=root
              )
              if pushed.returncode == 0:
                  break
          else:
              raise RuntimeError('failed to push shared-storage qualification')
          if result['status'] != 'success':
              raise SystemExit(1)

      - name: Show retained qualification
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/shared-storage-qualification.json || true
