name: Routed endpoint-axis compact sort gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/routed-endpoint-axis-sort.yml'

permissions:
  contents: write

concurrency:
  group: cmg-routed-endpoint-axis-sort
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify routed endpoint-axis compact sorting
        shell: bash
        run: |
          set -euo pipefail
          python scripts/routed_endpoint_axis_sort_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/routed-endpoint-axis-sort-latest.json || true
