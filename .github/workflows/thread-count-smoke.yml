name: Thread count smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thread-count-smoke.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build benchmark and run configured thread counts
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import time

          root = Path.cwd()

          def run(command, *, env=None, timeout=900, check=True):
              print('+', ' '.join(command), flush=True)
              started = time.perf_counter()
              completed = subprocess.run(
                  command,
                  cwd=root,
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
              )
              elapsed = time.perf_counter() - started
              print(completed.stdout, end='')
              if check and completed.returncode != 0:
                  raise RuntimeError(
                      f"command failed ({completed.returncode}): {' '.join(command)}"
                  )
              return completed, elapsed

          run([
              'cargo', 'build', '--release', '--manifest-path',
              'benchmarks/Cargo.toml', '--bin', 'cmg-bench',
          ])
          binary = Path('benchmarks/target/release/cmg-bench')
          if not binary.exists():
              binary = Path('target/release/cmg-bench')
          source = Path('benchmarks/src/bin/cmg-bench.rs').read_text()
          help_result, _ = run([str(binary), '--help'], timeout=120, check=False)
          help_text = help_result.stdout

          thread_flag_match = re.search(
              r'(?m)(--(?:num[-_])?threads?|--thread[-_]count)\b', help_text
          )
          thread_flag = thread_flag_match.group(1) if thread_flag_match else None
          environment_names = sorted(set(re.findall(
              r'["\']([A-Z][A-Z0-9_]*THREAD[A-Z0-9_]*)["\']', source
          )))
          thread_environment = environment_names[0] if environment_names else None

          base_arguments = []
          flag_values = [
              (r'(--(?:vertices|vertex-count|nodes))\b', '20000'),
              (r'(--(?:edges|edge-count))\b', '60000'),
              (r'(--(?:rhs|right-hand-sides))\b', '16'),
              (r'(--(?:repetitions|reps|iterations))\b', '2'),
          ]
          for pattern, value in flag_values:
              match = re.search(pattern, help_text)
              if match:
                  base_arguments.extend([match.group(1), value])

          size_environment_values = {
              name: value
              for name, value in (
                  ('CMG_BENCH_VERTICES', '20000'),
                  ('CMG_BENCH_EDGES', '60000'),
                  ('CMG_BENCH_RHS', '16'),
                  ('CMG_BENCH_REPETITIONS', '2'),
              )
              if name in source
          }

          logical_cpus = os.cpu_count() or 1
          observations = []
          for threads in (1, 2, 4, 8, 16, 32):
              env = os.environ.copy()
              env.update(size_environment_values)
              env['RAYON_NUM_THREADS'] = str(threads)
              if thread_environment:
                  env[thread_environment] = str(threads)
              arguments = list(base_arguments)
              if thread_flag:
                  arguments.extend([thread_flag, str(threads)])
              completed, elapsed = run(
                  [str(binary), *arguments], env=env, timeout=900
              )
              observations.append({
                  'configured_threads': threads,
                  'oversubscribed': threads > logical_cpus,
                  'elapsed_seconds': elapsed,
                  'return_code': completed.returncode,
                  'stdout_tail': completed.stdout[-12000:],
              })

          test_env = os.environ.copy()
          test_env['RAYON_NUM_THREADS'] = '32'
          if thread_environment:
              test_env[thread_environment] = '32'
          _, test_elapsed = run(
              ['cargo', 'test', '--all-targets', '--release'],
              env=test_env,
              timeout=1800,
          )

          result = {
              'schema_version': 1,
              'benchmark': 'thread-count-smoke',
              'commit': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'logical_cpus': logical_cpus,
              'thread_control': {
                  'cli_flag': thread_flag,
                  'environment_variable': thread_environment,
                  'rayon_environment_also_set': True,
                  'base_arguments': base_arguments,
                  'size_environment': size_environment_values,
              },
              'release_test_32_threads_seconds': test_elapsed,
              'observations': observations,
              'qualification': 'success',
          }
          destination = Path('.ci/performance/thread-count-smoke.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')

      - name: Update live plan and remove one-shot workflow
        shell: python
        run: |
          import json
          from pathlib import Path

          result = json.loads(
              Path('.ci/performance/thread-count-smoke.json').read_text()
          )
          rows = []
          for item in result['observations']:
              rows.append(
                  f"| {item['configured_threads']} | "
                  f"{'yes' if item['oversubscribed'] else 'no'} | "
                  f"{item['elapsed_seconds']:.3f} |"
              )
          checkpoint = '''### Thread-count smoke checkpoint — 2026-08-22

| Configured threads | Oversubscribed hosted runner | End-to-end benchmark wall time (s) |
|---:|:---:|---:|
''' + '\n'.join(rows) + f'''

- The full release numerical suite also passed with 32 configured threads.
- The runner exposed {result['logical_cpus']} logical CPUs; rows above that count
  establish configuration/correctness only, not scaling.
- Machine-readable evidence: `.ci/performance/thread-count-smoke.json`.

'''
          path = Path('PERFORMANCE_PLAN.md')
          text = path.read_text()
          marker = '## Current next action\n'
          if marker not in text:
              raise SystemExit('current-next-action heading missing')
          if '### Thread-count smoke checkpoint — 2026-08-22' not in text:
              text = text.replace(marker, checkpoint + marker, 1)
          path.write_text(text)
          Path('.github/workflows/thread-count-smoke.yml').unlink()

      - name: Commit smoke-test checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: qualify configured thread counts through 32'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Show result
        if: always()
        shell: bash
        run: cat .ci/performance/thread-count-smoke.json || true
