name: Unstable compact-edge sort gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unstable-edge-sort-gate.yml'
      - 'scripts/unstable_edge_sort_gate.py'

permissions:
  contents: write

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify in-place unstable sorting
        shell: bash
        run: python scripts/unstable_edge_sort_gate.py

      - name: Show decision record
        if: always()
        shell: bash
        run: |
          git show origin/main:.ci/performance/unstable-edge-sort-latest.json || true
