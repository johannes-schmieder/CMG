name: Wire recursive cycle benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-cycle-benchmark.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire recursive cycle into benchmark JSON
        shell: python
        run: |
          from pathlib import Path

          cycle_path = Path('benchmarks/c-kernel/src/cycle.rs')
          cycle_text = cycle_path.read_text()
          old = 'requested_dimension.min(CYCLE_DIMENSION_LIMIT).max(128)'
          new = 'requested_dimension.clamp(128, CYCLE_DIMENSION_LIMIT)'
          if cycle_text.count(old) != 1:
              raise SystemExit('cycle dimension clamp anchor changed')
          cycle_path.write_text(cycle_text.replace(old, new, 1))

          path = Path('benchmarks/c-kernel/src/main.rs')
          text = path.read_text()

          old = 'mod projection;\n'
          new = 'mod cycle;\nmod projection;\n'
          if text.count(old) != 1:
              raise SystemExit('module anchor changed')
          text = text.replace(old, new, 1)

          old = '''    let projection = projection::benchmark(&config.case, graph.vertex_count(), config.repetitions)?;\n\n    let json = format!(\n'''
          new = '''    let projection = projection::benchmark(&config.case, graph.vertex_count(), config.repetitions)?;\n    let cycle = cycle::benchmark(&config.case, graph.vertex_count(), config.repetitions)?;\n\n    let json = format!(\n'''
          if text.count(old) != 1:
              raise SystemExit('benchmark-call anchor changed')
          text = text.replace(old, new, 1)

          old = '            "  \\\"schema\\\": 2,\\n",\n'
          new = '            "  \\\"schema\\\": 3,\\n",\n'
          if text.count(old) != 1:
              raise SystemExit('schema anchor changed')
          text = text.replace(old, new, 1)

          old = '''            "  \\\"max_scaled_error\\\": {:.17e},\\n",\n            "  \\\"projection\\\": {}\\n",\n            "}}\\n"\n'''
          new = '''            "  \\\"max_scaled_error\\\": {:.17e},\\n",\n            "  \\\"projection\\\": {},\\n",\n            "  \\\"cycle\\\": {}\\n",\n            "}}\\n"\n'''
          if text.count(old) != 1:
              raise SystemExit('JSON field anchor changed')
          text = text.replace(old, new, 1)

          old = '''        max_scaled_error,\n        projection.to_json(),\n    );\n'''
          new = '''        max_scaled_error,\n        projection.to_json(),\n        cycle.to_json(),\n    );\n'''
          if text.count(old) != 1:
              raise SystemExit('JSON argument anchor changed')
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Format and validate isolated crate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all
          cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all -- --check
          cargo clippy --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets --release
          cargo build --manifest-path benchmarks/c-kernel/Cargo.toml --release

      - name: Commit recursive cycle checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/wire-cycle-benchmark.yml
          rm -rf benchmarks/c-kernel/target
          rm -f benchmarks/c-kernel/Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: compare C and Rust recursive cycles'
          git pull --rebase origin main
          git push origin HEAD:main
