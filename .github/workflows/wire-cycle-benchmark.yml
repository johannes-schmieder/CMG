name: Wire recursive cycle benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-cycle-benchmark.yml'

concurrency:
  group: wire-cycle-benchmark
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-test-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch and validate isolated crate
        id: validate
        shell: bash
        run: |
          set +e
          mkdir -p .ci/performance
          {
            python - <<'PY'
            from pathlib import Path

            cycle_path = Path('benchmarks/c-kernel/src/cycle.rs')
            cycle_text = cycle_path.read_text()
            old = 'requested_dimension.min(CYCLE_DIMENSION_LIMIT).max(128)'
            new = 'requested_dimension.clamp(128, CYCLE_DIMENSION_LIMIT)'
            if cycle_text.count(old) != 1:
                raise SystemExit('cycle dimension clamp anchor changed')
            cycle_path.write_text(cycle_text.replace(old, new, 1))

            path = Path('benchmarks/c-kernel/src/main.rs')
            text = path.read_text()
            replacements = [
                ('mod projection;\n', 'mod cycle;\nmod projection;\n'),
                (
                    '    let projection = projection::benchmark(&config.case, graph.vertex_count(), config.repetitions)?;\n\n    let json = format!(\n',
                    '    let projection = projection::benchmark(&config.case, graph.vertex_count(), config.repetitions)?;\n    let cycle = cycle::benchmark(&config.case, graph.vertex_count(), config.repetitions)?;\n\n    let json = format!(\n',
                ),
                ('            "  \\\"schema\\\": 2,\\n",\n', '            "  \\\"schema\\\": 3,\\n",\n'),
                (
                    '            "  \\\"max_scaled_error\\\": {:.17e},\\n",\n            "  \\\"projection\\\": {}\\n",\n            "}}\\n"\n',
                    '            "  \\\"max_scaled_error\\\": {:.17e},\\n",\n            "  \\\"projection\\\": {},\\n",\n            "  \\\"cycle\\\": {}\\n",\n            "}}\\n"\n',
                ),
                (
                    '        max_scaled_error,\n        projection.to_json(),\n    );\n',
                    '        max_scaled_error,\n        projection.to_json(),\n        cycle.to_json(),\n    );\n',
                ),
            ]
            for old, new in replacements:
                if text.count(old) != 1:
                    raise SystemExit(f'cycle wiring anchor changed: {old[:60]!r}')
                text = text.replace(old, new, 1)
            path.write_text(text)
            PY
            cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all &&
            cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all -- --check &&
            cargo clippy --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets -- -D warnings &&
            cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets &&
            cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets --release &&
            cargo build --manifest-path benchmarks/c-kernel/Cargo.toml --release
          } > .ci/performance/cycle-wiring.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retain validated source or failure diagnostics
        if: ${{ always() }}
        shell: bash
        env:
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
        run: |
          set -euo pipefail
          rm -rf benchmarks/c-kernel/target
          rm -f benchmarks/c-kernel/Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$VALIDATION_STATUS" = 0 ]; then
            rm .github/workflows/wire-cycle-benchmark.yml
            rm -f .ci/performance/cycle-wiring-latest.json
            rm -f .ci/performance/cycle-wiring.log
            git add -A
            git commit -m 'perf: compare C and Rust recursive cycles'
          else
            git restore benchmarks/c-kernel/src/main.rs benchmarks/c-kernel/src/cycle.rs
            python - <<'PY'
            import json
            import os
            import subprocess
            from pathlib import Path

            log = Path('.ci/performance/cycle-wiring.log')
            record = {
                'schema': 1,
                'tested_sha': subprocess.check_output(
                    ['git', 'rev-parse', 'HEAD'], text=True
                ).strip(),
                'status': os.environ.get('VALIDATION_STATUS', 'not-run'),
                'log_tail': log.read_text(errors='replace').splitlines()[-240:]
                    if log.exists() else [],
            }
            Path('.ci/performance/cycle-wiring-latest.json').write_text(
                json.dumps(record, indent=2) + '\n'
            )
            PY
            rm -f .ci/performance/cycle-wiring.log
            git add .ci/performance/cycle-wiring-latest.json
            git commit -m 'ci: record recursive cycle wiring failure [skip ci]'
          fi

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce validation success
        if: ${{ always() }}
        shell: bash
        env:
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
        run: test "$VALIDATION_STATUS" = 0
