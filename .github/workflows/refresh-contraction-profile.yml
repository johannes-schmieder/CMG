# Armed after the workflow existed on the default branch.
name: Refresh current-kernel contraction profile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-contraction-profile.yml'

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align profiler and record current phase shares
        run: python scripts/refresh_contraction_profile.py

      - name: Commit profile checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: refresh current-kernel contraction profile'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Show profile
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/contraction-subphase-profile-v2.json || true
