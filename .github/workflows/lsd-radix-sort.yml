name: Memory-routed LSD radix-sort gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lsd-radix-sort.yml'

permissions:
  contents: write

concurrency:
  group: cmg-memory-routed-lsd-radix-sort
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify memory-routed streaming radix sorting
        shell: bash
        run: |
          set -euo pipefail
          python scripts/lsd_radix_sort_gate.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/lsd-radix-sort-latest.json || true
