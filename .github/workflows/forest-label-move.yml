name: Zero-copy forest labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forest-label-move.yml'
      - 'scripts/forest_label_move_gate.py'

concurrency:
  group: cmg-zero-copy-forest-labels
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify zero-copy forest labels
        run: python scripts/forest_label_move_gate.py

      - name: Show retained result
        if: always()
        run: git show origin/main:.ci/performance/forest-label-move-latest.json || true
