name: Repaired internal serial heavy-edge routing gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/internal-serial-heavy-edge-v2.yml'

permissions:
  contents: write

concurrency:
  group: cmg-internal-serial-heavy-edge-v2
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify compact serial heavy-edge selection inside hierarchy setup
        shell: bash
        run: |
          set -euo pipefail
          python scripts/internal_serial_heavy_edge_gate_v2.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/internal-serial-heavy-edge-latest.json || true
