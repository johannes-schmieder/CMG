name: Parallel CMG application plan v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/parallel-cmg-plan-v2.yml'
      - 'scripts/parallel_cmg_plan_gate_v2.py'

permissions:
  contents: write

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify optional selective parallel CMG application
        run: python scripts/parallel_cmg_plan_gate_v2.py

      - name: Show result
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/parallel-cmg-plan-latest.json || true
