name: Run C projection comparison once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-c-projection-once.yml'

permissions:
  contents: write

jobs:
  compare-and-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and benchmark
        shell: bash
        run: |
          set -euo pipefail
          export CMG_BENCH_COMMIT=$(git rev-parse HEAD)
          cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all -- --check
          cargo clippy --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets --release
          cargo build --manifest-path benchmarks/c-kernel/Cargo.toml --release
          mkdir -p .ci/performance/c-kernel
          for CASE in path worker-firm; do
            cargo run --quiet --release \
              --manifest-path benchmarks/c-kernel/Cargo.toml -- \
              --case "$CASE" \
              --vertices 100000 \
              --repetitions 7 \
              --output ".ci/performance/c-kernel/${CASE}.json"
          done

      - name: Build retained record
        shell: python
        run: |
          import json
          from pathlib import Path
          import subprocess

          tested_sha = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          record = {
              'schema': 3,
              'tested_sha': tested_sha,
              'upstream_commit': '19752fc102f8cae8e34f66457bfaccb1aaa60375',
              'runner': 'ubuntu-latest',
              'validation_status': '0',
              'benchmark_status': '0',
              'success': True,
              'results': {
                  'path': json.loads(
                      Path('.ci/performance/c-kernel/path.json').read_text()
                  ),
                  'worker_firm': json.loads(
                      Path('.ci/performance/c-kernel/worker-firm.json').read_text()
                  ),
              },
              'validation_log_tail': [],
              'benchmark_log_tail': [],
          }
          Path('.ci/performance/c-kernel-latest.json').write_text(
              json.dumps(record, indent=2) + '\n'
          )

      - name: Commit result and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/run-c-projection-once.yml
          rm -f benchmarks/c-kernel/Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: record C projection comparison'
          git pull --rebase origin main
          git push origin HEAD:main
