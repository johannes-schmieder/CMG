name: Optimize forest traversal scratch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-forest-scratch.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reuse forest traversal buffers
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/forest.rs')
          text = path.read_text()
          old = '''    for start in 0..n {\n        let mut current = start;\n'''
          new = '''    let mut walk = Vec::new();\n    let mut new_ancestors = Vec::new();\n\n    for start in 0..n {\n        let mut current = start;\n'''
          if text.count(old) != 1:
              raise SystemExit('forest outer-loop anchor changed')
          text = text.replace(old, new)
          old = '''            let mut ancestors_in_path = 0_i64;\n            let mut walk = vec![current];\n            let mut new_ancestors = vec![0_i64];\n            let mut k = 0_usize;\n'''
          new = '''            let mut ancestors_in_path = 0_i64;\n            walk.clear();\n            walk.push(current);\n            new_ancestors.clear();\n            new_ancestors.push(0_i64);\n            let mut k = 0_usize;\n'''
          if text.count(old) != 1:
              raise SystemExit('forest scratch-allocation anchor changed')
          path.write_text(text.replace(old, new))

      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --all-targets --all-features
          cargo test --all-targets --all-features --release
          cargo clippy --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --all-features

      - name: Commit validated optimization
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/optimize-forest-scratch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: reuse forest traversal scratch buffers'
          git pull --rebase origin main
          git push origin HEAD:main
