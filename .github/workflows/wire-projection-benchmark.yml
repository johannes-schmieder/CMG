name: Wire C projection benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-projection-benchmark.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire projection benchmark into retained JSON
        shell: python
        run: |
          from pathlib import Path

          path = Path('benchmarks/c-kernel/src/main.rs')
          text = path.read_text()

          old = 'use cmg::Laplacian;\n'
          new = 'mod projection;\n\nuse cmg::Laplacian;\n'
          if text.count(old) != 1:
              raise SystemExit('main import anchor changed')
          text = text.replace(old, new, 1)

          old = '''    let c_edges_per_second = edge_visits * 1.0e9 / c_median_ns as f64;\n\n    let json = format!(\n'''
          new = '''    let c_edges_per_second = edge_visits * 1.0e9 / c_median_ns as f64;\n    let projection = projection::benchmark(\n        &config.case,\n        graph.vertex_count(),\n        config.repetitions,\n    )?;\n\n    let json = format!(\n'''
          if text.count(old) != 1:
              raise SystemExit('benchmark insertion anchor changed')
          text = text.replace(old, new, 1)

          old = '            "  \\\"schema\\\": 1,\\n",\n'
          new = '            "  \\\"schema\\\": 2,\\n",\n'
          if text.count(old) != 1:
              raise SystemExit('schema anchor changed')
          text = text.replace(old, new, 1)

          old = '''            "  \\\"max_abs_error\\\": {:.17e},\\n",\n            "  \\\"max_scaled_error\\\": {:.17e}\\n",\n            "}}\\n"\n'''
          new = '''            "  \\\"max_abs_error\\\": {:.17e},\\n",\n            "  \\\"max_scaled_error\\\": {:.17e},\\n",\n            "  \\\"projection\\\": {}\\n",\n            "}}\\n"\n'''
          if text.count(old) != 1:
              raise SystemExit('JSON field anchor changed')
          text = text.replace(old, new, 1)

          old = '''        max_abs_error,\n        max_scaled_error,\n    );\n'''
          new = '''        max_abs_error,\n        max_scaled_error,\n        projection.to_json(),\n    );\n'''
          if text.count(old) != 1:
              raise SystemExit('JSON argument anchor changed')
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Format and validate isolated crate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all
          cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all -- --check
          cargo clippy --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --release
          cargo build --manifest-path benchmarks/c-kernel/Cargo.toml --release

      - name: Commit validated projection comparison
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/wire-projection-benchmark.yml
          rm -f benchmarks/c-kernel/Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: compare C and Rust projection kernels'
          git pull --rebase origin main
          git push origin HEAD:main
