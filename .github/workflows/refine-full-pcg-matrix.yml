name: Refine full PCG crossover matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-full-pcg-matrix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Expand crossover cases
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/performance.yml')
          text = path.read_text()
          old = '''          specs = [
              ('path-250k', ['path', 250000, 3, 4]),
              ('worker-firm-300k', ['worker-firm', 100000, 3, 4]),
              ('worker-firm-600k', ['worker-firm', 200000, 3, 4]),
              ('dense-worker-firm-800k', ['dense-worker-firm', 50000, 3, 4]),
              ('dense-worker-firm-1.6m', ['dense-worker-firm', 100000, 3, 4]),
          ]'''
          new = '''          specs = [
              ('path-250k', ['path', 250000, 3, 4]),
              ('worker-firm-300k', ['worker-firm', 100000, 3, 4]),
              ('worker-firm-375k', ['worker-firm', 125000, 3, 4]),
              ('worker-firm-450k', ['worker-firm', 150000, 3, 4]),
              ('worker-firm-525k', ['worker-firm', 175000, 3, 4]),
              ('worker-firm-600k', ['worker-firm', 200000, 3, 4]),
              ('dense-worker-firm-400k', ['dense-worker-firm', 25000, 3, 4]),
              ('dense-worker-firm-600k', ['dense-worker-firm', 37500, 3, 4]),
              ('dense-worker-firm-800k', ['dense-worker-firm', 50000, 3, 4]),
              ('dense-worker-firm-1.6m', ['dense-worker-firm', 100000, 3, 4]),
          ]'''
          if old not in text:
              raise SystemExit('full-PCG specs block not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/refine-full-pcg-matrix.yml').unlink()

      - name: Commit refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: refine full PCG crossover matrix'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
