name: Repaired compact forest-indegree gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-forest-indegree-v2.yml'

permissions:
  contents: write

concurrency:
  group: cmg-compact-forest-indegree-v2
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify repaired compact forest indegrees
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compact_forest_indegree_gate_v2.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/compact-forest-indegree-latest.json || true
