name: Refresh performance documentation

on:
  push:
    branches: [main]
    paths:
      - '.ci/performance/full-pcg-routing-latest.json'
      - 'scripts/update_routing_docs.py'
      - '.github/workflows/performance-docs.yml'

concurrency:
  group: performance-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh live plan and status
        run: |
          python3 scripts/update_routing_docs.py \
            --candidate . \
            --routing .ci/performance/full-pcg-routing-latest.json

      - name: Commit refreshed documentation safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PERFORMANCE_PLAN.md PERFORMANCE_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: refresh routing evidence [skip ci]'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "documentation push raced on attempt ${attempt}; retrying"
          done
          exit 1
