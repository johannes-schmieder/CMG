name: Confirm fused walk-ancestor scratch RSS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/confirm-fused-walk-ancestor-scratch.yml'

permissions:
  contents: write

concurrency:
  group: cmg-confirm-fused-walk-ancestor-scratch
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Requalify fused scratch with repeated process RSS
        shell: bash
        run: |
          set -euo pipefail
          python scripts/confirm_fused_walk_ancestor_scratch.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/fused-walk-ancestor-scratch-confirmation.json || true
