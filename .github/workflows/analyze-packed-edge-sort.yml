name: Analyze packed endpoint key sorting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-packed-edge-sort.yml'
      - '.ci/performance/compact-hierarchy-index-latest.json'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect sort comparator sites
        run: python scripts/analyze_packed_edge_sort.py

      - name: Commit analysis checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'perf: analyze packed endpoint-key sorting'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
