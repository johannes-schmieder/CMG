name: Add pinned C kernel comparison

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-c-kernel-benchmark.yml'

permissions:
  contents: write

jobs:
  add-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create isolated C comparison crate
        shell: python
        run: |
          from pathlib import Path

          files = {
            'benchmarks/c-kernel/Cargo.toml': r'''[package]
          name = "cmg-c-kernel-bench"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.85"
          publish = false
          license = "GPL-3.0-only"

          [dependencies]
          cmg = { path = "../.." }

          [build-dependencies]
          cc = "1.2"
          ''',
            'benchmarks/c-kernel/build.rs': r'''fn main() {
              println!("cargo:rerun-if-changed=upstream/sspmv.c");
              cc::Build::new()
                  .file("upstream/sspmv.c")
                  .flag_if_supported("-O3")
                  .flag_if_supported("-std=c99")
                  .compile("cmg_reference_sspmv");
          }
          ''',
            'benchmarks/c-kernel/upstream/sspmv.c': r'''/*
           * Standalone benchmark adaptation of the pinned CMG sspmv kernel.
           *
           * Upstream: ikoutis/cmg-solver
           * Commit: 19752fc102f8cae8e34f66457bfaccb1aaa60375
           * Original path: matlab/cmg/mex/sspmv.c
           * License: GNU GPL version 3; see the repository LICENSE.
           *
           * The arithmetic loop is unchanged. MATLAB-specific headers and type
           * aliases are replaced by fixed-width standalone declarations.
           */

          #include <stdint.h>

          typedef uint32_t mIndex;
          typedef uint32_t mSize;
          typedef double precision;

          void cmg_reference_sspmv(mSize n,
                                   const precision *a,
                                   const mIndex *ia,
                                   const mIndex *ja,
                                   const precision *x,
                                   precision *y) {
              mIndex i, j, k;
              precision sum;

              for (i = 0; i < n; i++) {
                  y[i] = 0;
              }

              for (i = 0; i < n; i++) {
                  sum = a[ia[i]] * x[i];
                  for (j = ia[i] + 1; j < ia[i + 1]; j++) {
                      k = ja[j];
                      sum += a[j] * x[k];
                      y[k] += a[j] * x[i];
                  }
                  y[i] += sum;
              }
          }
          ''',
            'benchmarks/c-kernel/README.md': r'''# Pinned C kernel comparison

This isolated benchmark crate compares the Rust edge-list Laplacian matrix-vector
product with the official CMG C `sspmv` arithmetic loop pinned at upstream commit
`19752fc102f8cae8e34f66457bfaccb1aaa60375`.

The C source is benchmark-only. It is not linked into the Rust CMG library. The
adapter replaces MATLAB-specific declarations with fixed-width standalone types;
the numerical loop is unchanged.

Run from the repository root:

```bash
cargo run --release --manifest-path benchmarks/c-kernel/Cargo.toml -- \
  --case worker-firm --vertices 100000
```

Hosted-runner timings are directional. The benchmark first verifies numerical
agreement and exits before timing if the scaled error exceeds `2e-12`.
''',
            'benchmarks/c-kernel/src/main.rs': r'''use cmg::Laplacian;
          use std::env;
          use std::error::Error;
          use std::fs;
          use std::hint::black_box;
          use std::io;
          use std::os::raw::{c_double, c_uint};
          use std::time::Instant;

          const UPSTREAM_COMMIT: &str = "19752fc102f8cae8e34f66457bfaccb1aaa60375";
          const TARGET_EDGE_VISITS: usize = 40_000_000;
          const ERROR_TOLERANCE: f64 = 2.0e-12;
          const SOURCE_COMMIT: &str = match option_env!("CMG_BENCH_COMMIT") {
              Some(value) => value,
              None => "unknown",
          };

          unsafe extern "C" {
              fn cmg_reference_sspmv(
                  n: c_uint,
                  a: *const c_double,
                  ia: *const c_uint,
                  ja: *const c_uint,
                  x: *const c_double,
                  y: *mut c_double,
              );
          }

          #[derive(Debug, Clone)]
          struct Config {
              case: String,
              vertices: usize,
              repetitions: usize,
              output: Option<String>,
          }

          impl Default for Config {
              fn default() -> Self {
                  Self {
                      case: "worker-firm".to_owned(),
                      vertices: 100_000,
                      repetitions: 5,
                      output: None,
                  }
              }
          }

          struct UpperSymmetric {
              n: c_uint,
              values: Vec<f64>,
              row_offsets: Vec<c_uint>,
              columns: Vec<c_uint>,
          }

          impl UpperSymmetric {
              fn from_graph(graph: &Laplacian) -> Result<Self, Box<dyn Error>> {
                  let n = graph.vertex_count();
                  let n_c = c_uint::try_from(n)
                      .map_err(|_| io::Error::other("vertex count exceeds upstream C index width"))?;
                  let total = n
                      .checked_add(graph.edge_count())
                      .ok_or_else(|| io::Error::other("upper matrix size overflow"))?;
                  c_uint::try_from(total)
                      .map_err(|_| io::Error::other("matrix nonzeros exceed upstream C index width"))?;

                  let mut counts = vec![1_usize; n];
                  for edge in graph.edges() {
                      counts[edge.u()] += 1;
                  }
                  let mut row_offsets_usize = vec![0_usize; n + 1];
                  for row in 0..n {
                      row_offsets_usize[row + 1] = row_offsets_usize[row] + counts[row];
                  }
                  let row_offsets: Vec<c_uint> = row_offsets_usize
                      .iter()
                      .map(|&value| {
                          c_uint::try_from(value).map_err(|_| {
                              io::Error::other("row offset exceeds upstream C index width")
                          })
                      })
                      .collect::<Result<_, _>>()?;
                  let mut values = vec![0.0; total];
                  let mut columns = vec![0_c_uint; total];
                  let mut cursor = vec![0_usize; n];
                  for row in 0..n {
                      let diagonal = row_offsets_usize[row];
                      values[diagonal] = graph.diagonal()[row];
                      columns[diagonal] = c_uint::try_from(row)?;
                      cursor[row] = diagonal + 1;
                  }
                  for edge in graph.edges() {
                      let position = cursor[edge.u()];
                      values[position] = -edge.weight();
                      columns[position] = c_uint::try_from(edge.v())?;
                      cursor[edge.u()] += 1;
                  }
                  Ok(Self {
                      n: n_c,
                      values,
                      row_offsets,
                      columns,
                  })
              }

              fn matvec_into(&self, input: &[f64], output: &mut [f64]) {
                  debug_assert_eq!(input.len(), self.n as usize);
                  debug_assert_eq!(output.len(), self.n as usize);
                  // SAFETY: all arrays are valid for the matrix dimension; the C
                  // kernel reads input/storage and writes exactly n output values.
                  unsafe {
                      cmg_reference_sspmv(
                          self.n,
                          self.values.as_ptr(),
                          self.row_offsets.as_ptr(),
                          self.columns.as_ptr(),
                          input.as_ptr(),
                          output.as_mut_ptr(),
                      );
                  }
              }
          }

          fn main() -> Result<(), Box<dyn Error>> {
              let config = parse_config()?;
              if config.vertices < 2 {
                  return Err(io::Error::other("vertices must be at least two").into());
              }
              if config.repetitions == 0 {
                  return Err(io::Error::other("repetitions must be positive").into());
              }

              let graph = Laplacian::from_edges(
                  config.vertices,
                  generate_edges(&config.case, config.vertices)?,
              )?;
              let c_matrix = UpperSymmetric::from_graph(&graph)?;
              let input = make_input(graph.vertex_count());
              let mut rust_output = vec![0.0; graph.vertex_count()];
              let mut c_output = vec![0.0; graph.vertex_count()];
              graph.matvec_into(&input, &mut rust_output)?;
              c_matrix.matvec_into(&input, &mut c_output);
              let (max_abs_error, max_scaled_error) = compare_outputs(&rust_output, &c_output);
              if !max_scaled_error.is_finite() || max_scaled_error > ERROR_TOLERANCE {
                  return Err(io::Error::other(format!(
                      "Rust/C matvec mismatch: scaled error {max_scaled_error:e}"
                  ))
                  .into());
              }

              let loops = (TARGET_EDGE_VISITS / graph.edge_count().max(1)).clamp(16, 4_000);
              for _ in 0..4 {
                  graph.matvec_into(black_box(&input), black_box(&mut rust_output))?;
                  c_matrix.matvec_into(black_box(&input), black_box(&mut c_output));
              }

              let mut rust_times = Vec::with_capacity(config.repetitions);
              let mut c_times = Vec::with_capacity(config.repetitions);
              for repetition in 0..config.repetitions {
                  if repetition % 2 == 0 {
                      rust_times.push(time_rust(&graph, &input, &mut rust_output, loops)?);
                      c_times.push(time_c(&c_matrix, &input, &mut c_output, loops));
                  } else {
                      c_times.push(time_c(&c_matrix, &input, &mut c_output, loops));
                      rust_times.push(time_rust(&graph, &input, &mut rust_output, loops)?);
                  }
              }
              let rust_median_ns = median(&mut rust_times);
              let c_median_ns = median(&mut c_times);
              let rust_over_c = rust_median_ns as f64 / c_median_ns as f64;
              let edge_visits = graph.edge_count() as f64 * loops as f64;
              let rust_edges_per_second = edge_visits * 1.0e9 / rust_median_ns as f64;
              let c_edges_per_second = edge_visits * 1.0e9 / c_median_ns as f64;

              let json = format!(
                  concat!(
                      "{{\n",
                      "  \"schema\": 1,\n",
                      "  \"source_commit\": \"{}\",\n",
                      "  \"upstream_commit\": \"{}\",\n",
                      "  \"case\": \"{}\",\n",
                      "  \"vertices\": {},\n",
                      "  \"canonical_edges\": {},\n",
                      "  \"loops\": {},\n",
                      "  \"repetitions\": {},\n",
                      "  \"rust_median_ns\": {},\n",
                      "  \"c_median_ns\": {},\n",
                      "  \"rust_over_c\": {:.17e},\n",
                      "  \"rust_edges_per_second\": {:.17e},\n",
                      "  \"c_edges_per_second\": {:.17e},\n",
                      "  \"max_abs_error\": {:.17e},\n",
                      "  \"max_scaled_error\": {:.17e}\n",
                      "}}\n"
                  ),
                  SOURCE_COMMIT,
                  UPSTREAM_COMMIT,
                  config.case,
                  graph.vertex_count(),
                  graph.edge_count(),
                  loops,
                  config.repetitions,
                  rust_median_ns,
                  c_median_ns,
                  rust_over_c,
                  rust_edges_per_second,
                  c_edges_per_second,
                  max_abs_error,
                  max_scaled_error,
              );
              if let Some(path) = config.output {
                  fs::write(path, &json)?;
              } else {
                  print!("{json}");
              }
              Ok(())
          }

          fn time_rust(
              graph: &Laplacian,
              input: &[f64],
              output: &mut [f64],
              loops: usize,
          ) -> Result<u128, Box<dyn Error>> {
              let start = Instant::now();
              for _ in 0..loops {
                  graph.matvec_into(black_box(input), black_box(output))?;
              }
              Ok(start.elapsed().as_nanos())
          }

          fn time_c(matrix: &UpperSymmetric, input: &[f64], output: &mut [f64], loops: usize) -> u128 {
              let start = Instant::now();
              for _ in 0..loops {
                  matrix.matvec_into(black_box(input), black_box(output));
              }
              start.elapsed().as_nanos()
          }

          fn compare_outputs(left: &[f64], right: &[f64]) -> (f64, f64) {
              left.iter().zip(right).fold((0.0_f64, 0.0_f64), |state, (&x, &y)| {
                  let absolute = (x - y).abs();
                  let scale = 1.0_f64.max(x.abs()).max(y.abs());
                  (state.0.max(absolute), state.1.max(absolute / scale))
              })
          }

          fn median(values: &mut [u128]) -> u128 {
              values.sort_unstable();
              values[values.len() / 2]
          }

          fn make_input(vertices: usize) -> Vec<f64> {
              (0..vertices)
                  .map(|vertex| {
                      let code = vertex.wrapping_mul(65_537).wrapping_add(19) % 4_093;
                      (code as f64 - 2_046.0) / 257.0
                  })
                  .collect()
          }

          fn generate_edges(case: &str, vertices: usize) -> Result<Vec<(usize, usize, f64)>, Box<dyn Error>> {
              match case {
                  "path" => Ok((0..vertices - 1)
                      .map(|u| (u, u + 1, 1.0 + (u % 17) as f64 / 31.0))
                      .collect()),
                  "worker-firm" => {
                      let workers = (vertices * 3 / 5).clamp(1, vertices - 1);
                      let firms = vertices - workers;
                      let mut edges = Vec::with_capacity(workers * 2);
                      for worker in 0..workers {
                          let first = workers + worker % firms;
                          let second = workers + worker.wrapping_mul(17).wrapping_add(3) % firms;
                          edges.push((worker, first, 0.75 + (worker % 29) as f64 / 23.0));
                          if second != first {
                              edges.push((worker, second, 0.5 + (worker % 37) as f64 / 19.0));
                          }
                      }
                      Ok(edges)
                  }
                  _ => Err(io::Error::other("case must be path or worker-firm").into()),
              }
          }

          fn parse_config() -> Result<Config, Box<dyn Error>> {
              let mut config = Config::default();
              let mut arguments = env::args().skip(1);
              while let Some(argument) = arguments.next() {
                  let value = arguments
                      .next()
                      .ok_or_else(|| io::Error::other(format!("missing value for {argument}")))?;
                  match argument.as_str() {
                      "--case" => config.case = value,
                      "--vertices" => config.vertices = value.parse()?,
                      "--repetitions" => config.repetitions = value.parse()?,
                      "--output" => config.output = Some(value),
                      _ => return Err(io::Error::other(format!("unknown option {argument}")).into()),
                  }
              }
              Ok(config)
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn pinned_c_kernel_matches_rust_on_small_graphs() {
                  for case in ["path", "worker-firm"] {
                      let graph = Laplacian::from_edges(64, generate_edges(case, 64).unwrap()).unwrap();
                      let matrix = UpperSymmetric::from_graph(&graph).unwrap();
                      let input = make_input(64);
                      let mut rust = vec![0.0; 64];
                      let mut c = vec![0.0; 64];
                      graph.matvec_into(&input, &mut rust).unwrap();
                      matrix.matvec_into(&input, &mut c);
                      let (_, scaled) = compare_outputs(&rust, &c);
                      assert!(scaled <= ERROR_TOLERANCE, "{case}: {scaled:e}");
                  }
              }
          }
          ''',
          }

          for name, content in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in content.splitlines())
              path.write_text(normalized.strip() + '\n')

      - name: Format, test, and lint comparison crate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path benchmarks/c-kernel/Cargo.toml --all -- --check
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml
          cargo test --manifest-path benchmarks/c-kernel/Cargo.toml --release
          cargo clippy --manifest-path benchmarks/c-kernel/Cargo.toml --all-targets -- -D warnings
          cargo build --manifest-path benchmarks/c-kernel/Cargo.toml --release

      - name: Run matched Rust and C kernels
        shell: bash
        env:
          CMG_BENCH_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .ci/performance/c-kernel
          for CASE in path worker-firm; do
            CMG_BENCH_COMMIT="$CMG_BENCH_COMMIT" \
              cargo run --quiet --release \
              --manifest-path benchmarks/c-kernel/Cargo.toml -- \
              --case "$CASE" --vertices 100000 --repetitions 5 \
              --output ".ci/performance/c-kernel/${CASE}.json"
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          record = {
              "schema": 1,
              "tested_sha": os.environ["CMG_BENCH_COMMIT"],
              "upstream_commit": "19752fc102f8cae8e34f66457bfaccb1aaa60375",
              "results": {
                  "path": json.loads(Path('.ci/performance/c-kernel/path.json').read_text()),
                  "worker_firm": json.loads(Path('.ci/performance/c-kernel/worker-firm.json').read_text()),
              },
          }
          Path('.ci/performance/c-kernel-latest.json').write_text(json.dumps(record, indent=2) + '\n')
          PY

      - name: Update live performance plan
        shell: python
        run: |
          from pathlib import Path

          path = Path('PERFORMANCE_PLAN.md')
          text = path.read_text()
          text = text.replace(
              '| P7 Pinned C comparison | NOT STARTED | One-thread Rust/C kernels agree numerically and are timed equivalently |',
              '| P7 Pinned C comparison | IN PROGRESS | Pinned `sspmv` agrees numerically and is timed equivalently; recursive-cycle comparison remains |',
          )
          marker = '## Approved parallel architecture\n'
          section = '''### P6/P7 continuation\n\n- Parallel setup kernels now use a conservative 65,536-item floor; heavy-edge selection also stays on the compact serial edge scan for sparse graphs where temporary CSR construction cannot amortize.\n- Forest splitting reuses traversal buffers instead of allocating two vectors for every leaf walk.\n- An isolated benchmark crate compiles the pinned official C `sspmv` arithmetic loop without MATLAB and compares it against the Rust edge-list Laplacian matvec on identical path and worker-firm graphs.\n- The C code remains benchmark-only and is never linked into the production Rust library. Numerical agreement is checked before any timing is accepted.\n\n'''
          if section not in text:
              if marker not in text:
                  raise SystemExit('performance plan architecture marker changed')
              text = text.replace(marker, section + marker)
          old = 'Collect matched 1/2/4/8-thread scaling results for CSR matvec and repeated-RHS throughput, tune the minimum parallel length and batch concurrency policy, and record memory-normalized speedups. Then begin P6 by parallelizing deterministic graph canonicalization, coarse contraction, and heavy-edge selection without changing hierarchy digests.'
          new = 'Inspect the pinned C `sspmv` comparison, extend the standalone reference harness to restriction/prolongation and the recursive preconditioner cycle, then qualify larger setup and repeated-RHS workloads. Within-solve parallel CMG/PCG remains a separate measured decision because across-RHS scheduling already scales well and does not duplicate hierarchy storage.'
          if old in text:
              text = text.replace(old, new)
          log_marker = '| 2026-08-22 | `636fa093` / `f17b377d` | Benchmark reconstruction repaired; all-feature debug/release tests passed on Ubuntu, macOS, and Windows |\n'
          additions = '''| 2026-08-22 | `3d76eb01` / `7e3ab0df` | Deterministic heavy-edge selection added; conservative setup routing validated |\n| 2026-08-22 | `fdf5b1de` | Forest traversal scratch reuse passed debug/release tests, Clippy, and rustdoc |\n'''
          if additions not in text:
              if log_marker not in text:
                  raise SystemExit('performance plan checkpoint marker changed')
              text = text.replace(log_marker, log_marker + additions)
          path.write_text(text)

      - name: Commit validated benchmark checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/add-c-kernel-benchmark.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: benchmark Rust matvec against pinned C kernel'
          git pull --rebase origin main
          git push origin HEAD:main
