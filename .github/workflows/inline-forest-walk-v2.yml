name: Repaired inline forest-walk buffer gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inline-forest-walk-v2.yml'

permissions:
  contents: write

concurrency:
  group: cmg-inline-forest-walk-v2
  cancel-in-progress: false

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify repaired inline forest diameter-walk storage
        shell: bash
        run: |
          set -euo pipefail
          python scripts/inline_forest_walk_gate_v2.py

      - name: Show retained decision
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.ci/performance/inline-forest-walk-latest.json || true
