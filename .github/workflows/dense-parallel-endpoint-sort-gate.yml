name: Density-routed parallel endpoint-first sort gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Qualify density-routed parallel endpoint sorting
        run: python scripts/dense_parallel_endpoint_sort_gate.py

      - name: Commit decision checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: record density-routed parallel endpoint sort gate'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Show decision
        if: always()
        shell: bash
        run: git show origin/main:.ci/performance/dense-parallel-endpoint-sort-latest.json || true
