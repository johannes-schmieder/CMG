[package]
name = "cmg-benchmarks"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
cmg = { path = "..", features = ["parallel", "profiling", "experimental-fused-rhs"] }

[[bin]]
name = "graph-build"
path = "src/bin/graph-build.rs"

[[bin]]
name = "hierarchy-build"
path = "src/bin/hierarchy-build.rs"

[[bin]]
name = "hierarchy-alloc"
path = "src/bin/hierarchy-alloc.rs"

[[bin]]
name = "terminal-build"
path = "src/bin/terminal-build.rs"

[[bin]]
name = "contraction-subphase-profile"
path = "src/bin/contraction-subphase-profile.rs"

[[bin]]
name = "scc-benchmark"
path = "src/bin/scc-benchmark.rs"

[[bin]]
name = "scc2-diagnostics"
path = "src/bin/scc2-diagnostics.rs"

[[bin]]
name = "plan-phase-profile"
path = "src/bin/plan-phase-profile.rs"

[[bin]]
name = "scc2-memory"
path = "src/bin/scc2-memory.rs"

[[bin]]
name = "cmg-bench"
path = "src/bin/cmg-bench.rs"

[[bin]]
name = "cmg-parallel-bench"
path = "src/bin/cmg-parallel-bench.rs"

[[bin]]
name = "teaching-supplement"
path = "src/bin/teaching-supplement.rs"

[[bin]]
name = "fixed-topology-sequence"
path = "src/bin/fixed-topology-sequence.rs"

[[bin]]
name = "fused-rhs-experiment"
path = "src/bin/fused-rhs-experiment.rs"
